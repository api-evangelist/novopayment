aid: novopayment
name: NovoPayment
description: NovoPayment is a Miami-headquartered banking-as-a-service and embedded-finance platform serving
  banks, fintechs, retailers and payment companies across the Americas. Its developer hub publishes an
  OAuth2-secured REST API suite spanning six product families — Card Solutions, Digital Banking, Digital
  Acquiring, Digital Wallets, Payments and Tokenization — covering card issuing and processing, digital
  account opening, KYC and compliance checks, customer and profile management, alias directories, real-time
  P2P payments, merchant-presented QR acceptance, payment authorization, and Visa/Mastercard token service
  provisioning including push provisioning to Apple Pay, Google Pay and Samsung Pay. Access runs through
  a self-service sandbox, with UAT and production promoted by request after project review.

description: Authorization decline and rejection codes NovoPayment publishes in its own OpenAPI response examples.
  The detail segment tracks ISO 8583-style reason codes (044 insufficient funds, 511-520 pick-up/fraud conditions),
  and the same detail number recurs across product segments (400.01.044 cards, 400.02.044 accounts, 400.08.044 payments).
envelope_field: code
masking:
  documented: false
  note: NovoPayment does not publish guidance on which decline reasons may be shown to a cardholder or buyer and
    which must be masked. Treat fraud/pick-up conditions (511-520) as issuer-only until the provider states otherwise.

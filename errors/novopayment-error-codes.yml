description: Response-code registry for the NovoPayment API surface, derived from the response examples in the provider's
  own OpenAPI documents. NovoPayment publishes a single ten-character code space (HTTP-status.product-segment.detail)
  that spans success and failure; this catalog records every distinct code that appears in the published contracts.
format: novopayment-response-code
envelope:
  fields:
  - name: code
    type: string
    description: Ten-character NovoPayment response code, HTTP-status.product-segment.detail (e.g. 400.01.044).
    example: 400.01.044
  - name: message
    type: string
    description: Human-readable description of the response code.
    example: Insufficient funds
  - name: datetime
    type: string(date-time)
    description: UTC timestamp the response was produced.
    example: '2020-01-03T16:05:56.517Z'
  - name: info
    type: string(uri)
    description: Optional link to the documentation for the operation that produced the error.
    example: https://developer.novopayment.com/api/sample-api/version-1/endpoint1
  - name: errors
    type: array
    description: 'Optional per-field validation detail; each item carries a message such as ''attributeOneCamelCase:
      Can not be null''.'
  media_type: application/json
  rfc9457: false
  note: NovoPayment does NOT use RFC 9457 application/problem+json. It returns a first-party envelope on every status,
    including success (200.xx.000 'Process Ok'), so the code field — not the HTTP status alone — carries the outcome.

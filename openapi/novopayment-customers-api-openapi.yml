openapi: 3.2.0
info:
  title: Novopayment Customers API
  version: v1
  description: 'Operations tagged Customers across 3 of this provider''s published API definitions: novopayment-compliance-openapi.yml, novopayment-customers-openapi.yml, novopayment-onboarding-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Sandbox
  url: https://sandbox-api.novopayment.com/kyc/v1
- description: Sandbox
  url: https://sandbox-api.novopayment.com/customers/v1
- description: Sandbox
  url: https://sandbox-api.novopayment.com/onboarding/v1
security:
- oAuth2ClientCredentials: []
tags:
- name: Customers
paths:
  /customers/{customerId}/info:
    post:
      summary: KYC Info
      description: Use this endpoint to update all KYC information (AML, OFAC, Biometric, etc.) obtained in the process of registering a client
      parameters:
      - $ref: '#/components/parameters/customerId'
      requestBody:
        $ref: '#/components/requestBodies/RQKYCInfo'
      responses:
        '200':
          $ref: '#/components/responses/RSKYCInfo200'
        '400':
          $ref: '#/components/responses/RSKYCInfo400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Customers
      operationId: postCustomersByCustomerIdInfo
      x-operation-id-source: derived
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/kyc/v1
  /customers/{customerId}/employees:
    post:
      summary: Customer Employment Information Update
      description: This operation updates the customer work information for the tenant´s administration staff.
      requestBody:
        $ref: '#/components/requestBodies/RQCustomerEmploymentInformationUpdate'
      operationId: CustomerEmploymentInformationUpdate
      parameters:
      - $ref: '#/components/parameters/customerId_2'
      responses:
        '200':
          $ref: '#/components/responses/RSCustomerEmploymentInformationUpdate200'
        '400':
          $ref: '#/components/responses/RSCustomerEmploymentInformationUpdate400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Customers
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/customers/v1
  /customers/{customerId}/generalinfo:
    get:
      summary: Customer General Information
      description: This operation returns the customer-general information.
      operationId: CustomerGeneralInformation
      parameters:
      - $ref: '#/components/parameters/customerId_2'
      responses:
        '200':
          $ref: '#/components/responses/RSCustomerGeneralInformation200'
        '400':
          $ref: '#/components/responses/RSCustomerGeneralInformation400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Customers
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/customers/v1
  /customers:
    get:
      summary: Customer List
      description: This operation allows to get the customer list registered in the system.
      operationId: CustomerList
      responses:
        '200':
          $ref: '#/components/responses/RSCustomerList200'
        '400':
          $ref: '#/components/responses/RSCustomerList400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Customers
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/customers/v1
  /customers/{customerId}/documents/{documentId}:
    get:
      summary: Get A Customer Document
      description: This operation allows to consult one of the customer's support documents from a document id.
      operationId: GetACustomerDocument
      parameters:
      - $ref: '#/components/parameters/customerId_2'
      - $ref: '#/components/parameters/documentId'
      responses:
        '200':
          $ref: '#/components/responses/RSGetACustomerDocument200'
        '400':
          $ref: '#/components/responses/RSGetACustomerDocument400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Customers
    patch:
      summary: Update Customer Identity Documents
      description: 'This operation allows to update a customer identity-specific document.


        This endpoint only updates the fields that are sent in the request body.'
      requestBody:
        $ref: '#/components/requestBodies/RQUpdateCustomerIdentityDocuments'
      operationId: UpdateCustomerIdentityDocuments
      parameters:
      - $ref: '#/components/parameters/customerId_2'
      - $ref: '#/components/parameters/documentId'
      responses:
        '200':
          $ref: '#/components/responses/RSUpdateCustomerIdentityDocuments200'
        '400':
          $ref: '#/components/responses/RSUpdateCustomerIdentityDocuments400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Customers
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/customers/v1
  /customers/{customerId}/logs:
    get:
      summary: Get Customer Action Logs
      description: This operation allows to consult the list of actions carried out by the customer in all the options of the application.
      operationId: GetCustomerActionLogs
      parameters:
      - $ref: '#/components/parameters/customerId_2'
      responses:
        '200':
          $ref: '#/components/responses/RSGetCustomerActionLogs200'
        '400':
          $ref: '#/components/responses/RSGetCustomerActionLogs400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Customers
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/customers/v1
  /customers/{customerId}/risks:
    get:
      summary: Get Customer Risk Indicators
      description: This operation allows to consult the customer's risk information studied by the anti-money laundering system (AML).
      operationId: GetCustomerRiskIndicators
      parameters:
      - $ref: '#/components/parameters/customerId_2'
      responses:
        '200':
          $ref: '#/components/responses/RSGetCustomerRiskIndicators200'
        '400':
          $ref: '#/components/responses/RSGetCustomerRiskIndicators400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Customers
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/customers/v1
  /customers/{customerId}/documents:
    get:
      summary: Get Supporting Documents
      description: This operation allows to consult the list of support documents mandatories established by the tenant to validate the customer's profile (Utility bill, Proof of employment, etc.).
      operationId: GetSupportingDocuments
      parameters:
      - $ref: '#/components/parameters/customerId_2'
      responses:
        '200':
          $ref: '#/components/responses/RSGetSupportingDocuments200'
        '400':
          $ref: '#/components/responses/RSGetSupportingDocuments400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Customers
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/customers/v1
  /customers/{customerId}/unsubscribe:
    post:
      summary: Unsubscribe Customer
      description: This operation allows to unsubscribe a customer. This operation cannot be undone.
      requestBody:
        $ref: '#/components/requestBodies/RQUnsubscribeCustomer'
      operationId: UnsubscribeCustomer
      parameters:
      - $ref: '#/components/parameters/customerId_2'
      responses:
        '200':
          $ref: '#/components/responses/RSUnsubscribeCustomer200'
        '400':
          $ref: '#/components/responses/RSUnsubscribeCustomer400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Customers
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/customers/v1
  /customers/{customerId}:
    patch:
      summary: Update Customer
      description: 'This operation allows to update customer-specific information.


        This endpoint only updates the fields that are sent in the request body.'
      requestBody:
        $ref: '#/components/requestBodies/RQUpdateCustomer'
      operationId: UpdateCustomer
      parameters:
      - $ref: '#/components/parameters/customerId_2'
      responses:
        '200':
          $ref: '#/components/responses/RSUpdateCustomer200'
        '400':
          $ref: '#/components/responses/RSUpdateCustomer400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Customers
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/customers/v1
  /customers/{customerId}/onboarding/decision:
    post:
      summary: Approve Account
      description: This operation allows the approval or rejection of a registration request, resulting in the creation of an account or also the creation of a card, this will depend on the configuration have selected.
      requestBody:
        $ref: '#/components/requestBodies/RQApproveAccount'
      operationId: ApproveAccount
      parameters:
      - $ref: '#/components/parameters/customerId_3'
      responses:
        '200':
          $ref: '#/components/responses/RSApproveAccount200'
        '400':
          $ref: '#/components/responses/RSApproveAccount400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Customers
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/onboarding/v1

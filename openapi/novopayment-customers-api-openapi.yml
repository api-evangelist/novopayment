    RSGetACustomerDocument400:
      type: object
      required:
      - code
      - message
      - datetime
      properties:
        code:
          type: string
          example: 400.18.003
          description: Operation response code
          minLength: 10
          maxLength: 10
        message:
          type: string
          example: Params required
          description: Response code description
          maxLength: 140
        datetime:
          type: string
          description: Opertion Timestamp
          example: '2020-01-03T16:05:56.517Z'
          format: date-time
    RSUpdateCustomer200:
      type: object
      required:
      - code
      - message
      - datetime
      - data
      properties:
        code:
          type: string
          description: Operation response code
          example: 200.18.000
          maxLength: 10
        message:
          type: string
          description: Response code description
          example: Process Ok
          maxLength: 140
        datetime:
          type: string
          description: Opertion Timestamp
          example: '2020-01-03T16:05:56.517Z'
          format: date-time
        data:
          type: object
          required:
          - customer
          properties:
            userCredentials:
              type: object
              description: 'User credentials object.

                Contains the user credentials information.

                '
              properties:
                username:
                  type: string
                  description: Username in the application.
                  example: JDOE
                  maxLength: 20
            generalInformation:
              type: object
              description: 'General information object.

                Contains the general customer’s information.

                '

  schemas:
    RQKYCInfo:
      type: object
      required:
      - biometricValidation
      - complianceLists
      properties:
        biometricValidation:
          type: object
          description: 'This object contains the summary of the images and validations that helped identify the identity of the client in the registry

            '
          required:
          - frontImageBase64
          - backImageBase64
          - selfieImageBase64
          - faceMatched
          - isValidDocument
          - validationDate
          properties:
            frontImageBase64:
              type: array
              description: Document’s front image in Base64 format.
              example: abc123=
              maxLength: 1
            backImageBase64:
              type: array
              description: Document’s back image in Base64 format.
              example: abc123=
              maxLength: 1
            selfieImageBase64:
              type: array
              description: Selfie image in Base64 format.
              example: abc123=
              maxLength: 1
            faceMatched:
              type: boolean
              description: 'Whether the face-match score resulted in a true match.

                '
              example: false
              enum:
              - true
              - false
              minLength: 5
              maxLength: 5
            isValidDocument:
              type: boolean
              description: 'True or False. Whether the document number exists or not.

                '
              example: false
              enum:
              - true
              - false
              minLength: 5
              maxLength: 5
            imgSpoofed:
              type: boolean
              description: 'Whether the identity document is real (not from a screenshot) or it’s valid base on its template.Possible values: False if the process was not spoofed.​

                '
              example: false
              enum:
              - true
              - false
              minLength: 5
              maxLength: 5
            validationDate:
              type: string
              example: '2020-01-03T16:05:56.517Z'
              description: Date the validation was performed.
              format: date-time
        complianceLists:
          type: object
          description: 'list of compliance institutions where the client was consulted

            '
          required:
          - listKey
          - name
          - hasHit
          - validationDate
          properties:
            listKey:
              type: string
              description: List unique key currently scanned.
              example: OFAC
              maxLength: 30
            name:
              type: string
              description: A descriptive name of the list.
              example: OFAC
              maxLength: 50
            hasHit:
              type: boolean
              description: 'Whether the customer has hits or not on the current list.

                '
              example: false
              enum:
              - true
              - false
              minLength: 5
              maxLength: 5
            score:
              type: number
              description: 'Resulting score. E.g: 1 meaning 100% full match on the list.

                '
              example: 0.8
              multipleOf: 28.2
            validationDate:
              type: string
              example: '2020-01-03T16:05:56.517Z'
              description: Date the validation was performed.
              format: date-time
    RSKYCInfo400:
      type: object
      properties:
        code:
          type: string
          example: 400.08.003
          description: Operation response code
          minLength: 10
          maxLength: 10
        message:
          type: string
          example: Params required
          description: Response code description
          maxLength: 140
        datetime:
          type: string
          example: '2020-01-03T16:05:56.517Z'
          format: date-time
    RS500:

    RQDeviceTokenBinding:
      type: object
      required:
        - tokenRequestorID
        - tokenReferenceID
        - panReferenceID
        - walletAccountEmailAddressHash
        - clientWalletAccountID
        - deviceInfo
      properties:
        tokenRequestorID:
          type: integer
          description: |
            Unique ID assigned to the client requesting the token. This value is
            assigned by Visa when creating the VTS project.
          example: 40022358888
        tokenReferenceID:
          type: string
          description: |
            Unique ID associating a token with a card. This ID can be used in
            future calls to make operations related to the token in the I-TSP.
          example: DNITHE30194726875288888
        panReferenceID:
          type: string
          description: |
            Unique ID representing a card. This ID can be used in future calls
            referred to the card in the Tokenization flow.
          example: V-3019231458906209630635
        walletAccountEmailAddressHash:
          type: string
          description: |
            Hash of the email from which the account is opened in the wallet
            that sends the request.
          maxLength: 64
        clientWalletAccountID:
          type: string
          description: |
            Identifier of the wallet that sends the request.
            Client provided consumer ID that identifies the wallet account
            holder entity
          maxLength: 32
        deviceInfo:
          $ref: "#/components/schemas/ObjDeviceInformation_ForBinding"
        tokenUserInfo:
          $ref: "#/components/schemas/ObjTokenUserInfo"
        merchantInfo:
          $ref: "#/components/schemas/ObjMerchantInfo"
    RQCardInfo:
      type: object
      required:
        - cardIdList
      properties:
        cardIdList:
          type: array
          description: |
            List of card ids. Each id corresponds to a card whose information is requested.
          example:
            - 866f4af6-69a8-4c51-9940-95bdd05124c6
            - f18eaabb-bdce-43eb-b17a-e5560f36687c
    RQCardholderVerificationMethods:
      type: object
      required:
        - tokenRequestorID
        - tokenReferenceID
        - panReferenceID
        - walletAccountEmailAddressHash
        - clientWalletAccountID
      properties:
        tokenRequestorID:
          type: integer
          description: |
            Unique ID assigned to the client requesting the token. This value is
            assigned by Visa when creating the VTS project.
          example: 40022358888
        tokenReferenceID:
          type: string
          description: |
            Unique ID associating a token with a card. This ID can be used in
            future calls to make operations related to the token in the I-TSP.
          example: DNITHE30194726875288888
        panReferenceID:
          type: string
          description: |
            Unique ID representing a card. This ID can be used in future calls
            referred to the card in the Tokenization flow.
          example: V-3019231458906209630635
        panSource:
          type: string
          description: |
            Origin of the information of the PAN.

            Allowed values:
            - KEY_ENTERED
            - ON_FILE
            - MOBILE_BANKING_APP
            - TOKEN
            - CHIP_DIP
            - CONTACTLESS_TAP
          enum:
            - KEY_ENTERED
            - ON_FILE
            - MOBILE_BANKING_APP
            - TOKEN
            - CHIP_DIP
            - CONTACTLESS_TAP
          example: MOBILE_BANKING_APP
        otpReason:
          type: string
          description: |
            	OTP reason the descriptions may vary in agreement with the issuer.

              Allowed values:
              - PROVISIONING
              - FPAN_NOTIFICATIONS
              - PAYMENT
              - TOKEN_DEVICE_BINDING
              - CARDHOLDER_STEPUP
              - TRUSTED_LISTING_ENROLLMENT
          enum:
            - PROVISIONING
            - FPAN_NOTIFICATIONS
            - PAYMENT
            - TOKEN_DEVICE_BINDING
            - CARDHOLDER_STEPUP
            - TRUSTED_LISTING_ENROLLMENT
        otpMaxReached:
          type: boolean
          description: |
            	If this field is active, it means the user with the referenced
              token has exceeded the number of requests for authentication
              methods or OTP requests, thus, the response must not include the
              value when requesting them again.
        clientWalletAccountID:
          type: string
          description: |
            Identifier of the wallet that sends the request.
            Client provided consumer ID that identifies the wallet account
            holder entity
          maxLength: 32
        deviceInfo:
          description: | 
              Device Information containing the device model.
              It is required for TOKEN DEVICE BINDING.
          $ref: "#/components/schemas/ObjDeviceInformation"
        tokenInfo:
          description: | 
              Structure with token information - Optional.
          $ref: "#/components/schemas/ObjTokenInfo"
        encryptedData:
          type: object
          description: |
            Encrypted payload data.
            Only primaryAccountNumber needs to be provided in CardholderInfo.
          maxLength: 7000
          properties:
            cardholderInfo:
              $ref: "#/components/schemas/ObjCardHolderInfo"
        cardToken:
          type: string
          description: >
            Unique Card Identifier at NovoPayment’s Issuance Service.
          maxLength: 40
          example: 5DA...27
    RQNotification:
      type: object
      required:
        - eventType
        - messageReasonCode
        - dateTimeOfEvent
      properties:
        eventType:
          type: string
          description: |
            Type of event this value is important to recognize the fields that
            is going to receive in the notification.

            Available values:
            - TOKEN_CREATED
            - TOKEN_STATUS_UPDATED
            - TOKEN_ACTIVATION_STIP
            - PAN_UPDATED
            - CARD_METADATA_UPDATED
            - ACCOUNT_LEVEL_RECORD
            - THREE_DS_ACTIVATION
            - ACCOUNT_LEVEL_RECORD_UPDATE
            - PUSH_PROVISIONING_STATUS
            - PUSH_ENROLLMENT_STATUS
            - CTP_ENROLLMENT_ATTEMPT
          enum:
            - TOKEN_CREATED
            - TOKEN_STATUS_UPDATED
            - TOKEN_ACTIVATION_STIP
            - PAN_UPDATED
            - CARD_METADATA_UPDATED
            - ACCOUNT_LEVEL_RECORD
            - THREE_DS_ACTIVATION
            - ACCOUNT_LEVEL_RECORD_UPDATE
            - PUSH_PROVISIONING_STATUS
            - PUSH_ENROLLMENT_STATUS
            - CTP_ENROLLMENT_ATTEMPT
          maxLength: 25
          example: TOKEN_CREATED
        panReferenceID:
          type: string
          description: |
            Unique ID representing a card. This ID can be used instead of the
            PAN number for subsequent calls such as notifications or life cycle
            management.

            Not present when evenType is CARD_METADATA_UPDATED.
          maxLength: 32
          example: V-3019231458906209630635
        tokenReferenceID:
          type: string
          description: |
            Unique ID associating a token with a card. This ID can be used in
            future calls to make operations related to the token in the I-TSP
            for example events related to the management of the life cycle.

            Not present when eventType is PAN_UPDATED or CARD_METADATA_UPDATED
            OR ACCOUNT_LEVEL_RECORD.
          maxLength: 32
          example: DNITHE30194726875288888
        tokenRequestorID:
          type: integer
          description: |
            Unique ID assigned to the client requesting the token. This value
            is assigned by Visa when creating the VTS project.

            Not present when eventType is PAN_UPDATED or CARD_METADATA_UPDATED
            OR ACCOUNT_LEVEL_RECORD
          example: 40022358888
        messageReasonCode:
          type: string
          description: |
            Message reason code.
            The descriptions may vary in previously agreement with the issuer.

            Available values:
            - TOKEN_CREATED
            - TOKEN_DEACTIVATED
            - TOKEN_SUSPEND
            - TOKEN_RESUME
            - DEVICE_PROVISIONING_RESULT
            - OTP_VERIFICATION_RESULT
            - CALL_CENTER_ACTIVATION
            - MOBILE_BANK_APP_ACTIVATION
            - LUK_REPLENISHMENT
            - DEVICE_PROVISIONING
            - REPERSONALIZATION_RESULT
            - TOKEN_EXPIRY_DATE_UPDATED
            - TOKEN_DEVICE_BINDING_RESULT
            - CARDHOLDER_STEPUP_RESULT
            - RUSTED_LISTING_ENROLLMENT_RESULT
            - TOKEN_DEVICE_BINDING_REMOVED
            - ACCOUNT_UPDATE
            - EXP_DATE_UPDATE
            - CARD_METADATA_UPDATED
            - TOKEN_ACTIVATION_STIP
            - ACCOUNT_LEVEL_RECORD_UPDATE
            - THREE_DS_ACTIVATION
          enum:
            - TOKEN_CREATED
            - TOKEN_DEACTIVATED
            - TOKEN_SUSPEND
            - TOKEN_RESUME
            - DEVICE_PROVISIONING_RESULT
            - OTP_VERIFICATION_RESULT
            - CALL_CENTER_ACTIVATION
            - MOBILE_BANK_APP_ACTIVATION
            - LUK_REPLENISHMENT
            - DEVICE_PROVISIONING
            - REPERSONALIZATION_RESULT
            - TOKEN_EXPIRY_DATE_UPDATED
            - TOKEN_DEVICE_BINDING_RESULT
            - CARDHOLDER_STEPUP_RESULT
            - RUSTED_LISTING_ENROLLMENT_RESULT
            - TOKEN_DEVICE_BINDING_REMOVED
            - ACCOUNT_UPDATE
            - EXP_DATE_UPDATE
            - ACCOUNT_LEVEL_RECORD_UPDATE
            - CARD_METADATA_UPDATED
            - TOKEN_ACTIVATION_STIP
            - THREE_DS_ACTIVATION

          example: TOKEN_CREATED
        dateTimeOfEvent:
          type: string
          format: date-time
          description: |
            Date and time of the event.
            Format: yyyy-MM-ddTHH:mm:ss.SSSz The time zone is GMT.
        encryptedData:
          $ref: "#/components/schemas/ObjNotificationEncryptedData"
        tokenInfo:
          $ref: "#/components/schemas/ObjTokenInfo"
        deviceInfo:
          $ref: "#/components/schemas/ObjDeviceInformation"
        tokenUserInfo:
          $ref: "#/components/schemas/ObjTokenUserInfo"
        merchantInfo:
          $ref: "#/components/schemas/ObjMerchantInfo"
        actionCode:
          type: string
          description: >
            Action code to indicate Visa for which flow it should go.

            In case the provisioning of the token is approved, the values are:


            - 00 - Green path, indicates that the token is provisioned and
              automatically activated for payments.
            - 85 - Yellow path, indicates that the token is provisioned and the
              client must be authenticated to activate the token. In case the
              provisioning is not approved, the code must be within the following.
            - N7 - incorrect CVV2

            - 14 - Invalid card number

            - 54 - Invalid expiration date

            - 05 - Generic rejection

            - 96 - Internal system error
          enum:
            - "00"
            - "85"
            - N7
            - "14"
            - "54"
            - "05"
            - "96"
          example: "00"
        lifeCycleTraceID:
          type: number
          description: |
            Identification of the process.
            Present when eventType is TOKEN_STATUS_UPDATED or TOKEN_CREATED
          maxLength: 15
        tokenRequestorTspID:
          type: string
          description: |
            Identification of the token requestor token service provider.
            Not present on evenType PAN_UPDATED or CARD_METADATA_UPDATED.
          maxLength: 11
        tokenUpdateChannel:
          type: string
          description: |
            Conditional, Token update channel. 
            It is present when the messageReasonCode is TOKEN_EXPIRY_DATE_UPDATED and the date is updated via the Visa Issuer OBO Credential Update Service.
          example: ISSUER_OBO_LCM
        panUpdateChannel:
          type: string
          description: |
            Conditional, PAN update channel.
             It is present when the messageReasonCode is EXP_DATE_UPDATE and the date is updated via the Visa Issuer OBO Credential Update Service.
          example: ISSUER_OBO_LCM
        accountLevelInfoResp:
          $ref: "#/components/schemas/ObjAccountLevelInfoResp"
         
        clientWalletAccountID:
          type: string
          description: |
            Identifier of the wallet that sends the request.
            Client provided consumer ID that identifies the wallet account
            holder entity
          maxLength: 32
        panSource:
          type: string
          description: |
            Origin of the information of the PAN.

            Allowed values:
            - KEY_ENTERED
            - ON_FILE
            - MOBILE_BANKING_APP
            - TOKEN
            - CHIP_DIP
            - CONTACTLESS_TAP
          enum:
            - KEY_ENTERED
            - ON_FILE
            - MOBILE_BANKING_APP
            - TOKEN
            - CHIP_DIP
            - CONTACTLESS_TAP
          example: KEY_ENTERED
        cvv2ResultsCode:
          type: string
          description: >
            Result code of the validation of CVV2 made by VISA.
            Present when eventType is TOKEN_CREATED or TOKEN_ACTIVATION_STIP in some cases this value could be null.

            Available Values:

            - M: The CVV2 is match.

            - N: The CVV2 enter by the user is incorrect.

            - P: The CVV2 was not validate.

            - S: Indicates that V.I.P. or the issuer was unable to perform CVV2
              verification.

            - U: Issuer was not available does not participate in the CVV2
              Service or that STIP has responded to an issuer-unavailable
              response.

            -  NULL: When the provisioning process occured without CVV
          enum:
            - M
            - N
            - P
            - S
            - U
            - NULL
          maxLength: 1
          example: M
        consumerEntryMode:
          type: string
          description: |
            Method of consumer entry.

            Available values:
            - KEY_ENTERED
            - CAMERA_CAPTURED
            - UNKNOWN

            Could be present when eventType is TOKEN_CREATED or
            TOKEN_ACTIVATION_STIP.
          enum:
            - KEY_ENTERED
            - CAMERA_CAPTURED
            - UNKNOWN
        locale:
          type: string
          description: |
            The language for the app if need a country code should be separated
            using a “_“.Example: en_US.

            Format: String; ISO language ISO 639-1 and alpha-2 country code ISO
            3166-1 alpha-2.

            Could be present when eventType is TOKEN_CREATED or
            TOKEN_ACTIVATION_STIP.
          maxLength: 5
          example: en_US
        termsAndConditions:
          $ref: "#/components/schemas/ObjTermsAndConditions"
        stipReasonCode:
          type: string
          description: >
            STIP Response code only present when eventType is

            TOKEN_ACTIVATION_STIP.


            Available Values for VISA:

            - 9011: The line to issuer is down.

            - 9012: Forced STIP because of N0 (Force STIP) original response from issuer.

            - 9020: Issuer Time Out.

            - 9027: ECIP RTD Decline. Sent by CVV2 or RTD upon decline.

            - 9203: Decline due to Office of Foreign Assets Control (OFAC) embargo.

            - 9206: Mod-10 check failure.

            - 9208: Declined because issuing identifier and/or routing identifier is blocked.

            - 9210: Declined because of issuer participation options.

            - 9212: Declined due to fraud condition.

            - 9216: Ineligible data for Token Type. Token is not a device-based one.

            - 9217: Loyalty personalized data input is incorrect.

            - 9061: Switch Detected Error. Sent by Visa by default.
          enum:
            - 9011
            - 9012
            - 9020
            - 9027
            - 9203
            - 9206
            - 9208
            - 9210
            - 9212
            - 9216
            - 9217
            - 9061
          maxLength: 4
          example: 9011
        activationVerificationResult:
          type: string
          description: |
            Result of the verification this notification is available when de
            provisioning is in yellow flow.

            Will be present when messageReasonCode is OTP_VERIFICATION_RESULT or
            MOBILE_BANK_APP_ACTIVATION.

            Available values:
            - VERIFICATION_SUCCESS
            - VERIFICATION_CODE_EXPIRED
            - VERIFICATION_CODE_FAILED
            - VERIFICATION_CODE_MISSING
            - VERIFICATION_CODE_RETRIES_EXCEEDED
          enum:
            - VERIFICATION_SUCCESS
            - VERIFICATION_CODE_EXPIRED
            - VERIFICATION_CODE_FAILED
            - VERIFICATION_CODE_MISSING
            - VERIFICATION_CODE_RETRIES_EXCEEDED
          maxLength: 100
        statusCode:
          type: string
          description: |
            (Conditional) Action status codes. Required for the PUSH_PROVISIONING_STATUS and PUSH_ENROLLMENT_STATUS event types;
             not used with the CTP_ENROLLMENT_ATTEMPT event type..

            Available values:
            - SUCCESS
            - FAILURE
            - NOTIFICATION_FAILURE
            - PROVISION_FAILURE
            - ENROLLMENT_FAILURE
            - ENROLLMENT_CANCELLED
          enum:
            - SUCCESS
            - FAILURE
            - NOTIFICATION_FAILURE
            - PROVISION_FAILURE
            - ENROLLMENT_FAILURE
            - ENROLLMENT_CANCELLED
          maxLength: 100
        cardHolderStepupResult:
          type: string
          description: |
            Result of the verification about cardholder.
            Will be present when messageReasonCode is CARDHOLDER_STEPUP_RESULT.

            Available values:
            - CARDHOLDER_STEPUP_OTP
            - CARDHOLDER_STEPUP_CALL_CENTER
            - CARDHOLDER_STEPUP_ISSUER_APP
            - CARDHOLDER_STEPUP_APPROVED
            - CARDHOLDER_STEPUP_THREE_DS
          enum:
            - CARDHOLDER_STEPUP_OTP
            - CARDHOLDER_STEPUP_CALL_CENTER
            - CARDHOLDER_STEPUP_ISSUER_APP
            - CARDHOLDER_STEPUP_APPROVED
            - CARDHOLDER_STEPUP_THREE_DS
          maxLength: 100
        deviceBindingResult:
          type: string
          description: |
            Result of a token device binding. Will be present when
            messageReasonCode is TOKEN_DEVICE_BINDING_RESULT.
            Available values:
            - DEVICE_BINDING_APPROVED
            - DEVICE_BINDING_OTP
            - DEVICE_BINDING_CALL_CENTER
            - DEVICE_BINDING_ISSUER_APP
            - DEVICE_BINDING_REMOVED
            - DEVICE_BINDING_THREE_DS
            - DEVICE_BINDING_IMPLICITLYAPPROVED
          enum:
            - DEVICE_BINDING_APPROVED
            - DEVICE_BINDING_OTP
            - DEVICE_BINDING_CALL_CENTER
            - DEVICE_BINDING_ISSUER_APP
            - DEVICE_BINDING_REMOVED
            - DEVICE_BINDING_THREE_DS
            - DEVICE_BINDING_IMPLICITLYAPPROVED
          maxLength: 100
        deviceId:
          type: string
          description: >
            When the provisioning is in a SE wallets providers this value is
            the

            SE ID in hex binary characters.

            In an HCE wallet is the device ID determined for the wallet.

            Will be present when messageReasonCode is TOKEN_DEVICE_BINDING_RESULT.
          maxLength: 48
        taskID:
          type: string
          description: |
            Present only when messageReasonCode is CARD_METADATA_UPDATED.
            This value is an GUID hyphens to identify the task.
          maxLength: 36

        errorCode:
          type: string
          description: |
            Present only when messageReasonCode is CARD_METADATA_UPDATED.
            For VISA is the Business error code starts with VSEXXXXX
          maxLength: 8
        cardToken:
          type: string
          description: |
            Unique Card Identifier at NovoPayment’s Issuance Service.
          maxLength: 40
          example: 5DA...27
    ObjAccountLevelInfoResp:
      type: object
      properties:
        rpinEnrollment:

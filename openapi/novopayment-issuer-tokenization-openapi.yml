          description: Response code description
          example: Header Params Required
          maxLength: 140
        datetime:
          type: string
          example: "2022-04-25T23:19:12.000Z"
          description: >
            Operation Time Stamp in ISO 8601 format<br>date-time - the
            date-time notation as defined by [RFC 3339, section
            5.6](https://tools.ietf.org/html/rfc3339#section-5.6), for example,
            2017-07-21T17:32:28Z
          minLength: 24
          maxLength: 24
    RS401Tk:
      type: object
      properties:
        code:
          type: string
          example: 401.22.992
          description: Operation response code
          minLength: 10
          maxLength: 10
        message:
          type: string
          example: Invalid signature
          description: Response code description
          maxLength: 140
        datetime:
          type: string
          example: "2022-04-25T23:19:12.000Z"
          minLength: 24
          maxLength: 24
    RS500Tk:
      type: object
      properties:
        code:
          type: string
          example: 500.22.999
          description: Operation response code
          minLength: 10
          maxLength: 10
        message:
          type: string
          example: Internal Server Error
          description: Response code description
          maxLength: 140
        datetime:
          type: string
          example: "2022-04-25T23:19:12.000Z"
          minLength: 24
          maxLength: 24


          $ref: "#/components/schemas/ObjLinkEnrollment"
      
    ObjRpinEnrollment:
      type: object
      properties:
        responseStatus:
          type: string
          description: |
            RPIN enrollment response status.
            Available values:
            - S
            - F
          enum:
            - S
            - F
        rejectCode:
          type: string
          maxLength: 2
          description: |
            Contains the Reject Code for the failure. Present only when the Response Status = F.
          example: ER
        rejectDesc:
          type: string
          maxLength: 100
          description: |
           Contains the Reject Reason for the failure. Present only when the Response Status = F.
          example: ERROR DETAIL


    ObjReplaceEnrollment:
      type: object
      properties:
        responseStatus:
          type: string
          description: |
            Response status value.
            Available values:
            - S
            - W
            - F

          enum:
            - S
            - W
            - F
        rejectCode:
          type: string
          maxLength: 2
          description: |
            Contains the Reject Code for the failure. Present only when the Response Status = F.
          example: ER
        rejectDesc:
          type: string
          maxLength: 100
          description: |
           Contains the Reject Reason for the failure. Present only when the Response Status = F.
          example: ERROR DETAIL

    ObjLinkEnrollment:
      type: object

  parameters:
    clientID:
      name: clientID
      in: path
      description: Unique tenant identifier for tokenization services. |
        Please contact our team to know it.
      required: true
      example: us-novopayment
      schema:
        type: string
        maxLength: 32
    
    XRequestId:
      name: X-Request-Id
      in: header
      description: |
        Unique ID for the API request.
        This ID is the reference in all the API’s processes.
      schema:
        type: string
        maxLength: 36
    
    Accept:
      name: Accept
      in: header
      required: true
      description: |
        Content types that are acceptable related to this operation.

        Sample: application / json; charset = UTF-8
      schema:
        type: string
        maxLength: 36
    
    ContentType:
      name: Content-Type
      in: header
      required: true
      description: |
        Response body type. Operation related information.

        It is not required if the body of the request is empty, like a “GET” request.

        Sample: application / json; charset = UTF-8
      schema:
        type: string
    
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: |
        Language accepted in the response.

        The default value is "en-US".

        Sample: en-US.
      schema:
        type: string
    
    ContentLanguage:
      name: Content-Language
      in: header
      description: |
        Language of the request.

        The default value is "en-US".

        Sample: en-US.
      schema:
        type: string
        maxLength: 36
    
    apikey:
      name: apikey
      in: header
      description: |
        Obtained Client ID in NovoPayment’s developer hub, that identifies the
        client that sends the request.

        Sample:dbhCR5oPkopFI7OXmGkYFDVpmABxuWMx
      required: true
      schema:
        type: string
    
    Xversion:
      name: X-version
      in: header
      description: |
        Version of the NovoPayment SDK and client’s application, separately by |.

        Example: SDK 1.2.2 | APP 5.0
      schema:
        type: string
    
    Xdevice:
      name: X-device
      in: header
      description: |
        Version of the consumers device software information.

        Example: "AUEORP382MS"
      schema:
        type: string
    
    XTenantId:
      name: X-Tenant-Id
      in: header
      description: |
        Unique identifier of the tenant.
      required: true
      schema:
        type: string
    
    XRelationshipId:
      name: X-Relationship-Id
      in: header
      description: |
        Identification of the relation between the caller and the TokenRequestor.
      required: true
      schema:
        type: string

  schemas:
    RQApproveProvision:
      type: object
      required:
        - tokenRequestorID
        - tokenReferenceID
        - panReferenceID
        - panSource
        - walletAccountEmailAddress
        - clientWalletAccountID
        - tokenInfo
        - encryptedData
      properties:
        tokenRequestorID:
          type: integer
          description: |
            Unique ID assigned to the client requesting the token.
          example: 40022358888
        tokenReferenceID:
          type: string
          description: |
            Unique ID associating a token with a card. This ID can be used in
            future calls to make operations related to the token in the I-TSP.
          example: DNITHE30194726875288888
        panReferenceID:
          type: string
          description: |
            Unique ID representing a card. This ID can be used in future calls
            referred to the card in the Tokenization flow.
          example: V-3019231458906209630635
        panSource:
          type: string
          description: |
            Origin of the information of the PAN.

            Allowed values:
            - KEY_ENTERED
            - ON_FILE
            - MOBILE_BANKING_APP
            - TOKEN
            - CHIP_DIP
            - CONTACTLESS_TAP
          enum:
            - KEY_ENTERED
            - ON_FILE
            - MOBILE_BANKING_APP
            - TOKEN
            - CHIP_DIP
            - CONTACTLESS_TAP
          example: KEY_ENTERED
        cvv2ResultsCode:
          type: string
          description: >
            Result code of the validation of CVV2 made by VISA.

            Available Values:

            - M: The CVV2 is match.

            - N: The CVV2 enter by the user is incorrect.

            - P: The CVV2 was not validate.

            - S: Indicates that V.I.P. or the issuer was unable to perform CVV2
              verification.

            - U: Issuer was not available does not participate in the CVV2
              Service or that STIP has responded to an issuer-unavailable
              response.

            -  NULL: When the provisioning process occured without CVV
          enum:
            - M
            - N
            - P
            - S
            - U
            - NULL
          maxLength: 1
          example: M
        walletAccountEmailAddress:
          type: string
          description: |
            Hash of the email account from which the account is opened in the
            wallet that sends the request.
          maxLength: 64
          example: 5DA...27
        clientWalletAccountID:
          type: string
          description: >
            Identifier of the wallet that sends the request.

            Client provided consumer ID that identifies the wallet account holder

            entity.
          maxLength: 32
          example: 5DA...D8
        addressVerificationResultCode:
          type: string
          description: |
            Code that describes the result of an address verification.
          maxLength: 1
          example: 5DA...D8
        ConsumerEntryMode:
          type: string
          description: |
            Method of consumer entry.

            Available values:
            - KEY_ENTERED
            - CAMERA_CAPTURED
            - UNKNOWN
          enum:
            - KEY_ENTERED
            - CAMERA_CAPTURED
            - UNKNOWN
          example: KEY_ENTERED
        locale:
          type: string
          description: |
            The language for the app,if need a country code should be separated
            using a “_“.

            Example: en_US

            Format: String; ISO language ISO 639-1 and alpha-2 country code
            ISO 3166-1 alpha-2
          maxLength: 5
          example: en_US
        deviceInfo:
          $ref: "#/components/schemas/ObjDeviceInformation"
        tokenInfo:
          $ref: "#/components/schemas/ObjTokenInfo"
        encryptedData:
          type: object
          description: |
            Represents the encrypted payload, contains Cardholder Information and Risk Information with the applicable information.
          properties:
            cardholderInfo:
              $ref: "#/components/schemas/ObjCardHolderInfo_Provisioning"
            riskInfo:
              $ref: "#/components/schemas/ObjRiskInfo"
    RQCheckEligibility:
      type: object
      required:
        - tokenRequestorID
        - tokenReferenceID
        - panReferenceID
        - panSource
        - deviceInfo
        - encryptedData
      properties:
        tokenRequestorID:
          type: integer
          description: |
            Unique ID assigned to the client requesting the token. This value is
            assigned by Visa when creating the VTS project.
          example: 40022358888
        tokenReferenceID:
          type: string
          description: |
            Unique ID associating a token with a card. This ID can be used in
            future calls to make operations related to the token in the I-TSP.
          example: DNITHE30194726875288888
        panReferenceID:
          type: string
          description: |
            Unique ID representing a card. This ID can be used in future calls
            referred to the card in the Tokenization flow.
          example: V-3019231458906209630635
        panSource:
          type: string
          description: |
            Origin of the information of the PAN.

            Allowed values:
            - KEY_ENTERED
            - ON_FILE
            - MOBILE_BANKING_APP
            - TOKEN
            - CHIP_DIP
            - CONTACTLESS_TAP
          enum:
            - KEY_ENTERED
            - ON_FILE
            - MOBILE_BANKING_APP
            - TOKEN
            - CHIP_DIP
            - CONTACTLESS_TAP
          example: MOBILE_BANKING_APP
        deviceInfo:
          description: |
            When the token is for an specific device, The object must have deviceID and deviceLanguageCode.
          $ref: "#/components/schemas/ObjDeviceInformationEligibility"
        encryptedData:
          type: object
          description: Represents the encrypted payload
          properties:
            cardholderInfo:
              $ref: "#/components/schemas/ObjCardHolderInfo_PANExpiryDate"
    ObjTokenInfo:
      type: object
      description: |
        Structure with token information, the content available could be different in each API service.
      properties:
        token:
          type: string
          maxLength: 19
          description: The token associated with the PAN.
          example: ...
        tokenType:
          type: string
          maxLength: 32
          description: |
            Token type.

            Available values.
            - ECOMMERCE
            - SECURE_ELEMENT
            - CARD_ON_FILE
            - HCE
            - QRC
          enum:
            - ECOMMERCE
            - SECURE_ELEMENT
            - CARD_ON_FILE
            - HCE
            - QRC
          example: ECOMMERCE
        tokenStatus:
          type: string
          description: |
            Token status.

            Available values:
            - INACTIVE : The token was created but the activation process is pending.
            - ACTIVE : The token was Activated successfully.
            - SUSPENDED : The token was suspended.
            - DEACTIVATED : The token was eliminated.
          enum:
            - INACTIVE
            - ACTIVE
            - SUSPENDED
            - DEACTIVATED
          example: ACTIVE
        tokenExpirationDate:
          $ref: "#/components/schemas/ObjExpirationDate"
        tokenRequestorName:
          type: string
          maxLength: 100
          description: |
            Token requestor name.
          example: "NovoPayment Wallet"
        tokenAssuranceMethod:
          type: string
          maxLength: 19
          description: |
            Method of Issuer ID&V that has taken place at time of provisioning,
            device binding.
            - 00 Cardholder Verification was Not Performed
            - 10 Card Issuer Account Verification
            - 11 Card Issuer Interactive Cardholder Verification - 1 Factor
            - 12 Card Issuer Interactive Cardholder Verification - 2 Factor
            - 13 Card Issuer Risk Oriented Non-Interactive Cardholder
              Authentication
            - 14 Card Issuer Asserted Authentication
          example: "00"
        numberOfActiveTokensForPAN:
          type: number
          maxLength: 4
          description: |
            Number of device tokens that are currently active for this PAN.
          example: 2
        numberOfInactiveTokensForPAN:
          type: number
          maxLength: 4
          description: |
            Number of device tokens that are currently inactive.
            (device tokens have not been activated) for this PAN
          example: 2
        numberOfSuspendedTokensForPAN:
          type: number
          maxLength: 4
          description: |
            Number of device tokens that were activated but are
            suspended for payments for this PAN.
          example: 0
        tokenActivationDate:
          type: string
          format: date-time
          description: |
            System date/timestamp, in GMT, of token activation into an active
            state. For an inactive state, this field is left empty and populated
            only when a token transitions to an active state. If a token
            is suspended, this field is populated with the new date/timestamp of
            when an active state resumes.

            Format: yyy-MM-ddTHH:mm:ss.SSSZ
          example: "2022-04-25T23:19:12.000Z"
        tokenDeactivationDate:
          type: string
          description: |
            Date of token deactivation.

            This field is left empty and populated only when a token transitions
            to an Inactive state.
          example: ...
        lastTokenStatusUpdatedTime:
          type: string
          maxLength: 19
          description: |
            Original Token account number.

            This field is populated only when performing token for token
            provisioning, this mean the panSource is equal to TOKEN.
          example: ...
        originalToken:
          type: string
          maxLength: 19
          description: |
            Original Token account number.

            This field is populated only when performing token for token
            provisioning, this mean the panSource is equal to TOKEN.
          example: ...
        originalTokenRequestorID:
          type: number
          maxLength: 4
          description: |
            Unique ID assigned to the initiator of the OriginalToken request.

            This field is populated only when performing token for token
            provisioning, this mean the panSource is equal to TOKEN.
          example: ...
        originalTokenReferenceID:
          type: string
          maxLength: 32
          description: |
            Unique ID for the OriginalToken associated with the PAN.

            This field is populated only when performing token for token
            provisioning, this mean the panSource is equal to TOKEN.
          example: ...
        originalTokenType:
          type: string
          description: |
            Token type of the original token.

            This field is populated only when performing token for token
            provisioning, this mean the panSource is equal to TOKEN.
            Format: It is one of the following values:
            - SECURE_ELEMENT
            - HCE
            - CARD_ON_FILE
            - ECOMMERCE
            - QRC
          enum:
            - SECURE_ELEMENT
            - HCE
            - CARD_ON_FILE
            - ECOMMERCE
            - QRC
          example: SECURE_ELEMENT
        originaltokenAssuranceMethod:
          type: string
          description: >
            Original token assurance method.


            This field is populated only when performing token for token

            provisioning, this mean the panSource is equal to TOKEN.

            - 00 ID&V Not Performed

            - 10 Card Issuer Account Verification

            - 11 Card Issuer Interactive Cardholder Verification - 1 Factor

            - 12 Card Issuer Interactive Cardholder Verification - 2 Factor

            - 13 Card Issuer Risk Oriented Non-Interactive Cardholder Authentication

            - 14 Card Issuer Asserted Authentication
          enum:
            - "00"
            - "10"
            - "11"
            - "12"
            - "13"
            - "14"
          example: "00"
        autoFillIndicator:
          type: boolean
          description: |
            Indicates whether the token is for an autofill use case.
            This value is populated when eventType is equal to TOKEN_CREATED.
          example: false
    ObjCardHolderInfo:
      type: object
      description: |
        Object that contains the required information to make the decision
        whether the card is eligible or not.
      required:
        - primaryAccountNumber
        - expirationDate
      properties:
        primaryAccountNumber:
          type: string
          description: |
            Card number to be tokenized.
            See the conditionals use cases for this field.
          maxLength: 19
          example: XX25XX25XX25XX25
        expirationDate:
          type: object
          properties:
            month:
              type: string
              example: "04"
            year:
              type: string
              example: "2023"
        cvv2:
          type: string
          description: |
            CVV2 value associated to the card.
            This field will be NULL when the PAN Source is any of these values:
            - ON_FILE
            - MOBILE_BANKING_APP
            - TOKEN <> OR TokenType is one of any of these values:
              - CARD_ON_FILE
              - ECOMMERCE
          enum:
            - ON_FILE
            - MOBILE_BANKING_APP
            - TOKEN
            - CARD_ON_FILE
            - ECOMMERCE
          maxLength: 4
          example: "888"
        name:
          type: string
          description: Complete cardholder´s name.
          maxLength: 32
          example: Jhon Doe
        highValueCustomer:
          type: boolean
          description: |
            If available, it will be provided in Check Eligibility.

            Authorized values:
            - true: Indicates that the customer is high value.
            - false: Indicates that the customer is not high value.
          example: false
        riskAssessmentScore:
          type: string
          description: >
            This value shows the risk score of the PAN is calculated by the AA
            Risk

            engine, based on the PAN’s transaction pattern (long-term and shortterm).

            Values are 0 through 99, with a higher value indicating higher risk.
          maxLength: 2
          example: 5
        BillingAddress:
          $ref: "#/components/schemas/ObjBillingAddress"

        rejectDesc:
          type: string
          maxLength: 100
          description: |
           Contains the Reject Reason for the failure. Present only when the Response Status = F.
          example: ERROR DETAIL

    ObjTermsAndConditions:
      type: object
      properties:
        id:
          type: string
          maxLength: 36
          description: |
            ID for Terms and Conditions that were accepted by the consumer.
            It is not returned for Card on File.
          example: 13c5e2ba-eb5c-432d-a027-97ddaf109af1
        date:
          type: string
          description: |
            Timestamp when Terms and Conditions are acted upon by consumer.
            It is not returned for Card on File.
            UTC Format in epoch seconds The UNIX_UTC_timestamp is a UNIX Epoch
            timestamp. The value is in seconds
          example: 111115
    ObjNotificationEncryptedData:
      type: object
      description: |
        Encrypted payload data. When this value is decrypted the fields are
        conditional to the type of the notification consider the
        messageReasonCode to be secure about what values could be contained.
        When eventType is TOKEN_CREATED the encrypted payload can contain
        Cardholder Information Token Information Risk Information.
        When eventType is TOKEN_STATUS_UPDATED can contain a Risk
        Information Structure.
        Not present on evenType PAN_UPDATED or CARD_METADATA_UPDATED.
      maxLength: 7000
      properties:
        cardholderInfo:
          $ref: "#/components/schemas/ObjCardHolderInfo"
        tokenInfo:
          $ref: "#/components/schemas/ObjTokenInfo"
        deviceInfo:
          $ref: "#/components/schemas/ObjDeviceInformation"
        riskInfo:
          $ref: "#/components/schemas/ObjRiskInfo"
    ObjRiskInfo:
      type: object
      description: |
        Structure with risk information.

        This object can be sent when messageReasonCode is equal to TOKEN_CREATED
      properties:
        walletProviderRiskAssessment:
          type: string
          maxLength: 1
          description: |
            Risk rating of the wallet, it can be one of the following values:
            - 0: Unconditionally approved.
            - 1: Conditionally approved with further consumer verification.
            - 2: Not approved
          enum:
            - 0
            - 1
            - 2
        walletProviderRiskAssessmentVersion:
          type: string
          maxLength: 10
          description: >
            Information for the Issuer related to the security level of the
            wallet
        walletProviderAccountScore:
          type: string
          maxLength: 2
          description: |
            The wallet provider account score. Score value is between 1 and 5,
            indicating the confidence level of the account, where 5 indicates
            the most confidence on the account.
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
        walletProviderDeviceScore:
          type: string
          maxLength: 2
          description: The wallet provider device score. Score value is between 1 and 5,
            indicating the confidence level of the device, where 5 indicates the
            most confidence.
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
        walletProviderReasonCodes:
          type: string
          maxLength: 100
          description: Wallet provider reason codes, in a comma-separated format.
        deviceBluetoothMac:
          type: string
          maxLength: 24
          description: MAC address for Bluetooth.
        deviceIMEI:
          type: string
          maxLength: 24
          description: Hardware ID of the device.
        deviceSerialNumber:
          type: string
          maxLength: 24
          description: Serial number of the mobile device.
        deviceTimeZone:
          type: string
          maxLength: 5
          description: Time-zone abbreviation.
        deviceTimeZoneSetting:
          type: string
          description: |
            Device time-zone setting.
            Available Values:
            - NETWORK_SET
            - CONSUMER_SET
          enum:
            - NETWORK_SET
            - CONSUMER_SET
        osID:
          type: string
          maxLength: 24
          description: OS ID to allow building velocity and risk rules.
        simSerialNumber:
          type: string
          maxLength: 24
          description: SIM serial number of the mobile device
        deviceLostMode:
          type: string
          maxLength: 4
          description: Number of days. Values are up to 9999 number of days.
        daysSinceConsumerDataLastAccountChange:
          type: string
          maxLength: 4
          description: |
            Number of days since account settings were changed (in case of a
            password update). If the number of days exceeds 9999, it will stay
            at 9999.
        accountHolderName:
          type: string
          maxLength: 64
          description: Account-holder’s name.
        walletProviderPANAge:
          type: string
          maxLength: 4
          description: |
            Length of time (in days) that a PAN has been on file for
            a user.
        walletAccountHolderCardNameMatch:
          type: string
          maxLength: 4
          description: |
            Name of the accountholder and name of cardholder matched.
            Available Values:
            - Y: Indicates the two names match.
            - N: Indicates the two names do not match.
          enum:
            - Y
            - N
        accountToDeviceBindingAge:
          type: string
          maxLength: 4
          description: |
            Number of days this device has been used by this account.
            If the number of days exceeds 9999, it will stay at 9999.

            Example: 9999
        userAccountAge:
          type: string
          maxLength: 4
          description: |
            Number of days since an account for this user has existed.
            Values are 0 through 9999.

            Example: 9999
        walletAccountAge:
          type: string
          description: >
            Number of days since the user created a wallet account or started

            using a wallet. If the number of days exceeds 256, it will stay at 256.
        provisioningAttemptsOnDeviceIn24Hours:
          type: string
          maxLength: 2
          description: |
            Number of provisioning attempts on this device in the past 24 hours.
            If the number of attempts exceeds 99, it will stay at 99.
          example: 99
        distinctCardholderNames:
          type: string
          maxLength: 2
          description: |
            Number of distinct cardholder names used in provisioning from this
            device.
          example: 99
        deviceCountry:
          type: string
          maxLength: 2
          description: |
            Country of device at time of provisioning. ISO 3166-1, alpha-2
          example: US
        walletAccountCountry:
          type: string
          maxLength: 2
          description: Country of accountholder. ISO 3166-1, alpha-2
          example: US
        suspendedCardsInAccount:
          type: string
          maxLength: 2
          description: |
            Number of cards suspended in the account.
            If the number of days exceeds 99, it will stay at 99.
          example: 99
        daysSinceLastAccountActivity:
          type: string
          maxLength: 4
          description: |
            Number of days since the last activity on account.
            If the number of days exceeds 9999, it will stay at 9999.
          example: 9999
        numberOfTransactionsInLast12months:
          type: string
          maxLength: 4
          description: |
            Number of transactions on this account in the last 12 months.
            If the number of transactions exceeds 9999, it will stay at 9999.
          example: 9999
        numberOfActiveTokens:
          type: string
          maxLength: 2
          description: |
            Number of active tokens on this account.
            If the number of tokens exceeds 99, it will stay at 99.
          example: 99
        deviceWithActiveTokens:
          type: string
          maxLength: 2
          description: |
            Number of devices for this user with the same token.
            If the number of tokens exceeds 99, it will stay at 99.
          example: 99
        activeTokensOnAllDeviceForAccount:
          type: string
          maxLength: 4
          description: |
            Number of active tokens for this user, across all devices.
            If the number of tokens exceeds 9999, it will stay at 9999.
          example: 9999
        visaTokenScore:
          type: string
          maxLength: 2
          description: |
            Value indicating the degree of risk associated with the token.
            Numeric value is 01 through 99.
        visaTokenDecisioning:
          type: number
          maxLength: 2
          description: |
            Results from the token provisioning service.

            Available values:
            - 00: Provision and activate
            - 05: Do not provision
            - 85: Provision in inactive state (requires further consumer
              authentication prior to activation - Yellow Flow)
          enum:
            - "00"
            - "05"
            - "85"
        riskAssessmentScore:
          type: string
          maxLength: 2
          description: |
            Values are 0 through 99. A higher value indicates a higher risk.
            This is calculated by the AA Risk Engine, based on the PAN’s
            transaction pattern (long term and short term).
        issuerSpecialConditionCodes:
          type: string
          maxLength: 100
          description: >
            Supported for issuers participating in 0100 TAR. The issuer can
            send

            values for this element in the 0100 TAR response.


            If the issuer sends a value in the 0100 TAR, it will be sent in this

            element of the Get CVM.

            If no value is sent in 0100 TAR or if the issuer does not participate

            in TAR, this element will not be present.
    RQPanLifecycle:
      type: object
      anyOf:
        - required:
            - operatorID
            - operationType
            - operationReason
            - operationReasonCode
            - panReferenceID
        - required:
            - operatorID
            - operationType
            - operationReason
            - operationReasonCode
            - encryptedData
        - required:
            - operatorID
            - operationType
            - operationReason
            - operationReasonCode
            - cardId
      properties:
        operatorID:
          type: string
          maxLength: 16
          description: |
            Id representing the operator who request the change. Only for record.
          example: call808
        operationType:
          type: string
          description: |
            Allowed values:
            - UPDATE
            - DELETE
          enum:
            - UPDATE
            - DELETE
          example: UPDATE
        operationReason:
          type: string
          maxLength: 254
          description: |
            Specific reason for the operation.

            Sample:Card replacement due to a lost.
          example: Card replacement due to a lost.
        operationReasonCode:
          type: string
          description: |
            A reason code for the operation.

            Allowed values:
            - ACCOUNT_UPDATE - Change the PAN and the expiration date OR reverse
              the latest change
            - EXP_DATE_UPDATE - Only to change of the expiration date.
            - DELETE_TOKEN - Token cancelation
            - CONTACT_CARDHOLDER - Account inquiry. Contact the account holder
            - PORTFOLIO_CONVERSION
            - ACCOUNT_CLOSED - Closed account advice
            - UPDATE_ACCOUNT_LEVEL_RECORD
            - VAU_CARDHOLDER_OPT_OUT - Opt out of the VAU (Visa Account 
            Updater) product, preventing account updates from being 
            shared with the merchant
            - VAU_CARDHOLDER_OPT_IN - Opt back into the VAU (Visa 
            Account Updater) product, resulting in account updates being 
            shared with the merchant
          enum:
            - ACCOUNT_UPDATE
            - EXP_DATE_UPDATE
            - DELETE_TOKEN
            - CONTACT_CARDHOLDER
            - PORTFOLIO_CONVERSION
            - ACCOUNT_CLOSED
            - UPDATE_ACCOUNT_LEVEL_RECORD
            - VAU_CARDHOLDER_OPT_OUT
            - VAU_CARDHOLDER_OPT_IN
          example: ACCOUNT_UPDATE
        encryptedData:
          $ref: "#/components/schemas/ObjPanLifecycleEncryptedData"
        cardId:
          type: string
          description: |
            Unique Card Identifier at NovoPayment’s Issuance Service, of Original Card.
          maxLength: 40
          example: 5DA...27
        cardIdReplace:
          type: string
          description: |
            Unique Card Identifier at NovoPayment’s Issuance Service, of the new card.
          maxLength: 40
          example: 5DA...D8
        newExpirationDate:
          description: |
              This field is only for Internal Issuers, the new expiration date when reason code is equal 
              to EXP_DATE_UPDATE
          type: object
          properties:
            month:
              type: string
              example: "08"
            year:
              type: string
              example: "2028"

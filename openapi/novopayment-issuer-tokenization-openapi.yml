    RSApproveProvision200:
      type: object
      properties:
        actionCode:
          type: string
          description: >
            Action code to indicate Visa for which flow it should go.

            In case the provisioning of the token is approved, the values are:


            - 00 - Green path, indicates that the token is provisioned and
              automatically activated for payments.
            - 85 - Yellow path, indicates that the token is provisioned and the
              client must be authenticated to activate the token. In case the
              provisioning is not approved, the code must be within the following.
            - N7 - incorrect CVV2

            - 14 - Invalid card number

            - 54 - Invalid expiration date

            - 05 - Generic rejection

            - 96 - Internal system error
          enum:
            - "00"
            - "85"
            - N7
            - "14"
            - "54"
            - "05"
            - "96"
          example: "00"
        addressVerificationResultCode:
          type: string
          description: |
            Code that describes the result of an address verification.
          maxLength: 1
        cvv2ResultsCode:
          type: string
          description: >
            CVV2 verification from Visa


            - M - Visa verified the CVV2 enter by the user in the wallet.

            - N - Visa couldn’t verified the CVV2 enter by the user in the wallet,
              meaning the CVV2 enter is incorrect.
            - P - Visa didn’t verify the CVV2. Is null when cvv is optional
          enum:
            - M
            - N
            - P
          maxLength: 1
        issuerSpecialConditionCodes:
          type: string
          description: |
            Supported for issuers participating in 0100 TAR.The issuer can send
            values for this element in the 0100 TAR response.
            - If the issuer sends a value in the 0100 TAR, it will be sent in
              this element of the Get CVM.
            - If no value is sent in 0100 TAR or if the issuer does not
              participate in TAR, this element will not be present.
          maxLength: 100
        issuerDiscretionaryData:
          $ref: "#/components/schemas/ObjApproveProvisionIssuerDiscretionaryData"
    ObjApproveProvisionIssuerDiscretionaryData:
      type: object
      properties:
        fileControlInformation:
          type: string

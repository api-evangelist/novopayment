        transactionServiceURL:
          type: string
          description: |
            Transaction history URL (TransactionDetails) of the issuer's web
            service.
          maxLength: 128
        messageServiceURL:
          type: string
          description: |
            URL of the message/web service offer. It conforms to the API as
            described in the SOPs and Issuers in the Card Notification Services
            API Specification.
          maxLength: 32
        transactionPushTopic:
          type: string
          description: The issuer notifies the device of new available transactions.
          maxLength: 128
        messagePushTopic:
          type: string
          description: |
            The notification push provider notifies the device of new
            available messages.
          maxLength: 128
        appLaunchURL:
          type: string
          description: |
            URL given to the issuer associated with the mobile application upon
            launch. If this key is present, the AssociatedStoreIdentifiers key
            must also be present.
          maxLength: 128
        appLaunchURLScheme:
          type: string
          description: |
            Registered app URL scheme, in order to deep link from transaction
            notifications and display all transaction notifications.
            App ID must be included in the associated ApplicationIdentifiers
            matrix and the application itself must register for the URL scheme
            specified in this key.
          maxLength: 32
        associatedStoreIdentifiers:
          type: array
          description: >
            A list of mobile app store items identifiers for the partner
            issuer's

            mobile banking app. The format is specific to a mobile store/phone

            platform. Only one item from the list is used.
          items:
            type: string
            maxLength: 20
        associatedApplicationIdentifiers:
          type: array
          description: |
            An array of associated application identifiers. Similar to
            AssociatedStoreIdentifiers, but with explicit application IDs
            (only applicable to SE DWP).
          items:
            type: integer
    RSDeviceTokenBinding200:
      type: object
      required:
        - actionCode
      properties:
        actionCode:
          type: string
          description: >
            Action code to indicate Visa for which flow it should go.

            In case the provisioning of the token is approved, the values are:


            - 00 - Green path, indicates that the token is provisioned and
              automatically activated for payments.
            - 85 - Yellow path, indicates that the token is provisioned and the
              client must be authenticated to activate the token. In case the
              provisioning is not approved, the code must be within the following.
            - N7 - incorrect CVV2

            - 14 - Invalid card number

            - 54 - Invalid expiration date

            - 05 - Generic rejection

            - 96 - Internal system error
          enum:
            - "00"
            - "85"
            - "N7"
            - "14"
            - "54"
            - "05"
            - "96"
          example: "00"
    RSCardInfo200:
      required:
        - code
        - message
        - datetime
        - data
      properties:
        code:
          type: string
          description: Operation response code
          example: 200.00.000
          maxLength: 10
        message:
          type: string
          description: Response code description
          example: Process Ok
          maxLength: 140
        datetime:
          type: string
          description: >
            Operation Time Stamp in ISO 8601 format


            date-time - the date-time notation as defined by

            [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6),

            for example, 2017-07-21T17:32:28Z
          example: "2022-04-25T23:19:12.000Z"
          minLength: 24
          maxLength: 24
        data:
          $ref: "#/components/schemas/ObjCardInfoRSData"
    RSCardholderVerificationMethods200:
      type: object
      required:
        - stepUpMethods
      properties:
        stepUpMethods:
          type: array
          $ref: "#/components/schemas/ObjStepUpMethods"
        responseCode:
          type: string
          description: |
            This field is present when the field otpReason is:
            TOKEN_DEVICE_BINDING, CARDHOLDER_STEPUP o TRUSTED_LISTING_ENROLLMENT

            Allowed values:
            - APPROVED
            - STEPUP
            - DECLINED
          enum:
            - APPROVED
            - STEPUP
            - DECLINED
          example: APPROVED
    ObjStepUpMethods:
      type: object
      required:
        - type
        - value
        - identifier
      properties:
        type:
          type: string
          description: |
            It is required when the authentication method of the cardholder is
            returned.

            Allowed values:
            - OTPSMS
            - OTPEMAIL
            - APP_TO_APP
            - CUSTOMERSERVICE
            - OUTBOUNDCALL
          enum:
            - OTPSMS
            - OTPEMAIL
            - APP_TO_APP
            - CUSTOMERSERVICE
            - OUTBOUNDCALL
          maxLength: 32
          example: OTPSMS
        value:
          type: string
          description: |
            Value of the identification method of the cardholder.
          maxLength: 64
        identifier:
          type: string
          description: |
            Identifier of the identification method of the cardholder that can
            be used for future calls to send the OTP.
          maxLength: 32
        sourceAddress:
          type: string
          description: |
            Indicates the source address from which the OTP is sent.
          maxLength: 64
        otpMethodPlatform:
          type: string
          description: |
            Used with the APP_TO_APP type, this field contains the appropriate
            OS platform for the associated issuer mobile banking application.

            Authorized values:
            - IOS
            - ANDROID
            - WINDOWS
            - WEB
          enum:
            - IOS
            - ANDROID
            - WINDOWS
            - WEB
          maxLength: 64
    ObjCardInfoRSData:
      type: object
      required:
        - cardInfoList
      properties:
        cardInfoList: 
          $ref: "#/components/schemas/ObjCardInfoList"          
    ObjCardInfoList:
      type: object
      required:
        - cardId
        - cardProduct
        - cardProductId
        - cardStatus
        - cardStatusId
        - cardType
        - cardTypeId
        - customerName
        - expirationDate
        - maskedNumber
        - pan
      properties:
        cardId:
          type: string
          description: |
            Card Id assocated to card
          example: "866f4af6-69a8-4c51-9940-95bdd05124c6"
        cardProduct:
          type: string
          description: |
            Product of card
          example: "Lynk Visa Debit"
        cardProductId:
          type: string
          description: |
            Product Id of card
          example: "2"
        cardStatus:
          type: string
          description: |
            Status of card
          example: "Active"
        cardStatusId:
          type: string
          description: |
            Status Id of card
          example: "1"
        cardType:
          type: string
          description: |
            Type of card
          example: "Debit"
        cardTypeId:
          type: string
          description: |
            Type Id of card
          example: 1"
        customerName:
          type: string
          description: |
            Name of customer
          example: "Gen Lynk"
        expirationDate:
          type: string
          description: |
            Expiration date of card
          example: "2810"
        maskedNumber:
          type: string
          description: |
            Masked PAN
          example: "************8603"
        pan:
          type: string
          description: |
            PAN of card
          example: "4537850008998603"
    RSTokenInquiry200:
      type: object
      required:
        - stepUpMethods
      properties:
        encryptedData:
          $ref: "#/components/schemas/ObjTokenInquiryEncryptedData"
        panReferenceID:
          type: string
          description: |
            Unique ID representing a card. This ID can be used in future calls
            referred to the card in the Tokenization flow.
          example: V-3019231458906209630635
        operatorID:
          type: string
          maxLength: 16
          description: |
            Id representing the operator who made the last change.
          example: 40022358888
        entityOfLastAction:
          type: string
          maxLength: 16
          description: |
            Entity that carried out the last action.

            Allowed values:
            - TOKEN_REQUESTOR
            - ISSUER
          enum:
            - TOKEN_REQUESTOR
            - ISSUER
          example: TOKEN_REQUESTOR
        walletAccountEmailAddressHash:
          type: string
          description: |
            Hash of the email from which the account is opened in the wallet
            that sends the request.
          maxLength: 64
        clientWalletAccountID:
          type: string
          description: >
            Identifier of the wallet that sends the request.

            Client provided consumer ID that identifies the wallet account holder entity
          maxLength: 32
        panSource:
          type: string
          description: |
            Origin of the information of the PAN.

            Allowed values:
            - KEY_ENTERED
            - ON_FILE
            - MOBILE_BANKING_APP
            - TOKEN
            - CHIP_DIP
            - CONTACTLESS_TAP
          enum:
            - KEY_ENTERED
            - ON_FILE
            - MOBILE_BANKING_APP
            - TOKEN
            - CHIP_DIP
            - CONTACTLESS_TAP
          example: MOBILE_BANKING_APP
        consumerEntryMode:
          type: string
          description: |
            Method of consumer entry.

            Available values:
            - KEY_ENTERED
            - CAMERA_CAPTURED
            - UNKNOWN

            Could be present when eventType is TOKEN_CREATED or
            TOKEN_ACTIVATION_STIP.
          enum:
            - KEY_ENTERED
            - CAMERA_CAPTURED
            - UNKNOWN
        cardMetadataProfileID:
          type: string
          maxLength: 32
          description: |
            Profile associated to the card.
          example: 98657845
        lastFourOfPAN:
          type: string
          maxLength: 4
          description: |
            Last four digits of the card associated to the token.
          example: 1234
        lastFourOfPreviousPAN:
          type: string
          maxLength: 4
          description: |
            Last four digits of the card thar was previously associated to the
            token.
          example: 4321
        otpInfo:
          $ref: "#/components/schemas/ObjTokenInquiryOptInfo"
        issuerDiscretionaryData:
          $ref: "#/components/schemas/ObjTokenInquiryIssuerDiscretionaryData"
        cardholderVerificationList:
          type: array
          $ref: "#/components/schemas/ObjCardholderVerification"
        deviceBindingInfoList:
          type: array
          $ref: "#/components/schemas/ObjDeviceBindingInfo"
    ObjTokenInquiryEncryptedData:
      type: object
      required:
        - tokenInfo
        - deviceInfo
        - riskInfo
      description: |
        Encrypted payload data.
      maxLength: 7000
      properties:
        tokenInfo:
          $ref: "#/components/schemas/ObjTokenInfo"
        deviceInfo:
          $ref: "#/components/schemas/ObjDeviceInformation"
        riskInfo:
          $ref: "#/components/schemas/ObjRiskInfo"
    ObjTokenInquiryPanEncryptedData:
      type: object
      required:
        - cardholderInfo
      description: |
        Object containing only the field “primaryAccountNumber”.
      maxLength: 7000
      properties:
        cardholderInfo:
          $ref: "#/components/schemas/ObjCardHolderInfo_OnlyPAN"
    ObjDeviceBindingInfo:
      type: object
      description: |
        Returns a device binding list.
      properties:
        deviceID:
          type: string
          description: |
            This field represents the device ID.

            Format: Alphanumeric characters
          maxLength: 48
        deviceIndex:
          type: number
          description: |
            Visa’s index number where the device ID is stored.
            Number between 1 and 99.

            This is required for TOKEN DEVICE BINDING
          maxLength: 2
        deviceName:
          type: string
          description: |
            Device index.

            Format: Number between 1 and 99, included.
          maxLength: 128
    ObjTokenInquiryOptInfo:
      type: object
      description: |
        Encrypted payload data.
      properties:
        otpCodeIndicator:
          type: string
          maxLength: 32
          description: |
            Allowed values:
            - PRESENT
            - NOT_PRESENT
            - EXPIRED
          enum:
            - PRESENT
            - NOT_PRESENT
            - EXPIRED
          example: PRESENT
        otpCodeExpiration:
          type: string
          format: date-time
          description: |
            Expiration date

            Format: yyyy-MM-ddTHH:mm:ss.SSSZ
        otpVerificationAttempts:
          type: number
          maxLength: 3
          description: |
            Verification attempts.
        otpVerificationRetryCounts:
          type: number
          maxLength: 3
          description: |
            Attempt counter.
    ObjTokenInquiryIssuerDiscretionaryData:
      type: object
      description: |
        Encrypted payload data.
      properties:
        fileControlInformation:
          type: string
          maxLength: 128
          description: |
            File Control information
          example: PRESENT
        issuerApplicationDiscretionaryData:
          type: string
          maxLength: 32
          description: |
            Issuer discretionary information
    RSTokenInquiryPan200:
      type: object
      required:
        - tokenDetails
      properties:
        tokenDetails:
          type: array
          $ref: "#/components/schemas/ObjTokenInquiryPanTokenDetails"
    ObjTokenInquiryPanTokenDetails:
      type: object
      properties:
        tokenRequestorID:
          type: integer
          description: |
            Unique ID assigned to the client requesting the token. This value is
            assigned by Visa when creating the VTS project.
          example: 40022358888
        tokenReferenceID:
          type: string
          description: |
            Unique ID associating a token with a card. This ID can be used in
            future calls to make operations related to the token in the I-TSP.
          example: DNITHE30194726875288888
        panReferenceID:
          type: string
          description: |
            Unique ID representing a card. This ID can be used in future calls
            referred to the card in the Tokenization flow.
          example: V-3019231458906209630635
        entityOfLastAction:
          type: string
          maxLength: 16
          description: |
            Entity that carried out the last action.

            Allowed values:
            - TOKEN_REQUESTOR
          enum:
            - TOKEN_REQUESTOR
          example: TOKEN_REQUESTOR
        walletAccountEmailAddressHash:
          type: string
          description: |
            Hash of the email from which the account is opened in the wallet
            that sends the request.
          maxLength: 64
        clientWalletAccountID:
          type: string
          description: |
            Identifier of the wallet that sends the request.
            Client provided consumer ID that identifies the wallet account
            holder entity
          maxLength: 32
        panSource:
          type: string
          description: |
            Origin of the information of the PAN.

            Allowed values:
            - KEY_ENTERED
            - ON_FILE
            - MOBILE_BANKING_APP
            - TOKEN
            - CHIP_DIP
            - CONTACTLESS_TAP
          enum:
            - KEY_ENTERED
            - ON_FILE
            - MOBILE_BANKING_APP
            - TOKEN
            - CHIP_DIP
            - CONTACTLESS_TAP
          example: MOBILE_BANKING_APP
        tokenType:
          type: string
          description: |
            Token type of the source token used for provisioning a new token.

            Available values:
            - ECOMMERCE
            - SECURE_ELEMENT
            - CLOUD_BASE_PAYMENT
            - ECOMMERCE_ENABLER
            - CARD_ON_FILE
            - HCE
            - QRC
          enum:
            - ECOMMERCE
            - SECURE_ELEMENT
            - CLOUD_BASE_PAYMENT
            - ECOMMERCE_ENABLER
            - CARD_ON_FILE
            - HCE
            - QRC
          example: ECOMMERCE
        tokenStatus:
          type: string
          description: |
            Required to:
            - Token Create Notification
            - Token Notification

            Allowed values:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
            - DEACTIVATED
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
            - DEACTIVATED
          example: ACTIVE
        lastFourOfPAN:
          type: string
          maxLength: 4
          description: |
            Last four digits of the card associated to the token.
          example: 1234
        operatorID:
          type: string
          maxLength: 16
          description: |
            Id representing the operator who made the last change.
          example: 219951
    RSUpdateCardMetadata200:
      type: object
      properties:
        responseDetails:
          type: array
          $ref: "#/components/schemas/ObjUpdateCardMetadataResponseDetails"
    ObjUpdateCardMetadataResponseDetails:
      type: object
      properties:
        tokenRequestorID:
          type: integer
          description: |
            Unique ID assigned to the client requesting the token. This value
            is assigned by Visa when creating the VTS project.

            Not present when eventType is PAN_UPDATED or CARD_METADATA_UPDATED
            OR ACCOUNT_LEVEL_RECORD
          example: 40022358888
        tokenReferenceID:
          type: string
          description: |
            Unique ID associating a token with a card. This ID can be used in
            future calls to make operations related to the token in the I-TSP
            for example events related to the management of the life cycle.

            Not present when eventType is PAN_UPDATED or CARD_METADATA_UPDATED
            OR ACCOUNT_LEVEL_RECORD.
          maxLength: 32
          example: DNITHE30194726875288888
        panReferenceID:
          type: string
          description: |
            Unique ID representing a card. This ID can be used instead of the
            PAN number for subsequent calls such as notifications or life cycle
            management.

            Not present when evenType is CARD_METADATA_UPDATED.
          maxLength: 32
          example: V-3019231458906209630635
        statusCode:
          type: string
          description: |
            Allowed values:
            - PENDING
            - FAILURE
            - NOT_ALLOWED
          enum:
            - PENDING
            - FAILURE
            - NOT_ALLOWED
          maxLength: 10
          example: PENDING
        errorCode:
          type: string
          description: |
            Presented when error codes in business logic.

            Format: VSEXXXXX.
            - VSE40000 VSE_ERROR_INVALID_DATA
            - VSE40003 VSE_ERROR_TOKEN_NOT_FOUND
            - VSE40007 VSE_ERROR_INVALID_TOKEN_STATE
          enum:
            - VSE40000
            - VSE40003
            - VSE40007
          maxLength: 10
          example: VSE40007
    RS400Tk:
      type: object
      properties:
        code:
          type: string
          example: 400.22.001
          description: Operation response code
          minLength: 10
          maxLength: 10
        message:

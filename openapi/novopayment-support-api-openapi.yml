          type: string
          description: Four-digit pin of the encrypted card using AES256 algorithm
          example: 052olf8m99453jCPWTOL3Q==
          maxLength: 24
    RQBlockCard:
      type: object
      required:
      - blockType
      - observations
      properties:
        blockType:
          type: string
          description: 'Blocking code in ISO8583 format

            Sample:

            - 41: Lost card

            - 43: Stolen card

            - PB: Preventive

            - 17: Cancelled card


            Allowed values: 41, 43, PB, 17

            '
          example: 41

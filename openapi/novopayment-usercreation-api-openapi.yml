        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Usercreation
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/onboarding/v1

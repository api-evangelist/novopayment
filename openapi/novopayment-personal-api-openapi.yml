openapi: 3.2.0
info:
  title: Novopayment Personal API
  version: v1
  description: 'Operations tagged Personal across 2 of this provider''s published API definitions: novopayment-onboarding-openapi.yml, novopayment-profile-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Sandbox
  url: https://sandbox-api.novopayment.com/onboarding/v1
- description: Sandbox
  url: https://sandbox-api.novopayment.com/profiles/v1
security:
- oAuth2ClientCredentials: []
tags:
- name: Personal
paths:
  /personal/documentverify:
    post:
      summary: Validate Identity Document
      description: This operation verifies that the sent Identity Document is not registered with active status.
      requestBody:
        $ref: '#/components/requestBodies/RQValidarDocId'
      operationId: DocIdVerification
      responses:
        '200':
          $ref: '#/components/responses/RSValidarDocId200'
        '400':
          $ref: '#/components/responses/RSValidarDocId400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Personal
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/onboarding/v1
  /personal/applicant:
    post:
      summary: Get Biometric Applicant Id
      description: 'This operation generates a new biometric identifier (applicant-id) required to start the registration process and biometric validation of the individual customer. As a result, the operation generates a new applicant ID and a new URL so the biometric capture process can be started from the end customer''s web and mobile channels.


        **Note:** The biometric registration process incorporates the registration of the identity documents of the end-customer.'
      requestBody:
        $ref: '#/components/requestBodies/RQGetBiometricApplicantId'
      operationId: GetBiometricApplicantId
      responses:
        '200':
          $ref: '#/components/responses/RSGetBiometricApplicantId200'
        '400':
          $ref: '#/components/responses/RSGetBiometricApplicantId400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Personal
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/onboarding/v1
  /personal/address:
    post:
      summary: Residence Address
      description: This operation allows to save the information of the customer's home address.
      requestBody:
        $ref: '#/components/requestBodies/RQResidenceAddress'
      operationId: ResidenceAddress
      responses:
        '200':
          $ref: '#/components/responses/RSResidenceAddress200'
        '400':
          $ref: '#/components/responses/RSResidenceAddress400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Personal
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/onboarding/v1
  /personal/info:
    post:
      summary: Personal Information
      description: This operation allows to save the gender information, civil status, education level and any other field that complements the customer's personal information.
      requestBody:
        $ref: '#/components/requestBodies/RQPersonalInformation'
      operationId: PersonalInformation
      responses:
        '200':
          $ref: '#/components/responses/RSPersonalInformation200'
        '400':
          $ref: '#/components/responses/RSPersonalInformation400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Personal
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/onboarding/v1
  /personal/otp/type/{typeId}:
    post:
      summary: OTP Request Via SMS Or E-mail
      description: This operation requests a One Time Password (OTP) by SMS or e-mail to validate the cellphone number or email.
      requestBody:
        $ref: '#/components/requestBodies/RQOTPRequestViaSMSOrEmail'
      operationId: OTPRequestViaSMSOrEmail
      parameters:
      - $ref: '#/components/parameters/typeId'
      responses:
        '200':
          $ref: '#/components/responses/RSOTPRequestViaSMSOrEmail200'
        '400':
          $ref: '#/components/responses/RSOTPRequestViaSMSOrEmail400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Personal
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/onboarding/v1
  /personal/otp/verify/{typeId}:
    post:
      summary: OTP Verification
      description: This operation verifies the OTP sent and records the cell phone number or E-mail.
      requestBody:
        $ref: '#/components/requestBodies/RQOTPVerification'
      operationId: OTPVerification
      parameters:
      - $ref: '#/components/parameters/typeId'
      responses:
        '200':
          $ref: '#/components/responses/RSOTPVerification200'
        '400':
          $ref: '#/components/responses/RSOTPVerification400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Personal
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/onboarding/v1
  /personal/otp/type/sms/verification:
    post:
      summary: Cell Phone OTP Verification
      description: This operation sends a code for the validation of the new cell phone number that is getting registered.
      requestBody:
        $ref: '#/components/requestBodies/RQCellPhoneOTPVerification'
      operationId: CellPhoneOTPVerification
      responses:
        '200':
          $ref: '#/components/responses/RSCellPhoneOTPVerification200'
        '400':
          $ref: '#/components/responses/RSCellPhoneOTPVerification400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Personal
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/profiles/v1
  /personal/otp/type/email/verification:
    post:
      summary: OTP E-mail Verification
      description: This operation allows to verify the code sent to the email to validate its update.
      requestBody:
        $ref: '#/components/requestBodies/RQOTPEmailVerification'
      operationId: OTPEmailVerification
      responses:
        '200':
          $ref: '#/components/responses/RSOTPEmailVerification200'
        '400':
          $ref: '#/components/responses/RSOTPEmailVerification400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Personal
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/profiles/v1

          description: Phone number.
          example: 6460000000
          maxLength: 30
        code:
          type: integer
          description: Verification code.
          example: 686589
          maxLength: 6
        phoneCodeId:
          type: object
          description: Country identifier.
          required:
            - id
            - phoneCode
          properties:
            id:
              type: integer
              description: Country id corresponding to the cell phone number.
              example: 233
              maxLength: 38
            phoneCode:

          example: 1
          maxLength: 38
        documentUploadId:
          type: integer
          description: Document upload identifier.
          example: 1755
          maxLength: 38
        fileInfo:
          type: object
          description: Object that contains the file information when it is uploaded.
          required:
            - fileName
            - fileSize
            - extensión
            - bytes
          properties:
            fileName:
              type: string
              description: Uploaded file name.
              example: proofofemploye.pdf
              maxLength: 100
            fileSize:
              type: number
              description: Uploaded File Size in kbs.
              example: 37000
              maxLength: 38
            extensión:
              type: string
              description: File extension uploaded.
              example: pdf
              maxLength: 10
            bytes:
              type: string
              description: Base64 of the file to upload.
              example: 

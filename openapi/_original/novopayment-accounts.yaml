    RSAccountTransactions200:
      type: object
      required:
        - code
        - message
        - datetime
        - data
      properties:
        code:
          type: string
          description: Operation response code
          example: 200.02.000
          maxLength: 10
        message:
          type: string
          description: Response code description
          example: Process Ok
          maxLength: 140
        datetime:
          type: string
          description: Operation Timestamp
          example: "2020-01-03T16:05:56.517Z"
          format: date-time
        data:
          type: object
          required:
            - transactions
          properties:
            transactions:
              type: array
              required:
                - transactionId
                - description
                - sign
                - creationDate
                - amount
                - registrationDate
                - internalRef
                - txNumber
                - isPosted
                - transactionCatalog
                - targetAccount
              items:
                properties:
                  transactionId:
                    type: string
                    description: Unique transaction ID.
                    example: 638
                    maxLength: 38
                  description:
                    type: string
                    description: Transaction description.
                    example: Utility bill payments
                    maxLength: 40
                  sign:
                    type: string
                    description: |
                      Transaction type.

                      **Possible values:**

                      + for a credit transaction

                      - for a debit transaction
                    enum:
                      - +
                      - "-"
                    maxLength: 1
                  creationDate:
                    type: string
                    description: Transaction creation date.
                    example: 2021/12/08 16:00:28
                  amount:
                    type: number
                    description: Transaction amount.
                    example: 50
                    maxLength: 38
                  fee:
                    type: number
                    description: Fee for transaction.
                    example: 0
                    maxLength: 38
                  tax:
                    type: number
                    description: Transaction tax.
                    example: 0
                    maxLength: 38
                  registrationDate:
                    type: string
                    description: Transaction registration date.
                    example: 2020/10/09 15:24:32
                  internalRef:
                    type: string
                    description: Internal reference generated by the processing core.
                    example: 113000202231
                    maxLength: 12
                  txNumber:
                    type: string
                    description: Complementary Transaction Identifier.
                    example: 859
                    maxLength: 6
                  authCode:
                    type: string
                    description: Transaction authorization code.
                    example: 587456
                    maxLength: 6
                  isPosted:
                    type: boolean
                    description: >
                      A posted transaction is any transaction that has been confirmed by
                      the card network and by the system, and therefore, the
                      frozen amount is completely deducted from the account
                      balance.


                      __**True:** The transaction has been posted successfully.__


                      __**False:** The transaction has been authorized, however, its not posted/confirmed yet.__
                    example: true
                    minLength: 4
                    maxLength: 5
                  isReleased:
                    type: boolean
                    description: >
                      indicates if the transaction was released by the processor. This
                      field applies only when a transaction is Authorized but
                      not confirmed by the card network.


                      __Possible values:__


                      __**True:** if the transaction was released and the blocked balance was returned to the account.__


                      __**False:** The transaction has not been released.__
                    example: true
                    minLength: 4
                    maxLength: 5
                  releasedDate:
                    type: string
                    description: Datetime when the transaction was released.
                    example: 2021/12/08 16:00:28
                  transactionCatalog:
                    type: object
                    required:
                      - id
                      - description
                    description: |
                      Transaction Catalogue Object.
                      Contains the transaction catalog information.
                    properties:
                      id:
                        type: string
                        description: >
                          Transaction ID.


                          **Refer to:** [Block Reason](https://developer.novopayment.com/api/accounts-api/account-transactions)
                        example: 6
                        maxLength: 5
                      description:
                        type: string
                        description: Description of the transaction catalog.
                        example: CH DEPOSIT DOMESTIC
                        maxLength: 100
                  originCard:
                    type: object
                    required:
                      - cardId
                      - maskedNumber
                      - cardNumber
                    description: >
                      Origin Card Object.

                      Contains the information of the card used in the transaction.
                    properties:
                      cardId:
                        type: string
                        description: Unique card identifier.
                        example: E4555088EE3BA858346A6E0359B803C38C43EEDE
                        maxLength: 40
                      maskedNumber:
                        type: string
                        description: Masked account number.
                        example: "****************2716"
                        maxLength: 50
                      cardNumber:
                        type: string
                        description: Card number encrypted in AES-256.
                        example: xQ6jqbV1OA3QrS/6dl4XdwWNzS/cbgW+FOiE4PcDRvc
                        maxLength: 50
                  targetAccount:
                    type: object
                    required:
                      - accountId
                      - accountNumber
                    description: >
                      Target Account Object.

                      Contains the information of the account to which the credit or debit was made. Mostly related to the account being queried.
                    properties:
                      accountId:
                        type: string
                        description: Unique account identifier.
                        example: 4FC9550C979F37B34194113F43A24AAF3AB3DB26
                        maxLength: 40
                      accountNumber:
                        type: string
                        description: Account number encrypted in AES-256.
                        example: cLGsb6ag90umlxMxO8OEtntq9JQFdhxQV+bfyxbGI3A=4FC9550C979F37B34194113F43A24AAF3AB3DB26
                        maxLength: 40
                  originAccount:
                    type: object
                    description: >
                      Origin Account Object.

                      Contains the information of the account debited in the transaction.
                    properties:
                      accountId:
                        type: string
                        description: Unique account identifier.
                        example: 4FC9550C979F37B34194113F43A24AAF3AB3DB26
                        maxLength: 40
                      accountNumber:
                        type: string
                        description: Account number encrypted in AES-256.
                        example: cLGsb6ag90umlxMxO8OEtntq9JQFdhxQV
                        maxLength: 40
                  receivingAccount:
                    type: object
                    description: >
                      Customized object.

                      Contains the information of the account credited in the transaction.
                    properties:
                      accountId:
                        type: string
                        description: Unique account identifier.
                        example: 4FC9550C979F37B34194113F43A24AAF3AB3DB26
                        maxLength: 40
                      accountNumber:
                        type: string
                        description: Account number encrypted in AES-256.
                        example: cLGsb6ag90umlxMxO8OEtntq9JQFdhxQV
                        maxLength: 40

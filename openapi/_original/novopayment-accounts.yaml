  parameters:
    customerId:
      name: customerId
      in: path
      description: Unique customer identifier.
      required: true
      schema:
        type: string
        example: 69E2DBE6B18C7ACD
        maxLength: 40
    accountId:
      name: accountId
      in: path
      description: Unique customer identifier.
      required: true
      schema:
        type: string
        example: 221BF87320F278DC9F41C835AD0D5111B2B0FF68
        maxLength: 40
    transferId:
      name: transferId
      in: path
      required: true
      schema:
        type: string
        example: 4L2J4BKK6J4
    cardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        example: L1KJ2B35KLJB34L2J4BKK6J4
    batchId:
      name: batchId
      in: path
      description: |
        A unique ID assigned to the card batch.
      required: true
      schema:
        type: string
    fromDate:
      name: fromDate
      in: query
      description: |
        Initial range of the creation date of the batches to be consulted.

        Format YYYYMMDD.
      schema:
        type: string
    toDate:
      name: toDate
      in: query
      description: |
        The final range of the creation date of the batches to be consulted.

        Format YYYYMMDD.
      schema:
        type: string
    createdBy:
      name: createdBy
      in: query
      description: |
        The name of the user who issued the batch.
      schema:
        type: string
    statusId:
      name: statusId
      in: query
      description: |
        status of the card batch
        __Allowed values:__
        1. Pending.
        2. Approved.
        3. Processed.
        4. Failed.
        5. Cancelled.
      schema:
        type: string
    count:
      name: Count
      in: query
      description: |
        Required data numbers.
      required: true
      schema:
        type: number
    type:
      name: type
      in: query
      description: |
        Transaction type

        **Possible values:**

        **Credit**

        **Debit**
      required: true
      schema:
        type: string
  schemas:
    HeaderTypeParam:
      type: string
      description: >
        Card lookup type.

        Allowed values:

        - ACTIVATION_CODE

        - CARD_NUMBER
      enum:
        - ACTIVATION_CODE
        - CARD_NUMBER
      example: ACTIVATION_CODE
      maxLength: 15

    RQAccountCreation:
      type: object
      required:
        - account
      properties:
        card:
          type: object
          required:
            - cardProgramId
          description: >
            Customized object Contains the card information.


            __* This parameter should not be sent if only needs to create an account without a card.__
          properties:
            cardProgramId:
              type: string
              description: Card program identification.
              example: 1
              maxLength: 10
            cardDesignId:
              type: string
              description: Card design ID.
              example: A1
              maxLength: 20
            line1:
              type: string
              description: Cardholder name of the card.
              example: JOHN DOE
              maxLength: 20
            line2:
              type: string
              description: |
                Cardholder company name of the card.

                __*Applies when it is a corporate card.__
              example: NOVOPAYMENT
              maxLength: 20
            requestNumber:
              type: string
              description: Embossing request number.
              example: 64876
              maxLength: 40
            reference:
              type: string
              description: Application reference.
              example: AS749
              maxLength: 40
            address:
              type: object
              description: Customized object that contains the card delivery information.
              properties:
                street:
                  type: string
                  description: Address line 1.
                  example: calle
                  maxLength: 100
                number:
                  type: string
                  description: Building number.
                  example: 1
                  maxLength: 100
                homeNumber:
                  type: string
                  description: Home or apartment number.
                  example: 789
                  maxLength: 50
                sector:
                  type: string
                  description: Address sector name.
                  example: sector
                  maxLength: 40
                city:
                  type: string
                  description: Name of the city of residence.
                  example: Bogotá
                  maxLength: 100
                state:
                  type: string
                  description: Name of the state of residence.
                  example: Bogotá D.C
                  maxLength: 100
        account:
          type: object
          required:
            - accountProgramId
          description: Customized object. Contains the card information.
          properties:
            accountProgramId:
              type: string
              description: Account program identification
              example: 1
              maxLength: 10
            accountNumber:
              type: string
              description: |
                Encrypted account number in AES-256.

                __* Applies when the tenant manages the accounts numbers.__
              example: cLGsb6ag90umlxMxO8OEtntq9JQFdhxQV+bfyxbGI3A=
              maxLength: 22
    RQBlockAccount:
      type: object
      required:
        - reasonId
      properties:
        reasonId:
          type: string
          description: >
            Blockage reason ID.


            **Refer to:** [Block Reason](https://developer.novopayment.com/api/request-and-response-codes#item-blockreason)
          example: 1
          maxLength: 5
        observations:
          type: string
          description: Additional observations related to the account blocking action.
          example: Account holder lost card
          maxLength: 4000
    RQUnblockAccount:
      type: object
      required:
        - observations
      properties:
        observations:
          type: string
          description: Observation the unblocking the account.
          example: Account required again
          maxLength: 140
    RQCloseAccount:
      type: object
      required:
        - reasonId
      properties:
        reasonId:
          type: string
          description: >
            Account close reason ID.


            **Refer to:** [Block Reason](https://developer.novopayment.com/api/request-and-response-codes#item-blockreason)
          example: 1
          maxLength: 5
        observations:
          type: string
          description: Additional observations related to the account close action.
          example: Lost card
          maxLength: 4000
    RQCardToAccountAssociation:
      type: object
      required:
        - accountId
      properties:
        accountId:
          type: string
          description: Unique account identifier.
          example: 221BF87320F278DC9F41C835AD0D5111B2B0FF68
          maxLength: 100
    RQCardToAccountDisassociation:
      type: object
      required:
        - comments
        - updatedBy
      properties:
        comments:
          type: string
          description: Descriptive text about the reason for dissociation
          maxLength: 200
          example: The card activation has failed, disassociation is required.
        updatedBy:
          type: string
          description: The user who performed the card disassociation.
          maxLength: 25
          example: Admin
    RQCardActivation:
      type: object
      properties:
        activationCode:
          type: string
          description: Activation code receive for OTP encrypted in AES-256.
          example: 5Y2vVI9Dhf1ipl+C6QYyUQ==
          maxLength: 40
        cvv2:
          type: string
          description: CVV2 encrypted in AES-256.
          example: mFJcy7CX0dIoI9x8a/JKlw==
          maxLength: 40
        expirationDate:
          type: string
          description: Expiration date encrypted in AES-256.
          example: hlnYq93Md01m++byjzTB3A==
          maxLength: 40
    RQCardEmbossing:
      type: object
      properties:
        line1:
          type: string
          description: >
            Cardholder name to being embossed.


            __* If the field is not sent, the system defines the line 1 through an algorithm.__
          example: JOHN DOE
          maxLength: 50
        line2:
          type: string
          description: >
            Cardholder company name.


            __* If the field is not sent, the system defines the line 1 through an algorithm.__
          example: NOVOPAYMENT
          maxLength: 50
        observations:
          type: string
          description: Additional observations related to this process.
          example: Customer requests a physical card
          maxLength: 200
        cardDesignId:
          type: string
          description: Card design ID.
          example: A1
          maxLength: 20
        requestNumber:
          type: string
          description: Embossing request number.
          example: 64876
          maxLength: 40
        reference:
          type: string
          description: Request Reference.
          example: AS749
          maxLength: 40
        address:
          type: object
          description: >
            Customized object that contains the card delivery information.


            __* If one field of the address object is sent, the other fields of the object change in data type to required.__
          properties:
            street:
              type: string
              description: Address line 1.
              example: calle
              maxLength: 100
            number:
              type: string
              description: Building number.
              example: 1
              maxLength: 100
            homeNumber:
              type: string
              description: Home or apartment number.
              example: 789
              maxLength: 50
            sector:
              type: string
              description: Address sector name.
              example: sector
              maxLength: 40
            city:
              type: string
              description: Name of the city of residence.
              example: Bogotá
              maxLength: 100
            state:
              type: string

    RSGetCustomersSupportDocuments200:
      type: object
      required:
        - code
        - message
        - datetime
        - data
      properties:
        code:
          type: string
          description: Operation response code
          example: 200.25.000
          maxLength: 10
        message:
          type: string
          description: Response code description
          example: Process Ok
          maxLength: 140
        datetime:
          type: string
          description: Opertion Timestamp
          example: "2020-01-03T16:05:56.517Z"
          format: date-time
        data:
          type: object
          required:
            - documents
          properties:
            documents:
              type: array
              required:
                - documentId
                - name
                - description
                - referenceDocumentLink
                - validExtension
                - minSize
                - maxSize
                - maxUploadDays
                - uploadDateLimit
                - uploadInformation
              items:
                type: object
                properties:
                  documentId:
                    type: integer
                    description: Document identifier.
                    example: 2
                    maxLength: 38
                  name:
                    type: string
                    description: Name of the document.
                    example: Proof of Employment
                    maxLength: 50
                  description:
                    type: string
                    description: Document detail.
                    example: Proof of employment issued by the company
                    maxLength: 200
                  referenceDocumentLink:
                    type: string
                    description: Document reference URL.
                    example: https://www.documents.com/pub/irs-pdf/fw8ben.pdf
                    maxLength: 100
                  validExtension:
                    type: string
                    description: |
                      Array of extensions allowed for loading the document.

                      __*Allowed values : [".xls, .pdf, .png"]__
                    example:
                      - pdf
                    maxLength: 100
                  minSize:
                    type: number
                    description: Minimum file size in kbs.
                    example: 54000
                    maxLength: 38
                  maxSize:
                    type: number
                    description: Maximum file weight in kbs.
                    example: 750000
                    maxLength: 38
                  maxUploadDays:
                    type: integer
                    description: Number of days to upload the file.
                    example: 15
                    maxLength: 38
                  uploadDateLimit:
                    type: string
                    description: Document upload deadline.
                    example: 2021-10-10
                  uploadInformation:
                    type: object
                    description: An object that contains the upload information for the file.
                    required:
                      - documentUploadId
                      - requestDate
                      - documentStatus
                      - fileInfo
                    properties:
                      documentUploadId:
                        type: integer
                        description: Document upload identifier.
                        example: 14
                        maxLength: 38
                      requestDate:
                        type: string
                        description: Document upload request date.
                        example: 2021-10-01
                      statusDoc:
                        type: object
                        description: Object that contains the status of the document.
                        required:
                          - statusId
                          - description
                        properties:
                          statusId:
                            type: integer
                            description: Document status identifier.
                            example: 1
                            maxLength: 38
                          description:
                            type: string
                            description: Description of the document status.
                            example: Uploaded
                            maxLength: 50
                      fileInfo:
                        type: object
                        description: An object that contains the information about the file when it is
                          uploaded.
                        required:
                          - fileName
                          - fileSize
                          - extension
                          - uploadDate
                        properties:
                          fileName:
                            type: string
                            description: Uploaded file name.
                            example: proofofemploye.pdf
                            maxLength: 100
                          fileSize:
                            type: number
                            description: Uploaded File Size in kbs.
                            example: 78000
                            maxLength: 38
                          extension:
                            type: string
                            description: Extension of the uploaded file.
                            example: pdf
                            maxLength: 10
                          uploadDate:
                            type: string
                            description: Date the file was uploaded.
                            example: 2021-10-02

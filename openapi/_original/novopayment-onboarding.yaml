  parameters:
    customerId:
      name: customerId
      in: path
      description: Unique customer identifier.
      required: true
      schema:
        type: string
        example: 43DED66474E259FD
        maxLength: 40
    typeId:
      name: typeId
      in: path
      description: |
        OTP request type.

        **Possible values:**

          - sms
          - email
      required: true
      schema:
        type: string
        enum:
          - sms
          - email
  schemas:
    RQValidarDocId:
      type: object
      required:
        - documentNumber
      properties:
        documentNumber:
          type: string
          description: Identity document number.
          example: 24.288.239
          maxLength: 11
    RQDeviceRegistration:
      type: object
      required:
        - channelId
        - screenResolution
        - alias
        - model
        - timezone
        - gpsCountryId
        - networkOperator
        - pushToken
        - brand
        - osVersion
        - platform
        - simMcc
        - deviceId
      properties:
        androidId:
          type: string
          description: Identifier of the Android device sending the request.
          example: deOaGTS5co4
          maxLength: 38
        channelId:
          type: integer
          description: Device registration channel.
          example: 1
          maxLength: 38
        screenResolution:
          type: string
          description: Screen resolution of the device sending the request.
          example: 375x812
          maxLength: 10
        alias:
          type: string
          description: Device assigned name by the customer.
          example: 7A172B26D-EC90-442D-8425-CF225C4A4A934
          maxLength: 70
        model:
          type: string
          description: Mobile device model sending the request.
          example: iPhone12
          maxLength: 50
        timezone:
          type: string
          description: Time zone from where the request is sent.
          example: GMT-5
          maxLength: 50
        simMnc:
          type: integer

    RQCreateMerchantCustomer:
      type: object
      required:
        - legalName
        - tradingName
        - mcc
        - annualCardVolum
        - maxTransactionAmount
        - defaultStatementDescriptor
        - hasAcceptedCreditCardsPreviously
        - industryType
        - entityType
        - entityPurpose
        - registrationNumber
        - incorporationDate
        - identifications
        - webSite
        - contacts
        - addresses
      properties:
        legalName:
          type: string
          description: >
            Legal name of the entity, just like is presented in the official
            documentation. Only letters, numbers and the following special
            characters are allowed: dash, apostrophes, period, coma and spaces.
          example: commercial LegalName
          maxLength: 50
        tradingName:
          type: string
          description: >
            Commercial name of the entity, the. Way it appears in official
            documentation Only letters, numbers and the following special
            characters are allowed: dash, apostrophes, period, coma and spaces.
          example: commercial TradingName.
          maxLength: 50
        mcc:
          type: string
          description: Merchant Category Code that this merchant will be classified under.
          example: 7834
          maxLength: 4
        annualCardVolum:
          type: number
          description: Approximate annual credit card sales expected to be processed in
            cents by this merchant.
          example: 1000
          maxLength: 12
        maxTransactionAmount:
          type: number
          description: Maximum amount that can be transacted for a single transaction in
            cents.
          example: 2000
          maxLength: 12
        defaultStatementDescriptor:
          type: string
          description: Billing descriptor displayed on the buyer’s bank or card statement.
          example: Prestige World Wide
          maxLength: 20
        hasAcceptedCreditCardsPreviously:
          type: boolean
          description: Defaults to false if not passed.
          example: true
        industryType:
          type: string
          description: >
            **Refer to:** [Industry
            Type](https://developer.novopayment.com/api/request-and-response-codes#item-industrytype)
          example: 44122
          maxLength: 50
        entityType:
          type: string
          description: >
            **Refer to:** [Entity
            Type](https://developer.novopayment.com/api/request-and-response-codes#item-entitytype)
          example: UNIQUE OWNER
          maxLength: 50
        entityPurpose:
          type: string
          description: commercial Purpose
          example: commercial Purpose
          maxLength: 50
        registrationNumber:
          type: string
          description: Tax id number or tax record number of the business.
          example: 9834092375230
          maxLength: 50
        incorporationDate:
          type: string
          description: Date of the business incorporation in ISO 8601 format.
          example: "2020-01-03T16:05:56.517Z"
        identifications:
          type: array
          description: This array allows to add more than one business id to a business
            BUSINESS_TAX_ID BUSINESS_NUMBER TAXPAYER_IDENTIFICATION_NUMBER.
          required:
            - type
            - value
          items:
            type: object
            properties:
              type:
                type: string
                description: >
                  Identification.


                  *Format:* BUSINESS_TAX_ID, BUSINESS_NUMBER o TAXPAYER_IDENTIFICATION_NUMBER
                enum:
                  - BUSINESS_TAX_ID
                  - BUSINESS_NUMBER
                  - TAXPAYER_IDENTIFICATION_NUMBER
                maxLength: 50
              value:
                type: string
                description: Identification number associated to the format.
                example: XX-XXXXXXX
                maxLength: 50
        webSite:
          type: string
          description: Company website.
          example: https://by.com
          maxLength: 50
        contacts:
          type: array
          description: An array containing contact information.
          required:
            - type
            - value
          items:
            type: object
            properties:
              type:
                type: string
                description: A standard set of values that indicate the contact type [EMAIL,
                  PHONE].
                enum:
                  - EMAIL
                  - PHONE
                maxLength: 50
              value:
                type: string
                description: >
                  If type is 'email', string must be match email format, the '+'
                  character is not allowed. If type is 'phone', string must be
                  in an international format, the + symbol and the 1-3 digit
                  country calling code.
                example: email@email.com
                maxLength: 50
        addresses:
          type: array
          description: >
            An array containing business's addresses. Address should follow
            USPS normalization practices. (Example: "St" instead of "street",
            common unit designator "APT" instead of "apartment"). Periods "."
            are not allowed. Zip+4 is not required.
          required:
            - addressType
          items:
            type: object
            properties:

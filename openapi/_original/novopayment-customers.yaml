  parameters:
    productId:
      name: productId
      in: path
      description: A unique identifier that associates the data from the product with
        the recipient.
      required: true
      schema:
        type: integer
        example: 221BF87320F278DC9F41C835AD0D5111B2B0FF68
        maxLength: 38
    customerId:
      name: customerId
      in: path
      description: Unique customer identifier.
      required: true
      schema:
        type: string
        example: 69E2DBE6B18C7ACD
        maxLength: 40
    documentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        example: 2
    documentTypeId:
      name: documentTypeId
      in: query
      required: false
      schema:
        type: string
        example: 3
    statusId:
      name: statusId
      in: query
      required: false
      schema:
        type: string
        enum:
          - active
          - inactive
    top:
      name: top
      in: query
      required: false
      schema:
        type: string
        example: 4
    fromCreatedDate:
      name: fromCreatedDate
      in: query
      required: false
      schema:
        type: string
        example: 2021/01/29 10:53:54
    toCreatedDate:
      name: toCreatedDate
      in: query
      required: false
      schema:
        type: string
        example: 2021/01/29 10:53:54
    documentNumber:
      name: documentNumber
      in: query
      required: false
      schema:
        type: string
        example: C96485632
    firstNames:
      name: firstNames
      in: query
      required: false
      schema:
        type: string
        example: Jhon
    lastNames:
      name: lastNames
      in: query
      required: false
      schema:
        type: string
        example: Doe
    documentIso2:
      name: documentIso2
      in: query
      required: true
      schema:
        type: string
        example: US
    fromReviewDate:
      name: fromReviewDate
      in: query
      required: false
      schema:
        type: string
        example: 2021/01/29 10:53:54
    toReviewDate:
      name: toReviewDate
      in: query
      required: false
      schema:
        type: string
        example: 2021/01/29 10:53:54
  schemas:
    RQApproveOrDeclineARecipient:
      type: object
      required:
        - actionId
        - comments
        - updatedBy
      properties:
        actionId:
          type: integer
          description: |
            Action to perform

            **Allowed values:**

            0: Decline

            1: Approve
          enum:
            - 0
            - 1
          maxLength: 200
        comments:
          type: string
          description: Comments related to the action.
          example: Invalid Recipient.
          maxLength: 200
        updatedBy:
          type: string
          description: The user who performs the action.
          example: Master
          maxLength: 100
    RQCreateCommercialCustomers:
      type: object
      required:
        - legalName
        - tradingName
        - industryType
        - entityType
        - entityPurpose
        - registrationNumber
        - incorporationDate
        - identifications
        - webSite
        - contacts
        - addresses
      properties:
        legalName:
          type: string
          description: >
            Entity legal name as mentioned in official documentation.


            __*Only letters, numbers and the following special characters are allowed: dash, apostrophes, period, coma and spaces.__
          example: commercial LegalName
          maxLength: 50
        tradingName:
          type: string
          description: >
            Entity commercial name as mentioned in official documentation.


            __*Only letters, numbers and the following special characters are allowed: dash, apostrophes, period, coma and spaces.__
          example: commercial Trading Name
          maxLength: 50
        industryType:
          type: string
          description: >
            Industry Type.


            **Refer to:** [Industry Type](https://developer.novopayment.com/api/request-and-response-codes#item-industrytype)
          example: 44122
          maxLength: 50
        entityType:
          type: string
          description: >
            Entity Type.


            **Refer to:** [Entity Type](https://developer.novopayment.com/api/request-and-response-codes#item-entitytype)
          example: UNIQUE OWNER
          maxLength: 50
        entityPurpose:
          type: string
          description: Entity Purpose Description.
          example: commercial Purpose.
          maxLength: 50
        registrationNumber:
          type: string
          description: Tax id number or tax record number of the business.
          example: 9834092375230
          maxLength: 50
        incorporationDate:
          type: string
          description: |
            Operation timestamp expressed in ISO 8601.
          example: "2020-01-03T16:05:56.517Z"
          maxLength: 50
        identifications:
          type: array
          description: >
            Array allows to add more than one business id to a business
            BUSINESS_TAX_ID BUSINESS_NUMBER TAXPAYER_IDENTIFICATION_NUMBER.
          required:
            - type
            - value
          items:
            type: object
            properties:
              type:
                type: string
                description: >
                  Identification.


                  *Format:* BUSINESS_TAX_ID, BUSINESS_NUMBER o TAXPAYER_IDENTIFICATION_NUMBER
                enum:
                  - BUSINESS_TAX_ID
                  - BUSINESS_NUMBER
                  - TAXPAYER_IDENTIFICATION_NUMBER
                maxLength: 50
              value:
                type: string
                description: |
                  Identification number associated to the format.
                example: XX-XXXXXXX
                maxLength: 50
        webSite:
          type: string
          description: Company website.
          example: https://by.com
          maxLength: 50
        contacts:
          type: array
          description: An array containing contact information.
          required:
            - type
            - value
          items:
            type: object
            properties:
              type:
                type: string
                description: A standard set of values that indicate the contact type [EMAIL,
                  PHONE].
                enum:
                  - EMAIL
                  - PHONE
                maxLength: 50
              value:
                type: string
                description: >
                  If type is 'email', string must be match email format, the '+'
                  character is not allowed. If type is 'phone', string must be
                  in an international format, the + symbol and the 1-3 digit
                  country calling code.
                example: email@email.com
                maxLength: 50
        addresses:
          type: array
          description: >
            An array containing business's addresses; Address should follow
            USPS normalization practices (Example: "St" instead of "street",
            common unit designator "APT" instead of "apartment"). Periods "."
            are not allowed. Zip+4 is not required.
          required:
            - addressType
          items:
            type: object
            properties:
              addressType:
                type: string
                description: Address type.
                example: RESIDENCE
                maxLength: 20
              addressLine1:
                type: string
                description: Address Line One.
                example: address line 1
                maxLength: 100
              addressLine2:
                type: string
                description: Address Line Two.
                example: address line 2
                maxLength: 100
              homeNumber:
                type: string
                description: House number.
                example: Office 124
                maxLength: 50
              buildingNumber:
                type: string
                description: Building number.
                example: Building C
                maxLength: 50
              city:
                type: string
                description: City.
                example: New York
                maxLength: 100
              zipCode:
                type: string
                description: ZIP code.
                example: 94398
                maxLength: 10
              country:
                type: string
                description: Country in ISO code 2 digits.
                example: US
                maxLength: 2
    RQCreateIndividualCustomer:
      type: object
      required:
        - generalInformation
        - identityDocumentList
        - personalAddress
        - contactInformation
      properties:
        userCredentials:
          type: object
          description: Customized object contains the user credentials information.
          properties:
            username:
              type: string
              description: Username in the application.
              example: JDOE
              maxLength: 20
            password:
              type: string
              description: Encrypted user password in the application.
              example: SDFSD890V131MNHJK543ER32SD
              maxLength: 50                      
        generalInformation:
          type: object
          description: Customized object contains the general information customer.
          required:
            - firstNames
            - lastNames
            - civilStatus
            - birthCountry
          properties:
            firstNames:
              type: string
              description: Customer first name.
              example: John
              maxLength: 50
            lastNames:
              type: string
              description: Customer last name.
              example: Doe
              maxLength: 50
            isPep:
              type: boolean
              description: Is a person politically exposed person?
              example: true
            gender:
              type: object
              description: Customized object contains the gender information.
              required:
                - id
              properties:
                id:
                  type: string
                  description: >
                    **Refer to:**
                    [Gender](https://developer.novopayment.com/api/request-and-response-codes#item-gender)
                  example: 1
                  maxLength: 5
            civilStatus:
              type: object
              description: Customized object contains the civil status information.
              required:
                - id
              properties:
                id:
                  type: string
                  description: >
                    __**Refer to:** [Civil
                    Status](https://developer.novopayment.com/api/request-and-response-codes#item-civilstatus)__
                  example: 1
                  maxLength: 5
            birthCountry:
              type: object
              description: Customized object contains the country information.
              required:
                - iso2
              properties:
                iso2:
                  type: string
                  description: >
                    **Refer to:** [ISO Country

      properties:
        vCardId:
          type: string
          maxLength: 42
          description: |
            This value was generated on Universal Card Enrollment.
          example: v-123-b25dd0af-2960-420b-8aaa-49b3e466c00f
        paymentAccountReference:
          type: string
          maxLength: 29
          description: >
            Account reference number, this field is Required if the vCardId is
            null.
          example: Phasellus pharetra vulputate metus
        encryptedPassData:
          type: string
          maxLength: 8192
          description: >
            Authentication data consisting of encrypted PAN, expiry date, name
            etc.
            This value will be needed to submit it, to the ApplePay SDK.
          example: V3bICnkm37BmBKEF9FAKK2zh2SvLhe6PqjvJaHS2t0eJaKVL
        activationData:
          type: string
          maxLength: 8192
          description: >
            Activation data consisting of encrypted nonce, nonce signature, and
            authCode.
          example: TUJQQUMtMS1GSy00MDEyMDAuMS0tVERFQS1CMEQwQjcxNDNFN0M1QTc3M0I5MTc1OTA3RENCMUEzRUNCRENCQjJEMzI2MDBEOEY4RTU5OEI5QzE4OTlGNzA3RjFCMDQ2RDY3RDNDREUwMg
        ephemeralPublicKey:
          type: string
          maxLength: 8192

          maxLength: 2
          description: |
            Month when the card is set to expire
          example: "02"
        expirationYear:
          type: string
          maxLength: 4
          description: |
            Year when the card is set to expire
          example: "2025"
        nameOnAccount:
          type: string
          maxLength: 256
          description: |
            Full name on the card, alphanumeric value with no 
            special characters
          example: "John Doe"

          type: string
          maxLength: 20
          enum:
            - DEBIT
            - CREDIT
            - PREPAID
        cardBrand:
          type: string
          maxLength: 20
          enum:
            - VISA
            - MC
        billingAddress:
          $ref: "#/components/schemas/ObjBillingAddressEnablement"

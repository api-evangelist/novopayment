              minLength: 1
              maxLength: 100
            nationalIdNumber:
              type: string
              description: |
                Only available to Issuers who are customers of NovoPayment issuing services, it corresponds to the Identification Number used at the time of Account/Card creation.
                
                By submitting this value no externalConsumerID is required.
              example: "1090516789"
              minLength: 1
              maxLength: 32
            externalConsumerIDOwnerBID:
              type: string
              description: |
                  Visa Business Identifier (BID) of the entity to which an External Consumer ID belongs.

                  This field is optional for clients integrated prior to its introduction. 
                  Required otherwise. Questions should be directed to your Visa Integration Specialist.
              example: "10098765"
              minLength: 1
              maxLength: 8
              pattern: '^\d*$'
        intent:
          $ref: "#/components/schemas/ObjIntent"
        actionType:
          type: string
          enum: [TAKE_IN,TAKE_OUT]
          example: "TAKE_IN"
        reason: 
          type: string
          description: vulnerability reason

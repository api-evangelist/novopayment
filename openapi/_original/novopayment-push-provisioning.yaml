          type: string
          maxLength: 140
          description: |
            Line 1 of the billing address (Must use UTF-8 characters)
          example: 5 Central Drive
        stateProvinceCode:
          type: string
          maxLength: 3
          description: |
            Must be in ISO 3166-2 format, alphabetic value with max length of 3 characters, 
            with no dashes or spaces
          example: NC
        postalCode:
          type: string
          maxLength: 16
          description: |
            U.S.: 5-digit numeric value (e.g. 94100), spaces not allowed.
            Canada: 6-digit alphanumeric value (e.g. M4B1B3), spaces allowed.
            Other countries: 5-16 digit alphanumeric value without special characters, spaces allowed.
          example: "27265"
        countryCode:
          type: string
          maxLength: 3
          description: |
            Must be in ISO 3166-1 alpha-2 or ISO 3166-1 alpha-3 or ISO 3-digit numeric format
          example: "840"
        city:
          type: string
          maxLength: 100
          description: |
            City of the billing address, no special characters
          example: High Point
        phoneNumber:
          type: string
          maxLength: 32
          description: |
            Cardholder phone number including country code
          example: "336-222-6060"

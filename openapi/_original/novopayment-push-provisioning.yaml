          maxLength: 100
          example: "63421837-d597-4f0f-89e4-930c1a7b9e85"
        firstName:
          type: string
          minLength: 1
          maxLength: 35
          example: "Alex"
        lastName:
          type: string
          minLength: 1
          maxLength: 35
          example: "Miller"
        middleName:
          type: string
          maxLength: 35
          example: "Robert"
        emails:
          type: array
          maxItems: 5
          items:
            type: string
          example: ["alex123@hotmail.com"]
        phones:
          type: array
          maxItems: 5
          items:
            type: string
          example: ["16504005555"]
        externalConsumerIDOwnerBID:
          type: string
          pattern: '^\d*$'
          maxLength: 8
          example: "10098765"
        locale:
          type: string
          minLength: 2
          maxLength: 5
          example: "en_US"

openapi: 3.2.0
info:
  title: Novopayment Documents API
  version: v1
  description: 'Operations tagged Documents across 2 of this provider''s published API definitions: novopayment-onboarding-openapi.yml, novopayment-profile-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Sandbox
  url: https://sandbox-api.novopayment.com/onboarding/v1
- description: Sandbox
  url: https://sandbox-api.novopayment.com/profiles/v1
security:
- oAuth2ClientCredentials: []
tags:
- name: Documents
paths:
  /documents:
    get:
      summary: Get Customer's Support Documents
      description: This operation checks the list of documents required for the verification and support of the account, which is requested based on the responses of previous actions in the registration process and the parameterization stipulated by the tenant.
      operationId: GetCustomersSupportDocuments
      responses:
        '200':
          $ref: '#/components/responses/RSGetCustomersSupportDocuments200'
        '400':
          $ref: '#/components/responses/RSGetCustomersSupportDocuments400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Documents
    post:
      summary: Upload Support Document
      description: This operation allows to register the documents requested for the account verification.
      requestBody:
        $ref: '#/components/requestBodies/RQUploadSupportDocument'
      operationId: UploadSupportDocument
      responses:
        '200':
          $ref: '#/components/responses/RSUploadSupportDocument200'
        '400':
          $ref: '#/components/responses/RSUploadSupportDocument400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Documents
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/onboarding/v1
  /{customerId}/documents:
    post:
      summary: Customer Document Upload
      description: This operation allows to upload of the requested documents for the validation of all the account information. Later, the tenant may request additional documents.
      requestBody:
        $ref: '#/components/requestBodies/RQCustomerDocumentUpload'
      operationId: CustomerDocumentUpload
      parameters:
      - $ref: '#/components/parameters/customerId'
      responses:
        '200':
          $ref: '#/components/responses/RSCustomerDocumentUpload200'
        '400':
          $ref: '#/components/responses/RSCustomerDocumentUpload400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - Documents
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/profiles/v1

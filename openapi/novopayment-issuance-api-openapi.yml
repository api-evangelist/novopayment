openapi: 3.2.0
info:
  title: Novopayment Issuance API
  version: v1.3
  description: 'Operations tagged Issuance across 2 of this provider''s published API definitions: novopayment-cards.yaml, novopayment-cards-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Sandbox
  url: https://sandbox-api.novopayment.com/api/v1.3
security:
- oAuth2ClientCredentials: []
tags:
- name: Issuance
paths:
  /cards/issuance:
    post:
      tags:
      - Issuance
      summary: Card And Account Bundled
      description: 'The main mechanism for issuing cards, the Card and Account Bundled endpoint combines the creation of an account with its respective account holder and the issuance of a card. If an account for the cardholder already exists (for example if the customer already onboarded onto your application) then the account number you’ve assigned can be submitted to NovoPayment to create the registry and issue the card. A lower level of information needs to be transmitted to NovoPayment in this scenario. Alternatively, when NovoPayment is the one creating the account, the data collected as part of account and cardholder creation can be submitted to an AML/KYC provider to review the applicant. NovoPayment orchestrates the service and sends the relevant data.


        Cards issued can be named or unnamed. Unnamed cards do not have a cardholder associated with them. This process is typically done to have a stack of assignable prepaid cards which can be provided to consumers and then assigned via the Cardholder Creation endpoint.


        Once card and account information has been submitted, virtual cards can be issued instantly. Card embossing for physical cards can also begin immediately depending on your process configuration.'
      operationId: CardAndAccountBundled
      requestBody:
        $ref: '#/components/requestBodies/RQCardAndAccountBundled'
      responses:
        '200':
          $ref: '#/components/responses/RSCardAndAccountBundled200'
        '400':
          $ref: '#/components/responses/RSCardAndAccountBundled400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/api/v1.3
  /cards/{cardId}:
    get:
      tags:
      - Issuance
      summary: Card Information
      description: 'Enable a cardholder to retrieve and view information about a card. This operation would be performed to show card details in a UI, or to retrieve a Dynamic CVV2 when shopping online with a virtual card.


        Using the Card ID, NovoPayment will return information regarding the cardholder, CVV2, card type, card status, and more.'
      operationId: CardInformation
      parameters:
      - $ref: '#/components/parameters/cardId'
      - $ref: '#/components/parameters/cvvNumber'
      - $ref: '#/components/parameters/dynCvvNumber'
      responses:
        '200':
          $ref: '#/components/responses/RSCardInformation200'
        '400':
          $ref: '#/components/responses/RSCardInformation400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/api/v1.3
  /cards/{cardId}/status:
    put:
      tags:
      - Issuance
      summary: Card Active Status
      description: A cardholder can activate a card in several ways, based on program configurations and mechanism you wish to extend. Whether it is by keying in card information into a mobile or web UI, inputting their PIN in an ATM, or calling your customer support line, this endpoint allows you to send confirmation to NovoPayment that the card is active and can be used for transactions.
      operationId: CardActiveStatus
      parameters:
      - $ref: '#/components/parameters/cardId'
      requestBody:
        $ref: '#/components/requestBodies/RQCardActiveStatus'
      responses:
        '200':
          $ref: '#/components/responses/RSCardActiveStatus200'
        '400':
          $ref: '#/components/responses/RSCardActiveStatus400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/api/v1.3
  /cards/{cardId}/tophysical:
    put:
      tags:
      - Issuance
      summary: Virtual To Physical Card
      description: 'Depending on your program configurations, a virtual and/or physical is created upon application approval. When both types of cards are issued immediately upon approval, they each receive a different PAN number, though both are associated to the same underlying account.


        In a case when only a virtual card is issued, through the Virtual to physical card endpoint a cardholder can convert their virtual card into a physical card which will have the same PAN number.


        The virtual card is blocked until unblocked by the physical card being activated.'
      operationId: VirtualToPhysicalCard
      parameters:
      - $ref: '#/components/parameters/cardId'
      requestBody:
        $ref: '#/components/requestBodies/RQVirtualToPhysicalCard'
      responses:
        '200':
          $ref: '#/components/responses/RSVirtualToPhysicalCard200'
        '400':
          $ref: '#/components/responses/RSVirtualToPhysicalCard400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/api/v1.3
  /cards/replacement:
    post:
      tags:
      - Issuance
      summary: Card Replacement
      description: 'If a card has been lost, stolen, or generally needs to be replaced, this

        functionality is leveraged by an end user or a back-office administrator

        to request a replacement card for a cardholder (with a new PAN number).

        Only physical cards can be replaced with this endpoint.


        Cards must be blocked to be replaced. If an attempt is made to replace an active unblocked card,

        an error message will be received. If a temporary block is needed instead of a card replacement,

        that can be accomplished using the Block Card endpoint.'
      operationId: CardReplacement
      requestBody:
        $ref: '#/components/requestBodies/RQCardReplacement'
      responses:
        '200':
          $ref: '#/components/responses/RSCardReplacement200'
        '400':
          $ref: '#/components/responses/RSCardReplacement400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/api/v1.3
  /cards/cardholders:
    post:
      tags:
      - Issuance
      summary: Cardholder Association
      description: 'After (prepaid) unnamed cards have been issued and provided to the holder of the card, they can be assigned to that holder by creating a record of that cardholder in the system.


        It should be noted that if the cardholder is not yet registered, a new one will be created, however, if the cardholder already exists, their data will be update.


        Once linked, a cardholder can activate the card.'
      operationId: CardCardholdersAssociation
      requestBody:
        $ref: '#/components/requestBodies/RQCardCardholders'
      responses:
        '200':
          $ref: '#/components/responses/RSCardIdUserId200'
        '400':
          $ref: '#/components/responses/RSCardHolderCreate400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/api/v1.3

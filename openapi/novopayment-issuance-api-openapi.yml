  parameters:
    cardId:
      name: cardId
      in: path
      description: Unique card identification (uuid format)
      required: true
      example: 502c2656-7110-4994-a820-f593e468c6b4
      schema:
        type: string
        maxLength: 36
        minLength: 36
    cvvNumber:
      name: cvvNumber
      in: query
      description: 'Use this value to show the static security code.


        **Default value**: false

        '
      required: false
      schema:
        type: boolean
        example: false
    dynCvvNumber:
      name: dynCvvNumber
      in: query
      description: 'Use this value to show the dynamic security code.


        **Default value**: false

        **Note**: You can only retrieve the dynamic CVV if you have this configuration in NovoPayment''s system.

        '
      required: false
      schema:
        type: boolean
        example: false

          type: string
          description: 'Encrypted form for static security code for a card using AES256 algorithm.

            '
          example: i5eMuNnaVHqIjz4PFHj23w==
          maxLength: 24
          minLength: 24
          pattern: \s*|[\w\d=/+]{24}
        description:
          type: string
          description: 'Payment instrument description.

            '
          example: Visa Card
          maxLength: 20
          minLength: 1
          pattern: ([\w\dñÑäÄëËïÏöÖüÜáéíóúáéíóúÁÉÍÓÚÂÊÎÔÛâêîôûàèìòùÀÈÌÒÙ]+[\s]{0,1})+

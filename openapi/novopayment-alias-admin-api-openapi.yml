openapi: 3.2.0
info:
  description: The Alias Directory API enables a set of operations to store and manage users' information safely for sending funds between them.
  version: v1
  title: Alias Directory Alias Admin API
  contact:
    email: support@novopaymen.com
servers:
- description: Sandbox
  url: https://sandbox-api.novopayment.com/aliasdirectory/v1
security:
- oAuth2ClientCredentials: []
tags:
- name: Alias Admin
  description: Alias Administrator
paths:
  /alias:
    post:
      tags:
      - Alias Admin
      operationId: createAlias
      summary: Create Alias
      description: Create an alias with an associated primary payment instrument to use it in funds transfers.
      requestBody:
        $ref: '#/components/requestBodies/CreateAliasInfoRequest'
      responses:
        '200':
          $ref: '#/components/responses/RSCreateAlias200'
        '400':
          $ref: '#/components/responses/RSCreateAlias400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
        default:
          $ref: '#/components/responses/RS500'
  /alias/find:
    post:
      tags:
      - Alias Admin
      operationId: findAlias
      summary: Find alias
      description: Search if someone exists in an alias directory.
      requestBody:
        $ref: '#/components/requestBodies/FindAliasRequest'
      responses:
        '200':
          $ref: '#/components/responses/RSFindAlias200'
        '400':
          $ref: '#/components/responses/RSFindAlias400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
        default:
          $ref: '#/components/responses/RS500'
  /alias/{aliasId}:
    get:
      tags:
      - Alias Admin
      summary: Get alias by aliasId
      description: Obtains the information of the alias by a unique identifier called AliasID
      operationId: GetAliasByAliasId
      parameters:
      - $ref: '#/components/parameters/aliasId'
      responses:
        '200':
          $ref: '#/components/responses/RSGetAliasByAliasId200'
        '400':
          $ref: '#/components/responses/RSGetAliasByAliasId400'
        '401':
          $ref: '#/components/responses/RS401UpdateAlias'
        '500':
          $ref: '#/components/responses/RS500'
        default:
          $ref: '#/components/responses/RS500'
    put:
      tags:
      - Alias Admin
      summary: Update Alias
      description: This operation updates information of the alias and cardholder in the directory.
      operationId: UpdateAlias
      parameters:
      - $ref: '#/components/parameters/aliasId'
      requestBody:
        $ref: '#/components/requestBodies/RQUpdateAlias'
      responses:
        '200':
          $ref: '#/components/responses/RSUpdateAlias200'
        '400':
          $ref: '#/components/responses/RSUpdateAlias400'
        '401':
          $ref: '#/components/responses/RS401UpdateAlias'
        '500':
          $ref: '#/components/responses/RS500'
        default:
          $ref: '#/components/responses/RS500'
    delete:
      tags:
      - Alias Admin
      summary: Delete Alias by aliasId
      description: Delete an existing alias from the alias directory
      operationId: DeleteAliasByAliasId
      parameters:
      - $ref: '#/components/parameters/aliasId'
      responses:
        '200':
          $ref: '#/components/responses/RSDeleteAliasByAliasId200'
        '400':
          $ref: '#/components/responses/RSDeleteAliasByAliasId400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RS401'
              examples:
                Invalid Access Token:
                  $ref: '#/components/examples/InvalidAccessToken'
                Access Token Expired:
                  $ref: '#/components/examples/AccessTokenExpired'
        '500':
          $ref: '#/components/responses/RS500'
        default:
          $ref: '#/components/responses/RS500'
components:
  requestBodies:
    RQUpdateAlias:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RQUpdateAlias'
          examples:
            Update Alias:
              $ref: '#/components/examples/RQEndpointUpdateAlias'
      required: true
    FindAliasRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FindAliasRequest'
          examples:
            Find Alias:
              $ref: '#/components/examples/RQEndpointFindAlias'
      required: true
    CreateAliasInfoRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateAliasInfoRequest'
          examples:
            Generate Alias by Card:
              $ref: '#/components/examples/RQEndpointCreateAlias'
            Generate Alias by Account:

          example: Interbank
          maxLength: 30
          pattern: ([\w\dñÑäÄëËïÏöÖüÜáéíóúáéíóúÁÉÍÓÚÂÊÎÔÛâêîôûàèìòùÀÈÌÒÙ]+[\s]{0,1})+
        bankAccountNumber:
          type: string
          description: 'User’s bank account number

            '
          example: '35426789'
          maxLength: 30
        issuerCountryCode:
          type: string
          description: 'Issuer country code in ISO 3166 alpha-3 code or Country Code (numeric) of payment instrument

            '
          example: USA
          maxLength: 3
          minLength: 3
          pattern: ^[^\s]{3}$

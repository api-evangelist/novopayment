    PaymentInstrument:
      additionalProperties: false
      type: object
      required:
      - cardToken
      - cvvNumber
      - brandType
      - issuerCountryCode
      description: 'Object Payment Instrument Contains information of the payment instrument to be stored, Conditional if not account is present

        '
      properties:
        cardToken:
          type: string
          description: 'Card data encrypted with the AES256 algorithm.

            __The cardToken attribute is composed of the following values:__

            __PAN:__ Card’s primary account number or token

            __Expiration Date:__ Card expiration date

            __SALT:__ Random Value StringWith the cardToken 48101473592090212201245 the digits in the position 1-16 are the PAN, the next 4 expiration date, and the last 3 the random value.

            When the cardToken is saved in the database, it changes from saltNumber to the saltNumber configured for the tenant.

            '
          example: Maz9oPb4PpW0QxPU0pAA6KYzE2vlEkNitMc+bmibFgo=
          maxLength: 44
          minLength: 44
          pattern: \s*|[\w\d=/+]{44}

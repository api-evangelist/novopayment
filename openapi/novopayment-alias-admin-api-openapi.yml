  schemas:
    DocumentType:
      type: object
      additionalProperties: false
      required:
      - code
      description: 'Document Type object.

        Contains the document code

        '
      properties:
        code:
          type: string
          description: 'Type of identification

            __Refer to:__ [here](https://developer.novopayment.com/api/request-and-response-codes#item-documenttype)

            '
          example: GOVERNMENT_ID
          maxLength: 25
          minLength: 1
    Accounts:
      type: array
      maxItems: 10
      xml:
        name: accounts
        wrapped: true
      items:
        $ref: '#/components/schemas/Account'
    RS500:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - datetime
      properties:
        code:
          type: string
          example: 500.01.999
          description: Operation response code
          minLength: 10
          maxLength: 10
          pattern: ^[0-9]{3}.[0-9]{2}.[0-9]{3}$
        message:
          type: string
          example: Internal Server Error
          description: Response code description
          minLength: 1
          maxLength: 140
          pattern: '[a-zA-Z0-9:.\s]{1,140}'
        datetime:
          type: string
          example: '2020-01-03T16:05:56.517Z'
          format: date-time
          maxLength: 24
    Account:
      type: object
      description: Detailed account information, conditional if cards no present
      required:
      - accountType
      - accountNumberEncrypt
      - countryCode
      - currencyCode
      - accountIdentify
      additionalProperties: false
      properties:
        accountId:
          type: string
          description: 'account identificator.

            '
          example: 1297ceb1-cd42-4586-940d-6471d733d53e
          maxLength: 50
          pattern: ^(?!\s)(?!.*\s$).{1,50}$
        accountInternalId:
          type: string
          description: 'account Internal UUID. (**this field should be unique**)

            '
          example: 0458a69b-e70d-49b3-86d2-81d6b7569979
          maxLength: 36
          pattern: ^(?!\s)(?!.-*\s$).{1,50}$
        accountName:
          type: string
          description: 'account Name.

            '
          example: AccountPrincipal
          maxLength: 50
          pattern: ^(?!\s)(?!.*\s$).{1,50}$
        accountType:
          $ref: '#/components/schemas/AccountType'
        accountNumber:
          type: string
          description: 'masked account number.

            '
          example: '********1432'
          maxLength: 34
        accountNumberEncrypt:
          type: string
          description: 'account number encrypted with aes256.

            '
          example: bXgZyYJ5OmRjEuJq9BWSxwpxwBappGeW6N+PHky5UhM=
          maxLength: 100
        accountIdentify:
          type: string
          description: 'allow values DEFAULT, IBAN

            '
          example: IBAN
          maxLength: 10
          pattern: (\s)*|DEFAULT|IBAN
        countryCode:
          type: string
          description: 'Country code in ISO 3166 alpha-3 code or Country Code (numeric).

            '
          example: USA
          minLength: 3
          maxLength: 3
          pattern: ^(?!\s)(?!.*\s$).{3,3}$
        currencyCode:
          type: string
          description: 'Currency code  alpha-3 code or Numeric Code (numeric).

            '

    RQOnboardingRequest:
      type: object
      required:
        - serviceContext
        - companyPrimaryLegalName
        - primaryWebsiteURL
        - companyCity
        - companyCountryCode
        - primaryContactEmail
        - acquirerIdentifiers
      properties:
        serviceContext:
          type: string
          description: |
            Format: It is one of the following values:

            - TOKENIZATION
          example: TOKENIZATION
          enum:
            - TOKENIZATION
          maxLength: 13
        dunsNumber:
          type: string
          description: |
            A D&B DUNS number is a nine-digit number that is recognized as the
            universal standard to track businesses worldwide. It is designed to
            enhance the credibility of your business and enable potential
            customers, lenders and suppliers to learn about your company.

            [(1)Get a D-U-N-S Number - Establish Your Business - D&B (dnb.com)](https://www.dnb.com/duns/get-a-duns.html)

          maxLength: 9
          example: 150483782
        companyPrimaryTradeName:
          type: string
          description: |
            Trade name of token requestor, such as a doing-business-as (DBA)
            name. If not specified, the legal name (companyPrimaryLegalName) is
            used by default.

            Format: Alphanumeric, excepting semi-colon, percent sign, and
            parentheses; maximum 75 characters.
          example: MyMerchant.com”
          maxLength: 75
        companyPrimaryLegalName:
          type: string
          description: |
            Legal name of token requestor. Some processors may not support a
            75-character legal name. You cannot exceed the limit imposed by your
            processor.

            Format: Alphanumeric, excepting semi-colon, percent sign, and
            parentheses; maximum 75 characters.
          example: My Merchant”
          maxLength: 75
        primaryWebsiteURL:
          type: string
          description: |
            The URL for your token requestor’s site for handling VTS transactions.

            Format: Alphanumeric, excepting semi-colon, percent sign, and
            parentheses; maximum 100 characters.
          example: http://www.myMerchant.com
          maxLength: 100
        companyAddress1:
          type: string
          description: |
            First line of the token requestor’s primary address.

            Format: Alphabetic, numeric, or the following characters: spaces,
            '(single quote), #(pound-sign or hash), ,(comma), _(underscore),
            :(colon), /(forward slash), and -(hyphen); maximum 140 characters.
          example: 1 Main Street
          maxLength: 140
        companyAddress2:
          type: string
          description: |
            First line of the token requestor’s primary address.

            Format: Alphabetic, numeric, or the following characters: spaces,
            '(single quote), #(pound-sign or hash), ,(comma), _(underscore),
            :(colon), /(forward slash), and -(hyphen);maximum 140 characters.
          example: 1 Main Street
          maxLength: 140
        companyCity:
          type: string
          description: |
            City in the token requestor’s primary address.
            Format: Alphabetic, numeric, or the following characters: spaces,
            '(single quote), .(period), and -(hyphen); maximum 100 characters.
          example: San Francisco
          maxLength: 100
        companyStateProvinceCode:
          type: string
          description: |
            State or province code associated with the physical address in the
            specified country. The companyStateProvinceCode for US must be a
            standard 2-characters code.

            Format: The suffix of an ISO-3166-2 country code, corresponding to
            the companyCountryCode, maximum 2 characters.
          example: CA
          maxLength: 2
        companyPostalCode:
          type: string
          description: |
            Postal code associated with the primary address of token requestor,
            such as a ZIP code.

            Format: Depends on companyStateProvinceCode, maximum 7 characters.
          example: 94301
          maxLength: 7
        companyCountryCode:
          type: string
          description: |
            ISO-3166-1 alpha-2 standard country associated with the token
            requestor’s primary address.

            Format: Alphabetic; maximum 2 characters
          example: US
          maxLength: 2
        companyPhone:
          type: string
          description: |
            Token requestor’s primary phone number.
            Format: Numeric or hyphens, parentheses, period, or plus sign, valid.
          example: 4155551212
          maxLength: 16
        primaryContactFirstName:
          type: string
          description: |
            First name of token requestor’s primary contact person.
            Format: Alphabetic or the following characters: spaces,
            '(single quote), `(back tick), ~(tilde), "(double quote), .(period),
            and -(hyphen); maximum 256 characters.
          example: John
          maxLength: 256
        primaryContactLastName:
          type: string
          description: |
            Surname of token requestor’s primary contact person.
            Format: Alphabetic or the following characters: spaces,
            '(single quote), `(back tick), ~(tilde), "(double quote), .(period),
            and -(hyphen); maximum 256 characters.
          example: Smith
          maxLength: 256
        primaryContactEmail:
          type: string
          description: |
            Email address of token requestor’s primary contact.
            
            Format: Alphanumeric, valid email address; maximum 256 characters.
          example: jsmith@mymerchant888.com
          maxLength: 256
        relationships:
          type: object
          description: |
            Relationship to the token requestor being onboarded, which is by
            externalClientId. If not specified, Visa creates the externalClientId
            for you, which is available in the response.
          $ref: "#/components/schemas/ObjRelationships"
        acquirerIdentifiers:
          type: object
          $ref: "#/components/schemas/ObjAcquirerIdentifiers"
        tokenizationConfiguration:
          type: object
          $ref: "#/components/schemas/ObTokenizationConfiguration"


    ObjDpaTransactionOptions:
      type: object
      required:
        - dpaName
        - merchantChannel
        - transactionAmount
      properties:
        dpaName:
          type: string
          description: Name of the Mobile Application Provider
          example: "dpa name"
          maxLength: 60
        dpaLocale:
          type: string
          description: Mobile Application Provider’s preferred locale. Based on ISO format for language (ISO 639-1) 
            and alpha-2 country code (ISO 3166-1 alpha-2). The language and country should be separated using 
            an underscore (_).
          example: en_US
        dpaAcceptedBillingCountries:
          type: array
          description:  Billing countries. Payments from the listed billing countries are accepted. 
            If this list is empty, all countries are accepted Array of country codes in ISO 3166-1 alpha-2 forma
          example: 
            - "US"
            - “CA”
            - “AU”
        dpaAcceptedShippingCountries:
          type: array
          description: Shipping countries; shipping region country codes that limit the selection of eligible 
            shipping addresses. If this list is empty, all countries are accepted. 
            Array of country codes in ISO 3166-1 alpha-2 format.
          example:
            - "us"
            - "br"
        transactionType:
          type: string
          description: This field is informational only. It is not used in the SRC platform 
            for QR transaction processing. To differentiate CNP transaction
            from a CP transaction, the merchant channel value in 
            dpaTransactionOptions.merchantChannel should correctly 
            indicate the nature of the transaction.
          example: PURCHASE
          enum:
            - PURCHASE (default)
            - BILL_PAYMENT
            - MONEY_TRANSFER
        orderType:
          type: string
          description: Type of orders.
          example: REAUTHORIZATION
          enum: 
            - REAUTHORIZATION
            - RECURRING
            - INSTALLMENT
        transactionAmount:
          type: object
          $ref: "#/components/schemas/ObjtransactionAmount"
        merchantOrderId:
          type: string
          description:  The order identifier generated by the Mobile Application Provider. Typically used for reconciliation process.
          example: "Order1"
        merchantCategoryCode:
          type: string
          description: Code associated with Merchant Category.
          example: "5251"
        merchantCountryCode:
          type: string
          description: The country code associated with the merchant's billing or shipping address.
            ISO-3166 - 1 alpha-2 standard code.
          example: US - United States
        merchantChannel:
          type: string
          description: | 
            Merchant channel establishes the environment in which a QR Code is presented to the consumer. Covering use cases such 
            as retail outlet, Ecommerce, bill payment with the purpose of improving transaction reporting. Refer to tables below 
            for details on populating.

              First Character - Media:
              - 0: Print - Merchant Sticker
              - 1: Print - Bill / Invoice
              - 2: Print - Magazine / Poster
              - 3: Print - Other
              - 4: Screen / Electronic - Merchant POS / POI 
              - 5: Screen / Electronic - Website 
              - 6: Screen / Electronic - App 
              - 7: Screen / Electronic - Other 

              Second Character - Transaction Location:
              - 0: At Merchant premises / registered address
              - 1: Not at Merchant premises / registered address
              - 2: Remote Commerce
              - 3: Other

              Third Character - Merchant Presence:
              - 0: Attended POI
              - 1: Unattended
              - 2: Semi-attended (self-checkout)
              - 3: Other  
          example: "600"
        acquirerId: 
          type: string
          description: Merchant's Acquirer ID. Not currently used in Visa Pull QR payments.
          example: "498909"
        acquirerMid: 
          type: string
          description: Acquirer's Merchant ID. Required in case of Visa QR, utilize Merchant ID provided from QR code.
          example: "00000079"
        sellerPresentedData:
          type: object
          required:
            - qrData
          properties:
            customInputData:
              type: array
              description: Data from the Merchant Presented QR code.List of key and value pair.
              example:
                [{key: “id_55”, value: "02"},{key: “id_56”, value: "10"},{key: “id_58”,value: "MX"}]
            qrData: 
              type: string
              description: Raw entire QR code data, from scanning QR. Base64 encoded.
              example: Zmdk...GdkZg==
        additionalSellerData:
          type: object
          properties:
            customInputData:
              type: array
              description: Custom input data, as presented by seller; all additional custom data required for processing.
                List of key and value pair.
              example: 
                [ { "key": "Sample Key1", "value": "204" }, { "key": "Sample Key2","value": "abc" } ]
        consumerInputData:
          type: object
          properties:
            billNumber:
              type: string
              description: The invoice number or bill number. This number could be provided by the merchant or could be an indication 
                for the mobile application to prompt the consumer to input a Bill Number. For example, the Bill Number may be present 
                when the QR Code is used for bill payment. Required when Present in QR code under the Additional Data Field Template.
            mobileNumber:
              type: string
              description: The mobile number could be provided by the merchant or could be an indication for the mobile application to
                prompt the consumer to input a Mobile Number. For example, the Mobile Number to be used for multiple use cases,
                such as mobile top-up and bill payment. Required when Present in QR code under the Additional Data Field Template.
            storeLabel:
              type: string
              description:  A distinctive value associated to a store. This value could be provided by the merchant or could be an 
                indication for the mobile application to prompt the consumer to input a Store Label. For example, the Store Label may 
                be displayed to the consumer on the mobile application identifying a specific store. Required when Present in QR 
                code under the Additional Data Field Template.
            loyaltyNumber:
              type: string
              description: Typically, a loyalty card number. This number could be provided by the merchant, if known, or could be an 
                indication for the mobile application to prompt the consumer to input their Loyalty Number. Required when Present in 
                QR code under the Additional Data Field Template.
            referenceLabel:
              type: string
              description:  Any value as defined by the merchant or acquirer to identify the transaction. This value could be provided 
                by the merchant or could be an indication for the mobile app to prompt the consumer to input a transaction Reference 
                Label. For example, the Reference Label may be used by the consumer mobile application for transaction logging or 
                receipt display. Required when Present in QR code under the Additional Data Field Template.
            customerLabel:
              type: string
              description: Any value identifying a specific consumer. This value could be provided by the merchant (if known) or could 
                be an indication for the mobile application to prompt the consumer to input their Customer Label. For example, the 
                Customer Label may be a subscriber ID for subscription services, a student enrolment number, etc. Required when 
                Present in QR code under the Additional Data Field Template.
            terminalLabel:
              type: string
              description: A distinctive value associated to a unique sponsored merchant, store location, terminal, or device. See 
                above Merchant ID generation section for details on populating. For example, the Terminal Label may be displayed 
                to the consumer on the mobile application identifying a specific terminal. Required when Present in QR code under 
                the Additional Data Field Template.
            purposeOfTransaction:
              type: string
              description: Any value defining the purpose of the transaction. This value could be provided by the merchant or could 
                be an indication for the mobile application to prompt the consumer to input a value describing the purpose of the 
                transaction. For example, the Purpose of Transaction may have the value "International Data Package" for display on 
                the mobile application. Required when Present in QR code under the Additional Data Field Template.
            additionalConsumerDataRequest:
              type: string
              description: Contains indications that the mobile application is to provide the requested information in order to 
                complete the transaction. The information requested should be provided by the mobile application in the 
                authorization without unnecessarily prompting the consumer. For example, the Additional Consumer Data Request may 
                indicate that the consumer mobile number is required to complete the transaction, in which case the mobile 
                application should be able to provide this number (that the mobile application has previously stored) without 
                unnecessarily prompting the consumer. 
              example: ME        


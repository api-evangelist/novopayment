    ObjTokenInfo:
      type: object
      description: 'Structure with token information, the content available could be different in each API service.

        '
      properties:
        token:
          type: string
          maxLength: 19
          description: The token associated with the PAN.
          example: '...'
        tokenType:
          type: string
          maxLength: 32
          description: 'Token type.


            Available values.

            - ECOMMERCE

            - SECURE_ELEMENT

            - CARD_ON_FILE

            - HCE

            - QRC

            '
          enum:
          - ECOMMERCE
          - SECURE_ELEMENT
          - CARD_ON_FILE
          - HCE
          - QRC
          example: ECOMMERCE
        tokenStatus:
          type: string
          description: 'Token status.


            Available values:

            - INACTIVE : The token was created but the activation process is pending.

            - ACTIVE : The token was Activated successfully.

            - SUSPENDED : The token was suspended.

            - DEACTIVATED : The token was eliminated.

            '
          enum:
          - INACTIVE
          - ACTIVE
          - SUSPENDED
          - DEACTIVATED
          example: ACTIVE
        tokenExpirationDate:
          $ref: '#/components/schemas/ObjExpirationDate'
        tokenRequestorName:
          type: string
          maxLength: 100
          description: 'Token requestor name.

            '
          example: NovoPayment Wallet
        tokenAssuranceMethod:
          type: string
          maxLength: 19
          description: "Method of Issuer ID&V that has taken place at time of provisioning,\ndevice binding.\n- 00 Cardholder Verification was Not Performed\n- 10 Card Issuer Account Verification\n- 11 Card Issuer Interactive Cardholder Verification - 1 Factor\n- 12 Card Issuer Interactive Cardholder Verification - 2 Factor\n- 13 Card Issuer Risk Oriented Non-Interactive Cardholder\n  Authentication\n- 14 Card Issuer Asserted Authentication\n"
          example: '00'
        numberOfActiveTokensForPAN:
          type: number
          maxLength: 4
          description: 'Number of device tokens that are currently active for this PAN.

            '
          example: 2
        numberOfInactiveTokensForPAN:
          type: number
          maxLength: 4
          description: 'Number of device tokens that are currently inactive.

            (device tokens have not been activated) for this PAN

            '
          example: 2
        numberOfSuspendedTokensForPAN:
          type: number
          maxLength: 4
          description: 'Number of device tokens that were activated but are

            suspended for payments for this PAN.

            '
          example: 0
        tokenActivationDate:
          type: string
          format: date-time
          description: 'System date/timestamp, in GMT, of token activation into an active

            state. For an inactive state, this field is left empty and populated

            only when a token transitions to an active state. If a token

            is suspended, this field is populated with the new date/timestamp of

            when an active state resumes.


            Format: yyy-MM-ddTHH:mm:ss.SSSZ

            '
          example: '2022-04-25T23:19:12.000Z'
        tokenDeactivationDate:
          type: string
          description: 'Date of token deactivation.


            This field is left empty and populated only when a token transitions

            to an Inactive state.

            '
          example: '...'
        lastTokenStatusUpdatedTime:
          type: string
          maxLength: 19
          description: 'Original Token account number.


            This field is populated only when performing token for token

            provisioning, this mean the panSource is equal to TOKEN.

            '
          example: '...'
        originalToken:
          type: string
          maxLength: 19
          description: 'Original Token account number.


            This field is populated only when performing token for token

            provisioning, this mean the panSource is equal to TOKEN.

            '
          example: '...'
        originalTokenRequestorID:
          type: number
          maxLength: 4
          description: 'Unique ID assigned to the initiator of the OriginalToken request.


            This field is populated only when performing token for token

            provisioning, this mean the panSource is equal to TOKEN.

            '
          example: '...'
        originalTokenReferenceID:
          type: string
          maxLength: 32
          description: 'Unique ID for the OriginalToken associated with the PAN.


            This field is populated only when performing token for token

            provisioning, this mean the panSource is equal to TOKEN.

            '
          example: '...'
        originalTokenType:
          type: string
          description: 'Token type of the original token.


            This field is populated only when performing token for token

            provisioning, this mean the panSource is equal to TOKEN.

            Format: It is one of the following values:

            - SECURE_ELEMENT

            - HCE

            - CARD_ON_FILE

            - ECOMMERCE

            - QRC

            '
          enum:
          - SECURE_ELEMENT
          - HCE
          - CARD_ON_FILE
          - ECOMMERCE
          - QRC
          example: SECURE_ELEMENT
        originaltokenAssuranceMethod:
          type: string
          description: 'Original token assurance method.


            This field is populated only when performing token for token

            provisioning, this mean the panSource is equal to TOKEN.

            - 00 ID&V Not Performed

            - 10 Card Issuer Account Verification

            - 11 Card Issuer Interactive Cardholder Verification - 1 Factor

            - 12 Card Issuer Interactive Cardholder Verification - 2 Factor

            - 13 Card Issuer Risk Oriented Non-Interactive Cardholder Authentication

            - 14 Card Issuer Asserted Authentication

            '
          enum:
          - '00'
          - '10'
          - '11'
          - '12'
          - '13'
          - '14'
          example: '00'
        autoFillIndicator:
          type: boolean
          description: 'Indicates whether the token is for an autofill use case.

            This value is populated when eventType is equal to TOKEN_CREATED.

            '
          example: false
    RQPanLifecycle:
      type: object
      anyOf:
      - required:
        - operatorID
        - operationType
        - operationReason
        - operationReasonCode
        - panReferenceID
      - required:
        - operatorID
        - operationType
        - operationReason
        - operationReasonCode
        - encryptedData
      - required:
        - operatorID
        - operationType
        - operationReason
        - operationReasonCode
        - cardId
      properties:

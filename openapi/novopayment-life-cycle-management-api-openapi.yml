  schemas:
    RQTokenInquiry:
      type: object
      required:
      - tokenRequestorID
      - tokenReferenceID
      properties:
        tokenRequestorID:
          type: integer
          description: 'Unique ID assigned to the client requesting the token. This value is

            assigned by Visa when creating the VTS project.

            '
          example: 40022358888
        tokenReferenceID:
          type: string
          description: 'Unique ID associating a token with a card. This ID can be used in

            future calls to make operations related to the token in the I-TSP.

            '
          example: DNITHE30194726875288888
        cardHolderVerificationRetrieve:
          type: boolean
          description: 'If cardholderVerificationList is provided in the response, it allows

            the issuers to query the status of cardholder verification requests

            initiated by the token requester for this token.


            Allowed values:

            - True

            - false (default)

            '
          enum:
          - true
          - false
          example: false
        ObjDeviceBindingInfo:
          type: boolean
          description: 'If it is required to provide a deviceBindingInfoList in the response.


            Allowed values

            true

            false (default)

            '
          example: false
    RSErrorCode400TokenLifeCycle:
      type: object
      description: 'Error message code only if the HTTP status is different from 200.

        This field shows the I-TSP if an error was generated in the request.

        '
      properties:
        errorCode:
          type: string
          description: 'Error response Codes:

            - VSE40000: ISS_ERROR_REQUIRED_DATA_MISSING

            - VSE40001: VSE_ERROR_REQUIRED_DATA_MISSING

            - VSE40002: VSE_ERROR_TOKEN_STATE_EXIST

            - VSE40003: VSE_ERROR_TOKEN_NOT_FOUND

            - VSE40009: VSE_INTERNAL_SYSTEM_ERROR

            - VSE40010: VSE_ERROR_CRYPTOGRAPHY_ERROR

            - VSE40011: VSE_TOKEN_NOT_ACTIVE

            '
          enum:
          - VSE40000
          - VSE40001
          - VSE40002
          - VSE40003
          - VSE40010
          - VSE40011
          - VSE40009
    ObjCardHolderInfo_OnlyPAN:
      type: object
      description: 'Object that contains the PAN information.

        '
      required:
      - primaryAccountNumber
      properties:
        primaryAccountNumber:
          type: string
          description: 'Card number.

            '
          maxLength: 19
          example: XX25XX25XX25XX25
    ObjTokenInquiryIssuerDiscretionaryData:
      type: object
      description: 'Encrypted payload data.

        '
      properties:
        fileControlInformation:
          type: string
          maxLength: 128
          description: 'File Control information

            '
          example: PRESENT
        issuerApplicationDiscretionaryData:
          type: string
          maxLength: 32
          description: 'Issuer discretionary information

            '
    ObjCheckEligibilityApplicationInfo:
      type: object
      properties:
        supportsTokenNotifications:
          type: boolean
          description: 'Indicates whether the card supports token claims for transactions

            originated from the device.

            '
          enum:
          - true
          - false
        supportsFPANNotifications:
          type: boolean
          description: 'Indicates if the card supports FPAN Notifications for all transactions

            that point to the FPAN.

            '
          enum:
          - true
          - false
        transactionServiceURL:
          type: string
          description: 'Transaction history URL (TransactionDetails) of the issuer''s web

            service.

            '
          maxLength: 128
        messageServiceURL:
          type: string
          description: 'URL of the message/web service offer. It conforms to the API as

            described in the SOPs and Issuers in the Card Notification Services

            API Specification.

            '
          maxLength: 32
        transactionPushTopic:
          type: string
          description: The issuer notifies the device of new available transactions.
          maxLength: 128
        messagePushTopic:
          type: string
          description: 'The notification push provider notifies the device of new

            available messages.

            '
          maxLength: 128
        appLaunchURL:
          type: string
          description: 'URL given to the issuer associated with the mobile application upon

            launch. If this key is present, the AssociatedStoreIdentifiers key

            must also be present.

            '
          maxLength: 128
        appLaunchURLScheme:
          type: string
          description: 'Registered app URL scheme, in order to deep link from transaction

            notifications and display all transaction notifications.

            App ID must be included in the associated ApplicationIdentifiers

            matrix and the application itself must register for the URL scheme

            specified in this key.

            '
          maxLength: 32
        associatedStoreIdentifiers:
          type: array
          description: 'A list of mobile app store items identifiers for the partner issuer''s

            mobile banking app. The format is specific to a mobile store/phone

            platform. Only one item from the list is used.

            '
          items:
            type: string
            maxLength: 20
        associatedApplicationIdentifiers:
          type: array
          description: 'An array of associated application identifiers. Similar to

            AssociatedStoreIdentifiers, but with explicit application IDs

            (only applicable to SE DWP).

            '
          items:
            type: integer
    RSErrorCode400TokenInqByPAN:
      type: object
      description: 'Error message code only if the HTTP status is different from 200.

        This field shows the I-TSP if an error was generated in the request.

        '
      properties:
        errorCode:
          type: string
          description: 'Error response Codes:

            - VSE40000: VSE_ERROR_INVALID_DATA

            - VSE40001: VSE_ERROR_REQUIRED_DATA_MISSING

            - VSE40003: SE_ERROR_TOKEN_NOT_FOUND

            - VSE40010: VSE_ERROR_CRYPTOGRAPHY_ERROR

            - VSE40009: VSE_INTERNAL_SYSTEM_ERROR

            - NP400900: Not Found

            '
          enum:
          - VSE40000
          - VSE40001
          - VSE40003
          - VSE40010
          - VSE40009
          - NP400900
    RQTokenLifecycle:
      type: object
      required:
      - operatorID
      - operationType
      - operationReason
      - tokenReferenceID
      - tokenRequestorID
      properties:
        operatorID:
          type: string
          maxLength: 16
          description: 'Id representing the operator who made the last change.

            '
          example: 40022358888
        operationType:
          type: string
          description: 'Allowed values:

            - DELETE

            - SUSPEND

            - RESUME

            - CALL_CENTER_ACTIVATION

            - TOKEN_DEVICE_BINDING_APPROVE : When the Issuer approve the binding process.

            - TOKEN_DEVICE_BINDING_APPROVE_CALL_CENTER : When the Issuer approve the binding process after a call with the cardholder.

            - TOKEN_DEVICE_BINDING_APPROVE_BANK_APP : When the Issuer approve the binding process using the application.

            - TOKEN_DEVICE_BINDING_REMOVE

            - CARDHOLDER_STEPUP_CALL_CENTER

            - CARDHOLDER_STEPUP_APP_TO_APP

            - TOKEN_TRUSTED_LISTING_ADD

            - TOKEN_TRUSTED_LISTING_REMOVE

            '
          enum:
          - DELETE
          - SUSPEND
          - RESUME
          - CALL_CENTER_ACTIVATION
          - TOKEN_DEVICE_BINDING_APPROVE
          - TOKEN_DEVICE_BINDING_REMOVE
          - TOKEN_DEVICE_BINDING_APPROVE_CALL_CENTER
          - TOKEN_DEVICE_BINDING_APPROVE_BANK_APP
          - CARDHOLDER_STEPUP_CALL_CENTER
          - CARDHOLDER_STEPUP_APP_TO_APP
          - TOKEN_TRUSTED_LISTING_ADD
          - TOKEN_TRUSTED_LISTING_REMOVE
          example: RESUME
        operationReason:
          type: string
          maxLength: 254
          description: 'Description about the action, or specific reason for the operation. This param is only informative.

            '
          example: Card replacement due to a lost by Agent88.
        tokenReferenceID:
          type: string
          description: 'Unique ID associating a token with a card. This ID can be used in

            future calls to make operations related to the token in the I-TSP.

            '
          example: DNITHE30194726875288888
        tokenRequestorID:
          type: integer
          description: 'Unique ID assigned to the client requesting the token. This value is

            assigned by Visa when creating the VTS project.

            '
          example: 40022358888
        deviceInfo:
          description: "Device Information only required for actions related to DEVICE BINDING; \ndeviceID and deviceIndex must be populated.\n"
          $ref: '#/components/schemas/ObjDeviceInformation'
        activationCode:
          type: string
          description: 'Field for audit processes. Only required when using operationType

            equals CALL_CENTER_ACTIVATION

            '
          maxLength: 8
          example: 5DA...27
        merchantInfo:
          $ref: '#/components/schemas/ObjMerchantInfo'
    ObjTokenInquiryPanTokenDetails:
      type: object
      properties:
        tokenRequestorID:
          type: integer
          description: 'Unique ID assigned to the client requesting the token. This value is

            assigned by Visa when creating the VTS project.

            '
          example: 40022358888
        tokenReferenceID:
          type: string
          description: 'Unique ID associating a token with a card. This ID can be used in

            future calls to make operations related to the token in the I-TSP.

            '
          example: DNITHE30194726875288888
        panReferenceID:
          type: string
          description: 'Unique ID representing a card. This ID can be used in future calls

            referred to the card in the Tokenization flow.

            '
          example: V-3019231458906209630635
        entityOfLastAction:
          type: string
          maxLength: 16
          description: 'Entity that carried out the last action.


            Allowed values:

            - TOKEN_REQUESTOR

            '
          enum:
          - TOKEN_REQUESTOR
          example: TOKEN_REQUESTOR
        walletAccountEmailAddressHash:
          type: string
          description: 'Hash of the email from which the account is opened in the wallet

            that sends the request.

            '
          maxLength: 64
        clientWalletAccountID:
          type: string
          description: 'Identifier of the wallet that sends the request.

            Client provided consumer ID that identifies the wallet account

            holder entity

            '
          maxLength: 32
        panSource:
          type: string
          description: 'Origin of the information of the PAN.


            Allowed values:

            - KEY_ENTERED

            - ON_FILE

            - MOBILE_BANKING_APP

            - TOKEN

            - CHIP_DIP

            - CONTACTLESS_TAP

            '
          enum:
          - KEY_ENTERED
          - ON_FILE
          - MOBILE_BANKING_APP
          - TOKEN
          - CHIP_DIP
          - CONTACTLESS_TAP
          example: MOBILE_BANKING_APP
        tokenType:
          type: string
          description: 'Token type of the source token used for provisioning a new token.


            Available values:

            - ECOMMERCE

            - SECURE_ELEMENT

            - CLOUD_BASE_PAYMENT

            - ECOMMERCE_ENABLER


          type: string
          description: 'Allowed values:

            - UPDATE

            - DELETE

            '
          enum:
          - UPDATE
          - DELETE
          example: UPDATE
        operationReason:
          type: string
          maxLength: 254
          description: 'Specific reason for the operation.


            Sample:Card replacement due to a lost.

            '
          example: Card replacement due to a lost.
        operationReasonCode:
          type: string
          description: "A reason code for the operation.\n\nAllowed values:\n- ACCOUNT_UPDATE - Change the PAN and the expiration date OR reverse\n  the latest change\n- EXP_DATE_UPDATE - Only to change of the expiration date.\n- DELETE_TOKEN - Token cancelation\n- CONTACT_CARDHOLDER - Account inquiry. Contact the account holder\n- PORTFOLIO_CONVERSION\n- ACCOUNT_CLOSED - Closed account advice\n- UPDATE_ACCOUNT_LEVEL_RECORD\n- VAU_CARDHOLDER_OPT_OUT - Opt out of the VAU (Visa Account \nUpdater) product, preventing account updates from being \nshared with the merchant\n- VAU_CARDHOLDER_OPT_IN - Opt back into the VAU (Visa \nAccount Updater) product, resulting in account updates being \nshared with the merchant\n"
          enum:
          - ACCOUNT_UPDATE
          - EXP_DATE_UPDATE
          - DELETE_TOKEN
          - CONTACT_CARDHOLDER
          - PORTFOLIO_CONVERSION
          - ACCOUNT_CLOSED
          - UPDATE_ACCOUNT_LEVEL_RECORD
          - VAU_CARDHOLDER_OPT_OUT
          - VAU_CARDHOLDER_OPT_IN
          example: ACCOUNT_UPDATE
        encryptedData:
          $ref: '#/components/schemas/ObjPanLifecycleEncryptedData'
        cardId:
          type: string
          description: 'Unique Card Identifier at NovoPayment’s Issuance Service, of Original Card.

            '
          maxLength: 40
          example: 5DA...27
        cardIdReplace:
          type: string
          description: 'Unique Card Identifier at NovoPayment’s Issuance Service, of the new card.

            '
          maxLength: 40
          example: 5DA...D8
        newExpirationDate:
          description: "This field is only for Internal Issuers, the new expiration date when reason code is equal \nto EXP_DATE_UPDATE\n"
          type: object
          properties:
            month:
              type: string
              example: 08
            year:
              type: string
              example: '2028'

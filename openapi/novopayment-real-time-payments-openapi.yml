  schemas:

    MoneyTransferRequest:
      type: object
      additionalProperties: false
      required:
        - transactionCode
        - sender
        - recipient
        - transactionAmount
        - transactionReference
      properties:
        domesticTransaction:
          type: boolean
          description: |
            __Allowed values:__
            __true__ (Domestic Transaction)
            __false__ (Cross-border Transaction)
            Transaction is Domestic or Cross-border. 
            boolean represents two values: true and false. Note: that truthy and falsy values such as "true", "", 0 or null are not considered boolean values
          example: true
        transactionCode:
          type: string
          description: |
            Type of operation, Allowed values: 02: Person to Person (PP). 08:
            Account to Account (AA).
          example: '02'
          pattern: 02|08
          enum:
            - '02'
            - '08'
          maxLength: 2
          minLength: 2

        transactionReference:
          type: string
          description: |
            A value used to related to a financial transaction (**this field should be unique**)
          example: "9a081ed0-3f3d-11eb-b37"
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9-]+$
        sender:
          $ref: "#/components/schemas/Sender"

        recipient:
          $ref: "#/components/schemas/Recipient"

        transactionAmount:
          $ref: "#/components/schemas/TransactionAmount"

    ReverseTransactionsRequest:
      type: object
      additionalProperties: false
      description: |
        Represents the data to Request Adjustment Reverse
      required:
        - adjustmentTransactionCode
        - amount
        - currencyCode
        - transactionCode
      properties:
        adjustmentTransactionCode:
          type: string
          description: |
            Type of transaction to be adjusted. 11 Debit Adjustment, 12 Credit Adjustment
          example: "12"
          pattern: 11|12
          enum:
            - "11"
            - "12"
          maxLength: 2
          minLength: 2

        amount:
          type: number
          format: decimal
          description: |
            Total transaction amount, including all transactions fee
          example: 10000
          minimum: 1
          maximum: 999999999
          exclusiveMinimum: false
          exclusiveMaximum: false

        currencyCode:
          type: string
          description: |
            Use a 3-character alpha currency code.
            __Refer to:__ [ISO Currency Codes](https://developer.novopayment.com/api/request-and-response-codes#item-isocurrencycodes)
          example: "USA"
          pattern: "[A-Z]{3}"
          maxLength: 3
          minLength: 3
        surcharge:
          type: number
          format: decimal
          description: |
            Operation fee or surcharge. This field must be in the same currency and format of the amount.
          example: 200
          minimum: 0
          maximum: 999999999
          exclusiveMinimum: false
          exclusiveMaximum: false

        transactionCode:
          type: string
          description: |
            Transaction code of the original transaction to be reversed, 02 Person to Person (PP),08 Account to Account (AA) ,17(FT) 
          example: "02"
          pattern: 02|08|17
          enum:
            - "02"
            - "08"
            - "17"
          maxLength: 2
          minLength: 2

    PullFundsRequest:
      type: object
      additionalProperties: false
      required: 
        - domesticTransaction
        - sender
        - transactionAmount
        - recipient
        - transactionCode
        - transactionReference
      properties:
        domesticTransaction:
          type: boolean
          description: |
            __Allowed values:__
            __true__ (Domestic Transaction)
            __false__ (Cross-border Transaction)
            Transaction is Domestic or Cross-border. 
            boolean represents two values: true and false. Note: that truthy and falsy values such as "true", "", 0 or null are not considered boolean values
          example: true
        transactionReference:
          type: string
          description: |
            A value used to related to a financial transaction (**this field should be unique**)
          example: 9a081ed0-3f3d-11eb-b378-0242ac130002
          maxLength: 40
          minLength: 1
          pattern: ^[A-Za-z0-9-]+$
        systemsTraceAuditNumber:
          type: string
          description: |
            A unique value should be used for each API method. However, when passing the (AFTR) method, this value must match the systemsTraceAuditNumber previously passed with the AFT method for the current transaction (**this field should be unique**)
          example: "554527"
          maxLength: 6
          minLength: 6
          pattern: \d+
        retrievalReferenceNumber:
          type: string
          description: |
            value used to tie together service calls related to a single financial transaction. When passing Account Funding Transaction (AFT) and an Original Credit Transaction (OCT) methods, this value must differ between the two methods.
            Requirered Format: ydddhhnnnnnn 
            The first four digits must be a valid Julian date in the pattern yddd, where the next three digits are the day number of the year (001-366) and the first digit is the last digit of the current year, 0-9.
            The two-digit hour in a 24-hour clock (00–23) that is used for the transaction can be represented by hh. 
            nnnnnn can be any six-digit number, or it can be the systemsTraceAuditNumber. (**this field should be unique**)
          example: "307511561880"
          maxLength: 12
          minLength: 12
          pattern: \d+
        transactionCode:
          type: string
          description: |
            Type of operation, Allowed values: 02: Person to Person (PP). 08: Account to Account (AA). 17(FT)
          example: "02"
          minLength: 2
          maxLength: 2
          pattern: 02|08|17

        sender:
          $ref: "#/components/schemas/Sender"

        recipient:
          $ref: "#/components/schemas/Recipient"

        transactionAmount:
          $ref: "#/components/schemas/TransactionAmount"

    PushTransferRequest:
      type: object
      additionalProperties: false
      required:
        - transactionCode
        - domesticTransaction
        - sender
        - recipient
        - transactionAmount
        - transactionReference
      properties:
        domesticTransaction:
          description: >
            Indicates whether the transaction is domestic or crossborder.
          type: boolean
          example: true
        transactionCode:
          description: >
            Type of operation, Allowed values: 02: Person to Person (PP). 08: Account to Account (AA). 17(FT)
          type: string
          pattern: 02|08|17
          minLength: 2
          maxLength: 2
        systemsTraceAuditNumber:
          type: string
          description: |
            A unique value should be used for each API method. However, when passing the (AFTR) method, this value must match the systemsTraceAuditNumber previously passed with the AFT method for the current transaction (**this field should be unique**)
          example: "554527"
          maxLength: 6
          minLength: 6
          pattern: \d+
        retrievalReferenceNumber:
          type: string
          description: |
            value used to tie together service calls related to a single financial transaction. When passing Account Funding Transaction (AFT) and an Original Credit Transaction (OCT) methods, this value must differ between the two methods.
            Requirered Format: ydddhhnnnnnn 
            The first four digits must be a valid Julian date in the pattern yddd, where the next three digits are the day number of the year (001-366) and the first digit is the last digit of the current year, 0-9.
            The two-digit hour in a 24-hour clock (00–23) that is used for the transaction can be represented by hh. 
            nnnnnn can be any six-digit number, or it can be the systemsTraceAuditNumber. (**this field should be unique**)
          example: "307511561880"
          maxLength: 12
          minLength: 12
          pattern: \d+
        transactionIdentifier:
          type: integer
          description: >
            The VisaNet transaction identifier. If you have previously sent an AFT, this field must include the VisaNet transaction identifier returned in the AFT response.
          example: 38122864943001
          minimum: 1
          maximum: 99999999999999
          format: int64
        transactionReference:
          type: string
          description: >
             A value used to related to a financial transaction (**this field should be unique**)
          example: 97f1467d40154354a8f6d5ec83005626
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9-]+$

        recipient:
          $ref: "#/components/schemas/Recipient"
        sender:
          description: Object Sender Information
          type: object
          additionalProperties: false
          required:
            - aliasDirectory
          properties:
            aliasDirectory:
              type: boolean
              description: |
                __Allowed values:__
                __true__ (with Alias Directory)
                __false__ (without Alias Directory)
                Flag for Alias. boolean represents two values: true and false. Note: that truthy and falsy values such as "true", "", 0 or null are not considered boolean values.
              example: false
            aliasId:
              type: string
              description: |
                Unique identifier of an Alias in NovoPayment.  Is required if the flag aliasDirectory is true.
              example: 5d1bf399902e42f79681c5be8dfdcb02
              maxLength: 32
              minLength: 32
              pattern: ^[A-Za-z0-9-]{32}$
            paymentInstrumentId:
              type: string
              description: |
                The paymentInstrument ID
              example: "3245436ddddddddddfffffffffff1623"
              maxLength: 32
              minLength: 32
              pattern: ^[A-Za-z0-9-]{32}$
            paymentInformation:
              description: Payment Info
              type: object
              additionalProperties: false
              properties:
                cardToken:
                  type: string
                  description: "Card data encrypted with the AES256 algorithm. The cardToken attribute is composed of the following values: PAN: Card’s primary account number or token Expiration Date: Card expiration date SALT: Random Value StringWith the cardToken 48101473592090212201245 the digits in the position 1-16 are the PAN, the next 4 expiration date, and the last 3 the random value."
                  example: fRuh9leWqJgc8shMb56hZy3QnBUjH4fCw48FHySR9QE=
                  maxLength: 44
                  minLength: 44
                  pattern: \s*|[\w\d=/+]{44}
                cardHolder:
                  $ref: "#/components/schemas/CardHolder"
        transactionAmount:
          $ref: "#/components/schemas/TransactionAmount"

    TransactionSummaryRequest:
      type: object
      additionalProperties: false
      required:
        - amount
        - sourceCurrency
        - destinationCurrency
        - transaction
        - surchargeInfo
      properties:
        amount:
          description: >
            The amount of the transaction
          type: number
          format: double
          example: 1000
          minimum: 1
          maximum: 9999999
        sourceCurrency:
          description: >
            Source currency code. Use a 3-character alpha or numeric currency code for currency of the sender.
          type: string
          example: "INR"
          maxLength: 3
          minLength: 3
        destinationCurrency:
          description: >
            Destination currency code. Use a 3-character alpha or numeric currency code for currency of the recipient.
          type: string
          example: "INR"
          maxLength: 3
          minLength: 3
        transaction: 
          type: object
          additionalProperties: false
          required:
            - operationType
            - brandType
            - transactionCode
          properties:
            operationType: 
              type: string
              description: type of operation (AFT, OCT, MONEY)
              example: "OCT"
              enum:
                - AFT
                - OCT
                - MONEY
            brandType:
              type: string
              description: Card brand type.
              example: "VISA"
              enum:
                - VISA
                - MASTERCARD
                - AMEX
            transactionCode:
              type: string
              description: "Type of operation, Allowed values: 02: Person to Person (PP). 08: Account to Account (AA). 17(AFT)"
              example: "08"
              enum:
                - "02"
                - "08"
                - "17"
            applyTo:
              description: Indicates whether the conversion rate is to the destination or source currency.
              type: string
              example: "SOURCE"
        surchargeInfo:
          type: object
          additionalProperties: false
          required:
            - countrySender
            - countryRecipient
          properties:
            countrySender: 
              description: country sender in alpha code
              type: string
              example: "IND"
              maxLength: 3
              minLength: 3
            countryRecipient:
              description: country recipient in alpha code
              type: string
              example: "IND"
              maxLength: 3
              minLength: 3
            surcharge: 
              description: Is required when transaction.operationType is equal to OCT
              type: number
              format: double
              example: 5
              maximum: 9999999


    # Object comunes
    TransactionDetail:
      type: object
      additionalProperties: false
      required:
        - actionCode
        - approvalCode
        - responseCode
        - retrievalReferenceNumber
        - systemsTraceAuditNumber
        - transactionIdentifier
        - transmissionDateTime
      properties:
        actionCode:
          type: string
          description: The results of the transaction request
          example: "00"
          minLength: 2
          maxLength: 2
          pattern: "^\\d{2}$"
        approvalCode:
          type: string
          description: The authorization code from the issuer.
          example: "21324K"
          maxLength: 6
          minLength: 1
          pattern: "^.{1,6}$"
        responseCode:
          type: string
          description: The source for the response; typically, either the recipient issuer or a Visa system.
          example: "05"
          maxLength: 5
          minLength: 1
          pattern: "^\\d{1,5}$"
        retrievalReferenceNumber:
          type: string
          description: The retrieval Reference Number for the transaction
          maxLength: 12
          minLength: 12
          example: "307511561880"
          pattern: "^\\d{12}$"
        systemsTraceAuditNumber:
          type: string
          description: The systems Trace Audit Number for the transaction
          example: "927165"
          minLength: 6
          maxLength: 6
          pattern: "^\\d{6}$"
        transactionIdentifier:
          type: integer
          description: The reference number for the transaction
          example: 410999684107987
          format: int64
          minimum: 1
        transmissionDateTime:
          type: string
          description: The transmission DateTime for the transaction
          example: "2022-09-23T20:52:14.000Z"
          minLength: 24
          maxLength: 24

    DocumentType:
      description: Identification types. Document Type Object, contains the document code.
      type: object
      additionalProperties: false
      required:
        - "code"
      properties:
        code:
            type: string
            description: >
              Type of identification

              __Refer to:__ [here](https://developer.novopayment.com/api/request-and-response-codes#item-documenttype)
            example: "GOVERNMENT_ID"
            maxLength: 25
            minLength: 1
            pattern: "^\\S{1,25}$"
    Address:
      description: Address for card-holder
      type: object
      additionalProperties: false
      required:
        - "line1"
        - "city"
        - "country"
      properties:
        line1:
          type: string
          description: |
            First line of the address. Usually for the complete address.
          example: cll 12 45
          maxLength: 20
          minLength: 1
          pattern: "^(?!\\s*$).+"
        line2:
          type: string
          description: |
            Second line, usually corresponds to house, apartment.
          example: white house
          maxLength: 80
          minLength: 0
          pattern: "^(?!\\s*$).+"
        city:
          type: string
          description: |
            Name of the city
          example: miami
          maxLength: 20
          minLength: 1
          pattern: "^(?!\\s*$).+"
        country:
          type: string
          description: |
            Country code.
            __Refer to:__ [ISO Country Codes](https://developer.novopayment.com/api/request-and-response-codes#item-isocountrycodes)
          example: USA
          maxLength: 3
          minLength: 3
          pattern: ([A-Z]{3}|[0-9]{3})
        postalCode:
          type: string
          description: |
            Postal Code. 
            Note: Conditional, required if the originator is of "US" address. or "CA" and for all cross-border transactions when the issuer is in Canada or Australia.
          example: "12345"
          maxLength: 9
          minLength: 5
          pattern: ^\d{5,9}$
        state:
          type: string
          description: |
            State code in the country. This field must be valid for the respective country. The country will be related to the country of the issuer bank. This field is required when the country is the US or Canada.
          example: "TX"
          maxLength: 3
          minLength: 2
          pattern: "^(?!\\s*$).+"
    CardHolder:
      description: CardHolder Information
      type: object
      additionalProperties: false
      required:
        - documentNumber
        - documentType
        - firstName
        - lastName
        - address
      properties:
        documentNumber:
          type: string
          description: |
            The Document Number
          example: "3568945"
          maxLength: 32
          minLength: 1
          pattern: "^\\d{1,35}$"
        documentType:
          $ref: "#/components/schemas/DocumentType"

        email:
          type: string
          description: Personal email cardholder
          example: personal@gmail.com
          maxLength: 50
          minLength: 0
          pattern: ".+[@].+[\\.].+"
        firstName:
          type: string
          description: FirstName cardholder
          example: Juan
          pattern: ^[\w\dñÑäÄëËïÏöÖüÜáéíóúáéíóúÁÉÍÓÚÂÊÎÔÛâêîôûàèìòùÀÈÌÒÙ]+$
          maxLength: 35
          minLength: 1
        lastName:
          type: string
          description: LastName cardholder
          example: Santos
          pattern: ^[\w\dñÑäÄëËïÏöÖüÜáéíóúáéíóúÁÉÍÓÚÂÊÎÔÛâêîôûàèìòùÀÈÌÒÙ]+$
          maxLength: 35
          minLength: 1

        address:
          $ref: "#/components/schemas/Address"
    TransactionAmount:
      description: Object
      type: object
      additionalProperties: false
      required:
        - senderAmount
        - sourceCurrencyCode
      properties:
        senderAmount:
          type: number
          format: double
          example: 1000
          minimum: 1
          maximum: 9999999
          exclusiveMinimum: false
          exclusiveMaximum: true
          description: >
            The amount of the transaction, inclusive of all fees you assess for the transaction.
        sourceCurrencyCode:
          type: string
          description: >
            Use a 3-character alpha or numeric currency code for currency of
            the sender.
            __Refer to:__ [ISO Currency Codes](https://developer.novopayment.com/api/request-and-response-codes#item-isocurrencycodes)
          example: COP
          maxLength: 3
          minLength: 3
          pattern: ([A-Z]{3}|[0-9]{3})
        destinationCurrencyCode:
          type: string
          description: >
            Use a 3-character alpha or numeric currency code for crossborder,  with different currencies.
            __Refer to:__ [ISO Currency Codes](https://developer.novopayment.com/api/request-and-response-codes#item-isocurrencycodes)
          example: USD
          maxLength: 3
          minLength: 3
          pattern: ([A-Z]{3}|[0-9]{3})
        purpose:
          type: string
          description: >
            Description of the purpose of the transaction
          example: Payment
          maxLength: 100
          minLength: 0
          pattern: "^.{0,100}$"
        surcharge:
          type: number
          format: double
          example: 100
          minimum: 0
          maximum: 9999999
          exclusiveMinimum: false
          exclusiveMaximum: true
          description: >
            When present, this field contains the sender's surcharge as
            assessed by the originator. Values in this field must be in the
            same currency and format as defined in the amount field.

    Sender:
      description: Object Sender Information
      type: object
      additionalProperties: false
      required:
        - aliasDirectory
      properties:
        aliasDirectory:
          type: boolean
          description: |
            __Allowed values:__
            __true__ (with Alias Directory)
            __false__ (without Alias Directory)
            Flag for Alias. boolean represents two values: true and false. Note: that truthy and falsy values such as "true", "", 0 or null are not considered boolean values.
          example: false
        aliasId:
          type: string
          description: |
            Unique identifier of an Alias for the Sender, is required if the flag aliasDirectory is true.
          example: 5d1bf399902e42f79681c5be8dfdcb02
          maxLength: 32
          minLength: 32
          pattern: "^.{32,32}$"

        paymentInstrumentId:
          type: string
          description: |
            Payment Instrument Identification
          example: 9b72e7aaa9804118a40b464c43f19d23
          maxLength: 32
          minLength: 32
          pattern: "^[0-9a-fA-F]{32}$"
        paymentInformation:
          description: Payment Info
          type: object
          additionalProperties: false
          required:
          - cardToken
          - cvvNumber
          - cardHolder
          properties:
            cardToken:
              type: string
              description: >
                    Card data encrypted with the AES256 algorithm.

                    The cardToken attribute is composed of the following values:

                    PAN: Card’s primary account number or token

                    Expiration Date: Card expiration date

                    SALT: Random Value StringWith the cardToken 48101473592090212201245 the digits in the position 1-16 are the PAN, the next 4 expiration date, and the last 3 the random value.
      
              example: Hs3xlaAXURkx+K1yF5nk9w04rZnC3BS17wh/qe+m+lQ=
              maxLength: 44
              minLength: 44
              pattern: \s*|[\w\d=/+]{44}
            cvvNumber:
              type: string
              example: Hs3dddddfgx17wh/qe+m+lQ=
              description: "CVV Number Encrypted"
              minLength: 24
              maxLength: 24
              pattern: \s*|[\w\d=/+]{24}
            cardHolder:
              $ref: "#/components/schemas/CardHolder"

    Recipient:
      description: Recipient Info
      type: object
      additionalProperties: false
      required:
        - aliasDirectory
      properties:
        aliasDirectory:
          type: boolean
          description: |
            __Allowed values:__
            __true__ (with Alias Directory)
            __false__ (without Alias Directory)
            Flag for Alias. boolean represents two values: true and false. Note: that truthy and falsy values such as "true", "", 0 or null are not considered boolean values.
          example: false
        alias:
          type: string
          description: |
            The alias value for the Recipient, is required if the flag  aliasDirectory is true
          example: alias@gmail.com
          maxLength: 50
          minLength: 1
        aliasType:
          type: string
          description: |
            __Allowed values:__
            __MOBILE,__
            __EMAIL,__
            __IDENTIFICATION,__
            __IBAN,__
            __CUSTOM__
            This Alias Type field is required if the flag  aliasDirectory is true.
          example: EMAIL
          maxLength: 15
          minLength: 1
          pattern: (\s)*|MOBILE|EMAIL|IDENTIFICATION|IBAN|CUSTOM

        paymentInformation:
          description: Payment Info
          type: object
          additionalProperties: false
          required:
            - cardHolder
            - cardToken
          properties:
            cardToken:
              type: string
              description: "Card data encrypted with the AES256 algorithm. The cardToken attribute is composed of the following values: PAN: Card’s primary account number or token Expiration Date: Card expiration date SALT: Random Value StringWith the cardToken 48101473592090212201245 the digits in the position 1-16 are the PAN, the next 4 expiration date, and the last 3 the random value."
              example: tRuh9leWqJgc8shMb56hZ/D5VnGx5orFpC3fgvI13Nk=
              maxLength: 44
              minLength: 44
              pattern: \s*|[\w\d=/+]{44}
            cardHolder:
              $ref: "#/components/schemas/CardHolder"

    # Responses
    MoneyTransferResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - datetime

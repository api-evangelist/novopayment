          type: string
          minLength: 1
          maxLength: 17
          example: "BRAND_TYPE"
          pattern: "BRAND_TYPE|ALIAS_TYPE|DIRECTORY_COUNTRY"
          
        value:
          description: "Filter values(Max 10)"
          minItems: 0
          maxItems: 10
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 20
            example:  "VISA"

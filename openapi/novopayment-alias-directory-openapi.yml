  parameters:
    aliasId:
      name: aliasId
      in: path
      description: |
        Unique identifier of an Alias in NovoPayment.
        This field is required if the alias is not sent.  This data is for personal use, it is required for administration and management of your alias.
      required: true
      example: "0300a633fcbf48a38d225afbd9fd43fa"
      schema:
        type: string
        maxLength: 32
        minLength: 32
        pattern: "^[0-9a-fA-F]{32}$"
    
    accountId:
      name: accountId
      in: path
      description: |
        Unique identifier for an account in NovoPayment.
      required: true
      schema:
        type: string
        maxLength: 32
        minLength: 32
        pattern: "^[0-9a-fA-F]{32}$"
      example: "8d24929d0981421395fc02b9591474c4"    
    paymentInstrumentId:
      name: paymentInstrumentId
      in: path
      description: |
        Payment instrument identificator.
      required: true
      schema:
        type: string
        maxLength: 32
        minLength: 32
        pattern: "^[0-9a-fA-F]{32}$"
      example: "8d24929d0981421395fc02b9591474c4"
  schemas:

    Accounts:
              type: array
              maxItems: 10
              xml:
                name: accounts
                wrapped: true
              items:
                $ref: '#/components/schemas/Account'
                
    AccountsInput:
      type: array
      maxItems: 2
      xml:
        name: accounts
        wrapped: true
      items:
        $ref: '#/components/schemas/Account'   
    
    Account:
      type: object
      description: Detailed account information, conditional if cards no present
      required:
        - accountType
        - accountNumberEncrypt
        - countryCode
        - currencyCode
        - accountIdentify
      additionalProperties: false
      properties:
        accountId:
          type: string
          description: >
           account identificator.
          example: 1297ceb1-cd42-4586-940d-6471d733d53e
          maxLength: 50
          pattern: ^(?!\s)(?!.*\s$).{1,50}$
        accountInternalId:
            type: string
            description: >
             account Internal UUID. (**this field should be unique**)
            example: 0458a69b-e70d-49b3-86d2-81d6b7569979
            maxLength: 36
            pattern: ^(?!\s)(?!.-*\s$).{1,50}$
        accountName:
          type: string
          description: >
           account Name.
          example: "AccountPrincipal"
          maxLength: 50
          pattern: ^(?!\s)(?!.*\s$).{1,50}$
        accountType:
          $ref: "#/components/schemas/AccountType"
        accountNumber:
          type: string
          description: >
           masked account number.
          example: "********1432"
          maxLength: 34
        accountNumberEncrypt:
          type: string
          description: >
           account number encrypted with aes256.
          example: "bXgZyYJ5OmRjEuJq9BWSxwpxwBappGeW6N+PHky5UhM="
          maxLength: 100
        accountIdentify:
          type: string
          description: >
            allow values DEFAULT, IBAN
          example: "IBAN"
          maxLength: 10
          pattern: (\s)*|DEFAULT|IBAN
        countryCode:
          type: string
          description: >
            Country code in ISO 3166 alpha-3 code or Country Code (numeric).
          example: USA
          minLength: 3
          maxLength: 3
          pattern: ^(?!\s)(?!.*\s$).{3,3}$
        currencyCode:
          type: string
          description: >
            Currency code  alpha-3 code or Numeric Code (numeric).
          example: USD
          minLength: 3
          maxLength: 3
          pattern: ^(?!\s)(?!.*\s$).{3,3}$
        bankCode:
          type: string
          example: "01" 
          maxLength: 70
          minLength: 1
          description: "bank's code"
        bankName:
          type: string
          example: "banco de bogota" 
          maxLength: 70
          minLength: 1
          description: "bank's name"
        

    CreateAliasInfoRequest:
      type: object
      required:
        - alias
        - aliasType
        - directoryCountry
        - cardHolder
      additionalProperties: false
      properties:
        alias:
          type: string
          description: >
            Attribute that identifies the alias associated to the cardholder.
            If it is a number, it must be in an international format with the
            1-3 digit country calling code.
          example: CUSTOM00051
          maxLength: 50
          pattern: ^(?!\s)(?!.*\s$).{1,50}$
        aliasType:
          type: string
          description: |
            __Allowed values:__
            __MOBILE,__
            __EMAIL,__
            __IDENTIFICATION,__
            __IBAN,__
            __CUSTOM__
          example: CUSTOM
          pattern: (\s)*|MOBILE|EMAIL|IDENTIFICATION|IBAN|CUSTOM
          maxLength: 14
          minLength: 4
        directoryCountry:
          type: string
          description: |
            Consumer country in ISO 3166 alpha-3 code
          example: USA
          maxLength: 3
          minLength: 3
          pattern: "^[A-Z]{3}$"
        cardHolder:
          $ref: "#/components/schemas/CardHolder"
        paymentInstrument:
          $ref: "#/components/schemas/PaymentInstrument"
        accounts:
          $ref: "#/components/schemas/AccountsInput"
   

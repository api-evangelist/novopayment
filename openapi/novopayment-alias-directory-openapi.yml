              example: TOKENIZATION
              minLength: 1
              maxLength: 20
              pattern: TOKENIZATION|MICRODEBIT

    
            metadata : 
              description: "Additional information for validation, it is required when the validation method is tokenization type"
              type: array
              maxItems: 10
              items:
                type: object
                required: 
                  - field
                  - value
                additionalProperties: false
                properties:
                  field:
                    description: "Field validation method"
                    type: string
                    minLength: 1
                    maxLength: 20
                    example: TOKEN
                    pattern: "([\\w\\dñÑäÄëËïÏöÖüÜáéíóúáéíóúÁÉÍÓÚÂÊÎÔÛâêîôûàèìòùÀÈÌÒÙ]+[\\s]{0,1})+"
                  value:
                    description: "Value validation method"
                    minLength: 1
                    maxLength: 20
                    type: string
                    example: TK**4565341354125   
                    pattern: "([\\w\\dñÑäÄëËïÏöÖüÜáéíóúáéíóúÁÉÍÓÚÂÊÎÔÛâêîôûàèìòùÀÈÌÒÙ]+[\\s]{0,1})+"

            minLength: 1
            maxLength: 50
            pattern: ^(?!\s)(?!.*\s$).{1,50}$
          example:
            - "juan@gmail.com"
            - "3102582546"
            - "9146856"
            - "CUSTOM"
          oneOf:
          - minItems: 1
            maxItems: 100
        filter:
          $ref: '#/components/schemas/Filter'

    Filter:
          description: "Filter for search(Max 10)"
          minItems: 0
          maxItems: 10
          type: array

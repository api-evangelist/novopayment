    UpdateStatusPaymentInstrumentCoreRequest:
      type: object
      required:
        - alias
        - aliasType
        - paymentInstrumentId
        - paymentInstrumentStatus
        - detail
      additionalProperties: false
      properties:
        alias:
          type: string
          description: >
            Attribute that identifies the alias associated to the cardholder

            If it is a number, it must be in an international format with the 1-3 digit country calling code.

            Required If the alias id is not sent.
          example: "519-990808"
          maxLength: 50
          minLength: 1
          pattern: ^(?!\s)(?!.*\s$).{1,50}$
        aliasType:
          type: string
          description: |
            __Allowed values:__
            __MOBILE,__
            __EMAIL,__
            __IDENTIFICATION,__
            __IBAN,__
            __CUSTOM__
             This field is required if the aliasId is not sent.
          example: MOBILE
          pattern: (\s)*|MOBILE|EMAIL|IDENTIFICATION|IBAN|CUSTOM
          maxLength: 14
          minLength: 4
        

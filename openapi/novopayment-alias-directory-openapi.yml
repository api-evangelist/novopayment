              pattern: ^(?!\s)(?!.*\s$).{1,50}$
            aliasType:
              type: string
              description: |
                __Allowed values:__
                __MOBILE,__
                __EMAIL,__
                __IDENTIFICATION,__
                __IBAN,__
                __CUSTOM__
              example: "EMAIL"
              maxLength: 14
              minLength: 4
              pattern: MOBILE|EMAIL|IDENTIFICATION|IBAN|CUSTOM

            aliasFavorites:
              type: array
              minItems: 0
              maxItems: 15
              items:
                $ref: "#/components/schemas/AliasFavorite"
             
    CreateAliasFavoriteRequest:
      type: object
      additionalProperties: false
      required:
        - aliasParent
        - aliasFavorite
      properties:
        aliasParent:
          type: object
          additionalProperties: false 
          required:
            - aliasId  
          description: Customized object Alias|
                        Contains information of AliasParent
          properties:
            aliasId:
              type: string   
              description: Unique identifier of an Alias in NovoPayment.  This data is for personal use, it is required for administration and management of your alias.
              example: 5d1bf399902e42f79681c5be8dfdcb02
              maxLength: 32
              minLength: 32
              pattern: "^[0-9a-fA-F]{32}$"
        aliasFavorite:
          type: object
          additionalProperties: false   
          required:
            - favoriteName  
          description: Customized object Alias|
                        Contains information of AliasFavorite
          properties:         
            alias:
              type: string 
              example: "002-00005"
              description: >
                Attribute that identifies the alias associated to the cardholder.
                If it is a number, it must be in an international format with the 1-3 digit country calling code.
              maxLength: 50
              minLength: 1
              pattern: ^(?!\s)(?!.*\s$).{1,50}$
            aliasType:
              type: string
              example: MOBILE
              description: |
                    __Allowed values:__
                    __MOBILE,__
                    __EMAIL,__
                    __IDENTIFICATION,__
                    __IBAN,__
                    __CUSTOM__
              pattern: MOBILE|EMAIL|IDENTIFICATION|IBAN|CUSTOM
              maxLength: 15
              minLength: 1
            favoriteName:
              type: string   
              description: Name of the alias added as a favorite
              maxLength: 32  
              minLength: 1 
              example: "MOTHER"
              pattern: "^\\w+$"                     
            cardToken:
              type: string   
              description: Card data encrypted with the AES256 algorithm.|
                          The cardToken attribute is composed of the following values
                          PAN Card’s primary account number or token 
                          Expiration Date Card expiration date
                          SALT Random Value String
                          With the cardToken 48101473592090212201245 the digits in the position 1-16 are the PAN, the next 4 expiration date, and the last 3 the random value.
                          For a favorite without aliases the expiration date must be 0000.
                          When the cardToken is saved in the database, it changes from saltNumber to the saltNumber configured for the tenant.
                          Conditional is required if the aliasId  is not send or Account is not present

              maxLength: 44  
              minLength: 44
              pattern: \s*|[\w\d=/+]{44}
            cardHolder:
              $ref: "#/components/schemas/CardHolder"
            account:  
              $ref: "#/components/schemas/Account"

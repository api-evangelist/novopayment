        termsAndConditionsAssetId:
          type: string
          description: The Terms and Conditions as presented to and accepted by the Account holder.
          minLength: 1
          maxLength: 64
          example: a9f027e5-629d-11e3-949a-0800200c9a66
        termsAndConditionsAcceptedTimestamp:
          type: string
          description: The date and time the Terms and Conditions were accepted by the Account holder. Expressed in ISO 8601 extended format as one of the following - YYYY-MM-DDThh:mm:ss[ .sss ]Z, YYYY-MM-DDThh:mm:ss[ .sss ]±hh:mm . Where [ .sss ] is optional and can be 1 to 3 digits.
          minLength: 20
          maxLength: 29
          example: 2015-07-04 12:09:56.123000-07:00
        productConfigurationId:
          type: string
          description: Freeform identifier for the product configuration as assigned by the Issuer.
          minLength: 1
          maxLength: 64
          example: '1234'
        consumerLanguage:
          type: string
          description: Language preference selected by the consumer. Formatted as an ISO-639-1 two-letter language code.
          minLength: 2
          maxLength: 2
          example: en
        encryptedPayload:
          type: string
          $ref: '#/components/schemas/ObjencryptedPayload_ServiceActivated'
          description: Payload Encrypted, contains information detailed about Card, Account Cardholder and Token Details
    ObjAccountHolderAddress:
      type: object
      properties:
        line1:
          type: string
          description: First line of the billing address.
          minLength: 1
          maxLength: 64
          example: 100 1st Street
        line2:
          type: string
          description: Second line of the billing address.
          minLength: 1
          maxLength: 64
          example: Apt. 4B
        city:
          type: string
          description: The city of the billing address.
          minLength: 1
          maxLength: 32
          example: St. Louis
        countrySubdivision:
          type: string
          description: The country subdivision (for example, the state in the U.S.) of the billing address.
          minLength: 1
          maxLength: 12
          example: MO
        postalCode:
          type: string
          description: The postal code (for example, zipcode in the U.S.) of the billing address.
          minLength: 1
          maxLength: 16
          example: '61000'
        country:
          type: string
          description: The country of the billing address. Expressed as a 3-letter (alpha-3) country code as defined in ISO 3166-1.
          minLength: 3
          maxLength: 3
          example: USA
      description: The address for the account holder. Verified as part of reaching the digitization decision. Max length - Not applicable.
    prm_tokenType:
      type: string
      description: The type of token requested for this digitization. Valid values are - SE Token is a Secure Element, this kind of token is for Wallets. - HCE Token is used for contactless payments with NFC Chip. - COF Card on File Token, normally is used for recurrent payments. - ECOM Token is used for online payments, or payments started by the end-user. - QRC Token is used for QR Payments, only applicable for VISA.
      enum:
      - SE
      - HCE
      - COF
      - ECOM
      - QRC
      minLength: 1
      maxLength: 16
      example: ECOM
    prm_numberOfActivationAttempts:
      type: integer
      description: Number of intents with the OTP.
      minLength: 1
      maxLength: 1
    prm_source:
      type: string
      description: 'Origin of the card information.


        Available values:

        - ON_FILE

        - ADDED_MANUALLY

        - ADDED_VIA_APPLICATION

        - ADDED_VIA_BROWSER

        - EXISTING_TOKEN_CREDENTIAL

        - ADDED_VIA_CHIP_DATA

        '
      enum:
      - ON_FILE
      - ADDED_MANUALLY
      - ADDED_VIA_APPLICATION
      - ADDED_VIA_BROWSER
      - EXISTING_TOKEN_CREDENTIAL
      - ADDED_VIA_CHIP_DATA
      maxLength: 32
      example: ON_FILE
    ObjFinancialAccountData:
      required:
      - countryCode
      - financialAccountId
      - interbankCardAssociationId
      type: object
      properties:
        financialAccountId:
          type: string
          description: The identifier of the financial account being tokenized.  This could be a bank account number or other types of financial accounts.
          minLength: 9
          maxLength: 64
          example: '5123456789012345'
        interbankCardAssociationId:
          type: string
          description: The id assigned by Mastercard to the financial institution.
          minLength: 3
          maxLength: 11
          example: '1234'
        countryCode:
          type: string
          description: The country of the financial account. Expressed as a 3-letter (alpha-3) country code as defined in ISO 3166-1.
          minLength: 3
          maxLength: 3
          example: GBR
      description: The financial account information for the account that is being tokenized. – Required if there is a bank account or other type of financial account being tokenized. Only applicable for MasterCard.
    prm_cardId:
      type: string
      description: 'Unique Card Identifier at NovoPayment’s Issuance Service, of Original Card.

        '
      maxLength: 40
      example: 5DA...27
    prm_TokenExpiryYear:
      type: string
      description: The year of the expiration date. (Numeric)
      minLength: 2
      maxLength: 2
      example: '15'
    ObjBodyServiceActivated:
      type: object
      required:
      - services
      - correlationId
      - decision
      - tokenInformation
      - decisionMadeBy
      - tokenActivatedDateTime
      properties:
        services:
          type: array
          $ref: '#/components/schemas/prm_services'
        correlationId:
          type: string
          description: "Identification of the Tokenization Process. This value linked \nboth processes.\n"
          example: D98765432104
          maxLength: 14
        decision:
          type: string
          $ref: '#/components/schemas/prm_decision'
        decisionMadeBy:
          type: string
          $ref: '#/components/schemas/prm_decisionMadeBy'
        tokenActivatedDateTime:
          $ref: '#/components/schemas/prm_tokenActivatedDateTime'
        numberOfActivationAttempts:
          $ref: '#/components/schemas/prm_decisionMadeBy'
        numberOfActiveTokens:
          $ref: '#/components/schemas/prm_numberOfActivationAttempts'
        tokenAssuranceLevel:
          $ref: '#/components/schemas/prm_tokenAssuranceLevel'
        tokenInformation:
          type: object
          $ref: '#/components/schemas/ObjTokenInformation_ActSer'
    ObjBodyNotSuspiciousEv:
      required:
      - tokenUniqueReference
      - events
      type: object
      properties:
        tokenUniqueReference:
          type: string
          $ref: '#/components/schemas/prm_tokenUniqueReference'
        tokenRequestorId:
          type: string
          $ref: '#/components/schemas/prm_tokenRequestorID'
        tokenRequestorName:
          type: string
          $ref: '#/components/schemas/prm_tokenRequestorName'
        cardId:
          type: string
          $ref: '#/components/schemas/prm_cardId'
        status:
          type: string
          description: "The current status of token.  Available Values: INACTIVE - Token has not yet been activated ACTIVE - Token is active and ready to transact SUSPENDED - Token is suspended and unable to transact DEACTIVATED - Token has been permanently deactivated.  Present only if reasonCode = \"STATUS_UPDATE\". \n"
          minLength: 1
          maxLength: 32
          example: ACTIVE
        paymentAppInstanceId:
          type: string
          description: The identifier of the Payment App instance within a device that will be provisioned with a token. Only present when supplied by a Wallet Provider.
          minLength: 1
          maxLength: 48
          example: 1b24f24a24ba98e27d43e345b532a245e4723d7a9c4f624e
        events:
          $ref: '#/components/schemas/SuspiciousEvent'
    prm_tokenRequestorID:
      type: integer
      description: 'Unique ID assigned to the entity that is requesting the token.

        '
      example: 40022358888
    prm_sequenceNumber:
      type: string
      description: Sequence number of the Token. Conditional – required in AuthorizeServiceResponseData. Optional otherwise.
      minLength: 2
      maxLength: 2
      example: '01'
    RS200:
      type: object
      properties:
        code:
          type: string
          description: Operation response code
          example: 200.22.000
          maxLength: 10
        message:
          type: string
          description: Response code description
          example: Process Ok
          maxLength: 140
        datetime:
          type: string
          description: 'Operation Time Stamp in ISO 8601 format date-time - the date-time notation as defined by

            [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6), for example, 2017-07-21T17:32:28Z

            '
          example: '2022-04-25T23:19:12.000Z'
          minLength: 24
          maxLength: 24
    RQSendVerifyCode:
      type: object
      required:
      - correlationId
      - requestId
      - activationCode
      - codeExpiration
      - activationMethod
      properties:
        correlationId:
          type: string
          description: "Identification of the Tokenization Process. This value linked \nboth processes.\n"
          example: D98765432104
          maxLength: 14
        requestId:
          type: string
          $ref: '#/components/schemas/prm_requestId'
        tokenRequestorID:
          type: integer
          description: 'Unique ID assigned to the entity that is requesting the token.

            '
          example: 40022358888
        tokenRequestorName:
          type: string
          description: 'Name of the token requestor.

            '
          example: My Merchant
        tokenUniqueReference:
          type: string
          description: "Unique ID associating a token with a card. This ID can be used in \nfuture calls to make operations related to the token in the I-TSP, \nfor example events related to the management of the life cycle.\n"
          example: DWSPMC000000000132d72d4fcb2f4136a0532d3093ff1a45
          maxLength: 64
        panUniqueID:
          type: string
          description: "Unique ID representing a card. This ID can be used instead of the \nPAN number for tokenization calls.\n"
          example: V-3019231458906209630635
        cardId:
          type: string
          description: "Unique Identification for the card in NovoPayment Issuance Services.\nThis value only exists for Issuers that are clients of NovoPayment \nIssuance Services.\n"
          maxLength: 40
        clientWalletAccountID:
          type: string
          description: "Identifier of the wallet that sends the request. Client provided \nconsumer ID that identifies the wallet account holder entity. \nOnly available for VISA.\n"
          maxLength: 32
        otpMaxReached:
          type: boolean
          description: "If this field is active, it means the user with the referenced token \nhas exceeded the number of requests for authentication methods or OTP \nrequests, thus, the response must not include the value when requesting \nthem again. Only available for VISA.\n"
        activationCode:
          type: string
          description: 'The value that the cardholder needs to validate his/her identity.

            '
          example: A1B2C3D4
          maxLength: 8
        reasonCodes:
          type: array
          description: "Array of OTP reason codes.\nAllowed values: \n- ADD_CARD: The account holder is being authenticated after adding \nthe card to the token requestor.\n- VERIFY_ACCOUNT: The account holder is being authenticated to verify \naccount ownership.\n- OTHER: The account holder is being authenticated for a reason not \nenumerated in this list. Conditional - Only present for Consent Service\n"
          example:
          - ADD_CARD
        codeExpiration:
          type: string
          description: 'Token expiration date. Format: yyyy-MM-ddTHH:mm:ss.SSSZ

            '
          example: 2026-07-04 19:08:56.123000+00:00
        activationMethod:
          $ref: '#/components/schemas/ObjActivationMethod'
    ObjTokenData:
      required:
      - expiryMonth
      - expiryYear
      - token
      type: object
      properties:
        token:
          type: string
          description: The token issued for this service request.
          minLength: 12
          maxLength: 19
          example: '5345678901234521'
        expiryMonth:
          type: string
          $ref: '#/components/schemas/prm_TokenExpiryMonth'
        expiryYear:
          type: string
          $ref: '#/components/schemas/prm_TokenExpiryYear'
        sequenceNumber:
          type: string
          $ref: '#/components/schemas/prm_sequenceNumber'
          description: Only present if reason code is Redigitization, not present otherwise.
      description: Detailed information of the token.
    prm_CardExpiryMonth:
      type: string
      description: The month of the expiration date of the card to be digitized. Note that the expiry date may not be in the past. May be omitted if the card does not have an expiry date. (Numeric).
      minLength: 2
      maxLength: 2
      example: '12'
    RQNotTokenUpdated:
      type: object
      required:
      - requestId
      - reasonCode
      - dateTime
      - notificationBody
      properties:
        requestId:
          type: string
          $ref: '#/components/schemas/prm_requestId'
        reasonCode:
          type: string
          description: "The reason that cause the notification.\nAvailable values:\nREDIGITIZATION_COMPLETE : The token has been re-digitized to the device in the token expiry and FPAN update to a new range use cases.\nDELETED_FROM_CONSUMER_APP : The token has been deleted from the consumer application. The token may still be active in MDES\nSTATUS_UPDATE : The status of the tokens has been changed when the token is activated, suspended, deleted, or inactivated.\nAUTHENTICATION_PERFORMED - Account holder authentication was performed on the token. \nPAYMT_CHANNEL_PREFERENCE_UPDATED - Cardholder has updated the payment channels the token is allowed to be used for (India only).\nFUNDING_ACCOUNT_UPDATE - Token and FPAN mapping has been updated due to FPAN or expiry or Financial account has been changed but Token is not changed. The status did not change as a result.\n"
          enum:
          - REDIGITIZATION_COMPLETE
          - DELETED_FROM_CONSUMER_APP
          - STATUS_UPDATE
          - AUTHENTICATION_PERFORMED
          - PAYMT_CHANNEL_PREFERENCE_UPDATED
          - FUNDING_ACCOUNT_UPDATE
          example: STATUS_UPDATE
        dateTime:
          type: string
          description: 'dateTime. Format: yyyy-MM-ddTHH:mm:ss.SSSZ

            '
          example: 2026-07-04 19:08:56.123000+00:00
        notificationBody:
          $ref: '#/components/schemas/ObjBodyTokenUpdated'
    prm_CardSecurityCode:
      type: string
      description: The CVC2 for the card to be digitized, as entered by the Cardholder. Verified as part of reaching the digitization decision.
      minLength: 3
      maxLength: 3
      example: '123'
    SuspiciousEvent:
      required:
      - eventName
      type: object
      properties:
        eventName:
          type: string
          description: The name of the suspicious event. Must be one of; REPLENISH - There were suspicious ATC values reporting during Replenish
          minLength: 1
          maxLength: 32
          example: REPLENISH
        walletAtcStatus:
          $ref: '#/components/schemas/WalletAtcStatus'
          description: The ATCs statuses are reported by the wallet. Required if EventName is REPLENISH.
        systemAtcStatus:
          $ref: '#/components/schemas/SystemAtcStatus'
          description: The ATCs statuses as reported by authorization network. Required if EventName is REPLENISH
    prm_TokenExpiryMonth:
      type: string
      description: The month of the expiration date.(Numeric)
      minLength: 2
      maxLength: 2
      example: '12'
    RSInternalServerError:
      type: object
      properties:
        code:
          type: string
          example: 500.22.999
          description: Operation response code
          minLength: 10
          maxLength: 10
        message:
          type: string
          example: Internal Server Error
          description: Response code description
          maxLength: 140
        datetime:
          type: string
          example: '2022-04-25T23:19:12.000Z'
          minLength: 24
          maxLength: 24
    RQNotSuspiciousEvents:
      type: object
      required:
      - requestId
      - reasonCode
      - dateTime
      - notificationBody
      properties:
        requestId:
          type: string
          $ref: '#/components/schemas/prm_requestId'
        reasonCode:
          type: string
          description: 'SUSPICIOUS_EVENTS

            '
          enum:
          - SUSPICIOUS_EVENTS
          example: SUSPICIOUS_EVENTS
        dateTime:
          type: string
          description: 'dateTime. Format: yyyy-MM-ddTHH:mm:ss.SSSZ

            '
          example: 2026-07-04 19:08:56.123000+00:00
        notificationBody:
          $ref: '#/components/schemas/ObjBodyNotSuspiciousEv'
    WalletAtcStatus:
      type: object
      properties:
        unusedDiscarded:
          type: array
          description: The ATCs reported by the wallet that are unused discarded. Max length - Not applicable. Type - Array[String].
          items:
            type: string
            example: '1234'
        usedForContactless:
          type: array
          description: The ATCs reported by the wallet that are used for contactless transaction. Max length - Not applicable. Type - Array[String].
          items:
            type: string
            example: '1234'
        usedForDsrp:
          type: array
          description: The ATCs reported by the wallet that are used for DSRP transaction. Max length - Not applicable. Type - Array[String]
          items:
            type: string
            example: '1234'
        unusedActive:
          type: array
          description: The ATCs reported by the wallet that are unused active. Max length - Not applicable. Type - Array[String]
          items:
            type: string
            example: '1234'
      description: The ATCs statuses are reported by the wallet. Conditional – required if EventName is REPLENISH
    RSFromIssuer_BadRequest:
      type: object
      required:
      - code
      - data
      - message
      - datetime
      properties:
        code:
          type: string
          description: "Presented when error codes in business logic.\nAvailable Values\n400.22.002\tJWE invalid format\n400.22.003\tParams Required\n400.22.009\tInvalid Card ID\n"
          enum:
          - 400.22.002
          - 400.22.003
          - 400.22.009
          maxLength: 10
          example: 400.22.009
        data:
          type: object
          description: Required when Error Code is Params Required, include the list.
          maxLength: 2
          example:
          - fieldName
        message:
          type: string
          description: Response code description
          example: Params required
          maxLength: 140
        datetime:
          type: string
          example: '2022-04-25T23:19:12.000Z'
          description: 'Operation Time Stamp in ISO 8601 format<br>date-time - the date-time notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6), for example, 2017-07-21T17:32:28Z

            '
          minLength: 24
          maxLength: 24
    prm_decisionMadeBy:
      type: string
      description: "Related to how the decision was taken, aply for MasterCard; \nfor VISA the content is goint to be UNDEFINED.\n"
      enum:
      - ELIGIBILITY_REQUEST
      - AUTHORIZATION_REQUEST
      - RULES
      - UNDEFINED
      example: RULES
      maxLength: 14
    SystemAtcStatus:
      type: object
      properties:
        atcNotFound:
          type: array
          description: The ATCs reported by the authorization network as not found. Max length - Not applicable. Type - Array[String].
          items:
            type: string
            example: '1234'
        atcAlreadyProcessed:
          type: array
          description: The ATCs reported by the authorization network as processed for a transaction. Max length - Not applicable. Type - Array[String].
          items:
            type: string
            example: '1234'
        atcReportedUsedByWallet:
          type: array
          description: The ATCs prviously reported by the wallet as processed or discarded. Max length - Not applicable. Type - Array[String]
          items:
            type: string
            example: '1234'
        unusedActive:
          type: array
          description: The ATCs reported by the wallet that are unused active. Max length - Not applicable. Type - Array[String]
          items:
            type: string
            example: '1234'
      description: The ATCs statuses as reported by authorization network. Conditional – required if EventName is REPLENISH
    prm_status:
      type: string
      description: "The current status of token.  Available Values: INACTIVE - Token has not yet been activated ACTIVE - Token is active and ready to transact SUSPENDED - Token is suspended and unable to transact DEACTIVATED - Token has been permanently deactivated.  Present only if reasonCode = \"STATUS_UPDATE\". \n"
      minLength: 1
      maxLength: 32
      example: ACTIVE
    ObjToken_StatusUpdate:
      type: object
      required:
      - tokenUniqueReference
      properties:
        tokenUniqueReference:
          type: string
          $ref: '#/components/schemas/prm_tokenUniqueReference'
        tokenRequestorId:
          type: string
          $ref: '#/components/schemas/prm_tokenRequestorID'
        tokenRequestorName:
          type: string
          $ref: '#/components/schemas/prm_tokenRequestorName'
        cardId:
          type: string
          $ref: '#/components/schemas/prm_cardId'
        status:
          type: string
          $ref: '#/components/schemas/prm_status'
        suspendedBy:
          type: array
          description: "The origin of the token suspension, Present only if status = SUSPENDED except for VISA. Available Values: ISSUER = Suspended by the Issuer.  PaymentAppProvider unable to unsuspend this token,  TOKEN_REQUESTOR = Suspended by the Token Requestor,   MOBILE_PIN_LOCKED =  Suspended  due to the Mobile PIN being locked,  CARDHOLDER = Suspended by the Cardholder. \n"
          enum:
          - ISSUER
          - PaymentAppProvider
          - TOKEN_REQUESTOR
          - MOBILE_PIN_LOCKED
          - CARDHOLDER
          items:
            type: string
            example: ISSUER
        tokenExpiry:
          type: string
          description: 'The expiry of the Token PAN given in MMYY format.  Present only if reasonCode is "REDIGITIZATION_COMPLETE".

            '
          minLength: 4
          maxLength: 4
          example: '0721'
        encryptedPayload:
          type: object
          $ref: '#/components/schemas/ObjencryptedPayload_StatusUpdate'
    ObjencryptedPayload_ServiceActivated:
      required:
      - cardAccountData
      type: object
      properties:
        source:
          type: string
          $ref: '#/components/schemas/prm_source'
        dataValidUntilTimestamp:
          type: string
          description: "The date/time after which this encrypted object is considered invalid. If present, all systems must reject this encrypted object after this time and treat it as invalid data. Must be expressed in ISO 8601 extended format as one of the following:\n  - YYYY-MM-DDThh:mm:ss[.sss]Z\n  - YYYY-MM-DDThh:mm:ss[.sss]±hh:mm\n\nWhere [.sss] is optional and can be 1 to 3 digits. Must be a value no more than 30 days in the future. Mastercard recommends using a value of (Current Time + 30 minutes).\n"
          minLength: 20
          maxLength: 29
          example: 2015-07-04 12:09:56.123000-07:00
        cardAccountData:
          $ref: '#/components/schemas/ObjcardAccountData'
        financialAccountData:
          $ref: '#/components/schemas/ObjFinancialAccountData'
        tokenData:
          $ref: '#/components/schemas/ObjTokenData'
          description: The token information.
        paymentAccountReference:
          type: string
          description: The unique account reference assigned to the PAN.
          minLength: 29
          maxLength: 29
          example: 512381d9f8e0629211e3949a08002
        accountHolderData:
          $ref: '#/components/schemas/ObjAccountHolderData'
    prm_tokenRequestorName:
      type: string
      description: 'Name of the token requestor.

        '
      example: My Merchant

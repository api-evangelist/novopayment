          maxLength: 128
          example: Novo_Phone
        deviceNumber:
          type: string
          description: Device number
          maxLength: 13
          example: 6506198963
        osType:
          type: string
          description: 'Operating System from which the request is sent.


            Allowed values

            - ANDROID

            - IOS

            - WINDOWS

            - BLACKBERRY

            - TIZEN

            - OTHER

            '
          maxLength: 32
          enum:
          - ANDROID
          - IOS
          - WINDOWS
          - BLACKBERRY
          - TIZEN

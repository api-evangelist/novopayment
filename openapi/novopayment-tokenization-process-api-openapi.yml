          minLength: 20
          maxLength: 29
          example: 2015-07-04 12:08:56.123000-07:00
        panUniqueReference:
          type: string
          $ref: '#/components/schemas/prm_panUniqueReference'
        tokenRequestorName:
          type: string
          $ref: '#/components/schemas/prm_tokenRequestorName'
        cardId:
          type: string
          $ref: '#/components/schemas/prm_cardId'
        walletId:

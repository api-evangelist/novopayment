            '
          example: The Bank Card
        profileID:
          type: string
          maxLength: 32
          description: 'Profile ID associated to a card.

            It is only available to issuers that consume the API Check eligibility.

            During the the preload of the card metadata into the Visa system,

            either through the Visa Card Art Management (VCMM) user interface or

            the batch files, issuers have the option to assign their own unique

            profile ID (GUID) to a send of card metadata.


            Format: Lowercase, hexadecimal. Hyphens (-) are not allowed.

            '
          example: The Bank Card
        cardArtData:
          type: array
          $ref: '#/components/schemas/ObjCheckEligibilityCardArtRefID'
        termsAndConditionsID:
          type: string
          maxLength: 64
          description: 'Name of the file based on GUID for terms and conditions text.

            File used by the issuer when uploading the image in VCMM.

            This is a required DWP field. However, it is Optional in this API

            because the issuer can configure it through VCM.

            '
          example: The Bank Card
        contactInfo:
          $ref: '#/components/schemas/ObjCheckEligibilityContactInfo'
        applicationInfo:
          $ref: '#/components/schemas/ObjCheckEligibilityApplicationInfo'
        privacyPolicyURL:
          type: string
          maxLength: 128
          description: "URL pointing to an issuing bank’s privacy policy. This \nvalue is nott applicable for Check Eligibility; only available for \nUpdate Card Metadata.\n"
          example: https://issuer.com/privacyPolicyURL
        termsAndConditionsURL:
          type: string
          maxLength: 128
          description: "URL pointing to the issuing bank’s terms and conditions \nfor a card. This value is not applicable for Check Eligibility; only \navailable for Update Card Metadata.\n"
          example: https://issuer.com/termsAndConditionsURL

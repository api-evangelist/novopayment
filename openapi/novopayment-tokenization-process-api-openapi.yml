openapi: 3.2.0
info:
  title: Novopayment Tokenization Process API
  version: '1.0'
  description: 'Operations tagged Tokenization Process across 2 of this provider''s published API definitions: novopayment-issuer-tokenization-openapi.yml, novopayment-mastercard-issuer-tokenization-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: UAT
  url: https://cert-api.novopayment.com
- description: Certification
  url: https://[URLIssuer]/v2
tags:
- name: Tokenization Process
paths:
  /v1/checkEligibility:
    post:
      servers:
      - description: 'External

          '
        url: https://[URLIssuer]
      tags:
      - Tokenization Process
      summary: Check Eligibility
      description: 'This endpoint is consumed in the card enrollment flow for VTS, and it

        is only valid when the metadata card information is only known by one

        entity or an external issuer.


        NovoPayment will consume this endpoint when it is required to very if a

        card is eligible for the card enrollment flow.'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      requestBody:
        $ref: '#/components/requestBodies/RQCheckEligibility'
      operationId: CheckEligibility
      responses:
        '200':
          $ref: '#/components/responses/RSCheckEligibility200'
        '400':
          $ref: '#/components/responses/RS400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: UAT
      url: https://cert-api.novopayment.com
  /v1/approveProvision:
    post:
      servers:
      - description: External
        url: https://[URLIssuer]
      tags:
      - Tokenization Process
      summary: Approve Provision
      description: 'This endpoint is consumed in the card enrollment flow for VTS, and it is

        only valid when the metadata card information is only known by one entity

        or an external issuer.


        NovoPayment will consume this endpoint when it is required to very if a

        card is eligible for the card enrollment flow with external Issuers.'
      requestBody:
        $ref: '#/components/requestBodies/RQApproveProvision'
      operationId: ApproveProvision
      responses:
        '200':
          $ref: '#/components/responses/RSApproveProvision200'
        '400':
          $ref: '#/components/responses/RSErrorCode400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: UAT
      url: https://cert-api.novopayment.com
  /v1/notification:
    post:
      servers:
      - description: External
        url: https://[URLIssuer]
      tags:
      - Tokenization Process
      summary: Notification
      description: 'NovoPayment to Issuer (external and internal).


        The I-TSP notification to the issuer is done through a REST request to

        the URL previously send by the issuer.


        Through this endpoint, the Issuer is going to receive a variety of

        different notifications regarding changes to the tokens, PAN, or Card

        Metadata lifecycle.


        Every notification could have different parameters.'
      requestBody:
        $ref: '#/components/requestBodies/RQNotification'
      operationId: Notification
      responses:
        '200':
          $ref: '#/components/responses/RS200'
        '400':
          $ref: '#/components/responses/RS400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: UAT
      url: https://cert-api.novopayment.com
  /v1/verification/methods:
    post:
      servers:
      - description: External
        url: https://[URLIssuer]
      tags:
      - Tokenization Process
      summary: Get Cardholder Verification Methods
      description: 'NovoPayment to Issuer (external and internal).


        This endpoint allows the issuer to notify the I-TSP the different

        cardholder authentication methods such as email, phone number, among

        others for the delivery of the One Time Password (OTP). The request

        from the I-TSP to the Issuer is sent through a REST request to a URL

        previously send by the issuer.'
      requestBody:
        $ref: '#/components/requestBodies/RQCardholderVerificationMethods'
      operationId: CardholderVerificationMethods
      responses:
        '200':
          $ref: '#/components/responses/RSCardholderVerificationMethods200'
        '400':
          $ref: '#/components/responses/RS400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: UAT
      url: https://cert-api.novopayment.com
  /v1/sendPasscode:
    post:
      servers:
      - description: External
        url: https://[URLIssuer]
      tags:
      - Tokenization Process
      summary: Send Passcode
      description: 'NovoPayment to Issuer (external and internal)


        This endpoint allows the issuer to send an OTP or a temporally

        verification code to the cardholder that have requested it through the

        wallet.'
      requestBody:
        $ref: '#/components/requestBodies/RQSendPasscode'
      operationId: SendPasscode
      responses:
        '200':
          $ref: '#/components/responses/RS200'
        '400':
          $ref: '#/components/responses/RS400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: UAT
      url: https://cert-api.novopayment.com
  /v1/deviceBinding:
    post:
      servers:
      - description: External
        url: https://[URLIssuer]
      tags:
      - Tokenization Process
      summary: Device Token Binding
      description: 'NovoPayment to External Issuer.


        The issuer approves the binding of an e-commerce or Card-On-File token to a device.'
      requestBody:
        $ref: '#/components/requestBodies/RQDeviceTokenBinding'
      operationId: DeviceTokenBinding
      responses:
        '200':
          $ref: '#/components/responses/RSDeviceTokenBinding200'
        '400':
          $ref: '#/components/responses/RS400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: UAT
      url: https://cert-api.novopayment.com
  /v1/cardinfo:
    post:
      servers:
      - description: External
        url: https://[URLIssuer]
      tags:
      - Tokenization Process
      summary: Card Info
      description: Get card and customer information for a list of card ids.
      requestBody:
        $ref: '#/components/requestBodies/RQCardInfo'
      operationId: CardInfo
      responses:
        '200':
          $ref: '#/components/responses/RSCardInfo200'
        '400':
          $ref: '#/components/responses/RSCardInfo400'
        '500':
          $ref: '#/components/responses/RSCardInfo500'
    servers:
    - description: UAT
      url: https://cert-api.novopayment.com
  /sendverifycode:
    post:
      servers:
      - description: External
        url: https://[URLIssuer]
      tags:
      - Tokenization Process
      summary: Send Verify Code
      description: 'Our endpoint empowers issuers to seamlessly receive and deliver a One-Time Password (OTP) to cardholders.

        This temporary verification code is essential for cardholders to confirm their identity when registering

        their card with merchants, ensuring a secure and smooth transaction experience.'
      operationId: SendVerifyCode
      requestBody:
        $ref: '#/components/requestBodies/RQSendVerifyCode'
      responses:
        '200':
          $ref: '#/components/responses/RSFromIssuer_200'
        '400':
          $ref: '#/components/responses/RSFromIssuer_400'
        '401':
          $ref: '#/components/responses/RSInvalidSignature'
        '500':
          $ref: '#/components/responses/RSInternalServerError'
      security:
      - oAuth2ClientCredentials: []
    servers:
    - description: Certification
      url: https://[URLIssuer]/v2
  /notifications/serviceactivated:
    post:
      servers:
      - description: External
        url: https://[URLIssuer]
      tags:
      - Tokenization Process
      summary: Notifications Service Activated
      description: The Issuer exposes this endpoint to receive the notifications about token’s creation.
      operationId: serviceactivated
      requestBody:
        $ref: '#/components/requestBodies/RQNotServiceActivated'
      responses:
        '200':
          $ref: '#/components/responses/RSFromIssuer_200'
        '400':
          $ref: '#/components/responses/RSFromIssuer_400'
        '401':
          $ref: '#/components/responses/RSInvalidSignature'
        '500':
          $ref: '#/components/responses/RSInternalServerError'
      security:
      - oAuth2ClientCredentials: []
    servers:
    - description: Certification
      url: https://[URLIssuer]/v2
  /notifications/tokenupdated:
    post:
      servers:
      - description: External
        url: https://[URLIssuer]
      tags:
      - Tokenization Process
      summary: Notifications about Token Updated
      description: 'The Issuer exposes this endpoint to receive notifications about the token’s status changes.

        Available Types:

        REDIGITIZATION_COMPLETE

        DELETED_FROM_CONSUMER_APP

        STATUS_UPDATE'
      operationId: tokenupdated
      requestBody:
        $ref: '#/components/requestBodies/RQNotTokenUpdated'
      responses:
        '200':
          $ref: '#/components/responses/RSFromIssuer_200'
        '400':
          $ref: '#/components/responses/RSFromIssuer_400'
        '401':
          $ref: '#/components/responses/RSInvalidSignature'
        '500':
          $ref: '#/components/responses/RSInternalServerError'
      security:
      - oAuth2ClientCredentials: []
    servers:
    - description: Certification
      url: https://[URLIssuer]/v2
  /notifications/suspiciousevents:
    post:
      servers:
      - description: External
        url: https://[URLIssuer]
      tags:
      - Tokenization Process
      summary: Notifications about Suspicious Events
      description: 'The Issuer exposes this endpoint to receive notifications

        about the token when any suspicious events are detected.'
      operationId: suspiciousevents
      requestBody:
        $ref: '#/components/requestBodies/RQNotSuspiciousEvents'
      responses:
        '200':
          $ref: '#/components/responses/RSFromIssuer_200'
        '400':
          $ref: '#/components/responses/RSFromIssuer_400'
        '401':
          $ref: '#/components/responses/RSInvalidSignature'
        '500':
          $ref: '#/components/responses/RSInternalServerError'
      security:
      - oAuth2ClientCredentials: []
    servers:
    - description: Certification
      url: https://[URLIssuer]/v2
components:
  schemas:
    ObjGroupResp:
      type: object
      properties:
        groupType:
          type: string
          maxLength: 16
          description: 'The Group Type Code from the request that is returned in the response.

            '
        groupID:
          type: string
          maxLength: 32
          description: 'Contains the issuer-supplied group identifier for the specified group type received in request.

            '
        responseStatus:
          type: string
          description: 'Response status value.

            Available values:

            - S

            - W

            - F

            '
          enum:
          - S
          - W
          - F
        rejectCode:
          type: string
          maxLength: 2
          description: 'Contains the Reject Code for the failure. Present only when the Response Status = F.

            '
          example: ER
        rejectDesc:
          type: string
          maxLength: 100
          description: 'Contains the Reject Reason for the failure. Present only when the Response Status = F.

            '
          example: ERROR DETAIL
    RQCheckEligibility:
      type: object
      required:
      - tokenRequestorID
      - tokenReferenceID
      - panReferenceID
      - panSource
      - deviceInfo
      - encryptedData
      properties:
        tokenRequestorID:
          type: integer
          description: 'Unique ID assigned to the client requesting the token. This value is

            assigned by Visa when creating the VTS project.

            '
          example: 40022358888
        tokenReferenceID:
          type: string
          description: 'Unique ID associating a token with a card. This ID can be used in

            future calls to make operations related to the token in the I-TSP.

            '
          example: DNITHE30194726875288888
        panReferenceID:
          type: string
          description: 'Unique ID representing a card. This ID can be used in future calls

            referred to the card in the Tokenization flow.

            '
          example: V-3019231458906209630635
        panSource:
          type: string
          description: 'Origin of the information of the PAN.


            Allowed values:

            - KEY_ENTERED

            - ON_FILE

            - MOBILE_BANKING_APP

            - TOKEN

            - CHIP_DIP

            - CONTACTLESS_TAP

            '
          enum:
          - KEY_ENTERED
          - ON_FILE
          - MOBILE_BANKING_APP
          - TOKEN
          - CHIP_DIP
          - CONTACTLESS_TAP
          example: MOBILE_BANKING_APP
        deviceInfo:
          description: 'When the token is for an specific device, The object must have deviceID and deviceLanguageCode.

            '
          $ref: '#/components/schemas/ObjDeviceInformationEligibility'
        encryptedData:
          type: object
          description: Represents the encrypted payload
          properties:
            cardholderInfo:
              $ref: '#/components/schemas/ObjCardHolderInfo_PANExpiryDate'
    ObjTokenUserInfo:
      type: object
      required:
      - tokenUserID
      properties:
        tokenUserID:
          type: number
          description: 'Unique value that identifies the user token.


            The user token is an entity that initiated the payment request.

            '
          maxLength: 11
          example: Novo InApp
        tokenUserAppType:
          type: string
          description: 'Token user application type. It can be a merchant, market or other.


            Possible values:

            - UNKNOWN

            - WEB

            - MOBILE_WEB

            - MOBILE_APP

            - MARKETPLACE

            - VOICE_APP

            - BIOMETRIC_APP

            '
          enum:
          - UNKNOWN
          - WEB
          - MOBILE_WEB
          - MOBILE_APP
          - MARKETPLACE
          - VOICE_APP
          - BIOMETRIC_APP
          example: MOBILE_WEB
    RQNotification:
      type: object
      required:
      - eventType
      - messageReasonCode
      - dateTimeOfEvent
      properties:
        eventType:
          type: string
          description: 'Type of event this value is important to recognize the fields that

            is going to receive in the notification.


            Available values:

            - TOKEN_CREATED

            - TOKEN_STATUS_UPDATED

            - TOKEN_ACTIVATION_STIP

            - PAN_UPDATED

            - CARD_METADATA_UPDATED

            - ACCOUNT_LEVEL_RECORD

            - THREE_DS_ACTIVATION

            - ACCOUNT_LEVEL_RECORD_UPDATE

            - PUSH_PROVISIONING_STATUS

            - PUSH_ENROLLMENT_STATUS

            - CTP_ENROLLMENT_ATTEMPT

            '
          enum:
          - TOKEN_CREATED
          - TOKEN_STATUS_UPDATED
          - TOKEN_ACTIVATION_STIP
          - PAN_UPDATED
          - CARD_METADATA_UPDATED
          - ACCOUNT_LEVEL_RECORD
          - THREE_DS_ACTIVATION
          - ACCOUNT_LEVEL_RECORD_UPDATE
          - PUSH_PROVISIONING_STATUS
          - PUSH_ENROLLMENT_STATUS
          - CTP_ENROLLMENT_ATTEMPT
          maxLength: 25
          example: TOKEN_CREATED
        panReferenceID:
          type: string
          description: 'Unique ID representing a card. This ID can be used instead of the

            PAN number for subsequent calls such as notifications or life cycle

            management.


            Not present when evenType is CARD_METADATA_UPDATED.

            '
          maxLength: 32
          example: V-3019231458906209630635
        tokenReferenceID:
          type: string
          description: 'Unique ID associating a token with a card. This ID can be used in

            future calls to make operations related to the token in the I-TSP

            for example events related to the management of the life cycle.


            Not present when eventType is PAN_UPDATED or CARD_METADATA_UPDATED

            OR ACCOUNT_LEVEL_RECORD.

            '
          maxLength: 32
          example: DNITHE30194726875288888
        tokenRequestorID:
          type: integer
          description: 'Unique ID assigned to the client requesting the token. This value

            is assigned by Visa when creating the VTS project.


            Not present when eventType is PAN_UPDATED or CARD_METADATA_UPDATED

            OR ACCOUNT_LEVEL_RECORD

            '
          example: 40022358888
        messageReasonCode:
          type: string
          description: 'Message reason code.

            The descriptions may vary in previously agreement with the issuer.


            Available values:

            - TOKEN_CREATED

            - TOKEN_DEACTIVATED

            - TOKEN_SUSPEND

            - TOKEN_RESUME

            - DEVICE_PROVISIONING_RESULT

            - OTP_VERIFICATION_RESULT

            - CALL_CENTER_ACTIVATION

            - MOBILE_BANK_APP_ACTIVATION

            - LUK_REPLENISHMENT

            - DEVICE_PROVISIONING

            - REPERSONALIZATION_RESULT

            - TOKEN_EXPIRY_DATE_UPDATED

            - TOKEN_DEVICE_BINDING_RESULT

            - CARDHOLDER_STEPUP_RESULT

            - RUSTED_LISTING_ENROLLMENT_RESULT

            - TOKEN_DEVICE_BINDING_REMOVED

            - ACCOUNT_UPDATE

            - EXP_DATE_UPDATE

            - CARD_METADATA_UPDATED

            - TOKEN_ACTIVATION_STIP

            - ACCOUNT_LEVEL_RECORD_UPDATE

            - THREE_DS_ACTIVATION

            '
          enum:
          - TOKEN_CREATED
          - TOKEN_DEACTIVATED
          - TOKEN_SUSPEND
          - TOKEN_RESUME
          - DEVICE_PROVISIONING_RESULT
          - OTP_VERIFICATION_RESULT
          - CALL_CENTER_ACTIVATION
          - MOBILE_BANK_APP_ACTIVATION
          - LUK_REPLENISHMENT
          - DEVICE_PROVISIONING
          - REPERSONALIZATION_RESULT
          - TOKEN_EXPIRY_DATE_UPDATED
          - TOKEN_DEVICE_BINDING_RESULT
          - CARDHOLDER_STEPUP_RESULT
          - RUSTED_LISTING_ENROLLMENT_RESULT
          - TOKEN_DEVICE_BINDING_REMOVED
          - ACCOUNT_UPDATE
          - EXP_DATE_UPDATE
          - ACCOUNT_LEVEL_RECORD_UPDATE
          - CARD_METADATA_UPDATED
          - TOKEN_ACTIVATION_STIP
          - THREE_DS_ACTIVATION
          example: TOKEN_CREATED
        dateTimeOfEvent:
          type: string
          format: date-time
          description: 'Date and time of the event.

            Format: yyyy-MM-ddTHH:mm:ss.SSSz The time zone is GMT.

            '
        encryptedData:
          $ref: '#/components/schemas/ObjNotificationEncryptedData'
        tokenInfo:
          $ref: '#/components/schemas/ObjTokenInfo'
        deviceInfo:
          $ref: '#/components/schemas/ObjDeviceInformation'
        tokenUserInfo:
          $ref: '#/components/schemas/ObjTokenUserInfo'
        merchantInfo:
          $ref: '#/components/schemas/ObjMerchantInfo'
        actionCode:
          type: string
          description: "Action code to indicate Visa for which flow it should go.\nIn case the provisioning of the token is approved, the values are:\n\n- 00 - Green path, indicates that the token is provisioned and\n  automatically activated for payments.\n- 85 - Yellow path, indicates that the token is provisioned and the\n  client must be authenticated to activate the token. In case the\n  provisioning is not approved, the code must be within the following.\n- N7 - incorrect CVV2\n- 14 - Invalid card number\n- 54 - Invalid expiration date\n- 05 - Generic rejection\n- 96 - Internal system error\n"
          enum:
          - '00'
          - '85'
          - N7
          - '14'
          - '54'
          - '05'
          - '96'
          example: '00'
        lifeCycleTraceID:
          type: number
          description: 'Identification of the process.

            Present when eventType is TOKEN_STATUS_UPDATED or TOKEN_CREATED

            '
          maxLength: 15
        tokenRequestorTspID:
          type: string
          description: 'Identification of the token requestor token service provider.

            Not present on evenType PAN_UPDATED or CARD_METADATA_UPDATED.

            '
          maxLength: 11
        tokenUpdateChannel:
          type: string
          description: "Conditional, Token update channel. \nIt is present when the messageReasonCode is TOKEN_EXPIRY_DATE_UPDATED and the date is updated via the Visa Issuer OBO Credential Update Service.\n"
          example: ISSUER_OBO_LCM
        panUpdateChannel:
          type: string
          description: "Conditional, PAN update channel.\n It is present when the messageReasonCode is EXP_DATE_UPDATE and the date is updated via the Visa Issuer OBO Credential Update Service.\n"
          example: ISSUER_OBO_LCM
        accountLevelInfoResp:
          $ref: '#/components/schemas/ObjAccountLevelInfoResp'
        clientWalletAccountID:
          type: string
          description: 'Identifier of the wallet that sends the request.

            Client provided consumer ID that identifies the wallet account

            holder entity

            '
          maxLength: 32
        panSource:
          type: string
          description: 'Origin of the information of the PAN.


            Allowed values:

            - KEY_ENTERED

            - ON_FILE

            - MOBILE_BANKING_APP

            - TOKEN

            - CHIP_DIP

            - CONTACTLESS_TAP

            '
          enum:
          - KEY_ENTERED
          - ON_FILE
          - MOBILE_BANKING_APP
          - TOKEN
          - CHIP_DIP
          - CONTACTLESS_TAP
          example: KEY_ENTERED
        cvv2ResultsCode:
          type: string
          description: "Result code of the validation of CVV2 made by VISA. Present when eventType is TOKEN_CREATED or TOKEN_ACTIVATION_STIP in some cases this value could be null.\nAvailable Values:\n- M: The CVV2 is match.\n- N: The CVV2 enter by the user is incorrect.\n- P: The CVV2 was not validate.\n- S: Indicates that V.I.P. or the issuer was unable to perform CVV2\n  verification.\n\n- U: Issuer was not available does not participate in the CVV2\n  Service or that STIP has responded to an issuer-unavailable\n  response.\n\n-  NULL: When the provisioning process occured without CVV\n"
          enum:
          - M
          - N
          - P
          - S
          - U
          - null
          maxLength: 1
          example: M
        consumerEntryMode:
          type: string
          description: 'Method of consumer entry.


            Available values:

            - KEY_ENTERED

            - CAMERA_CAPTURED

            - UNKNOWN


            Could be present when eventType is TOKEN_CREATED or

            TOKEN_ACTIVATION_STIP.

            '
          enum:
          - KEY_ENTERED
          - CAMERA_CAPTURED
          - UNKNOWN
        locale:
          type: string
          description: 'The language for the app if need a country code should be separated

            using a “_“.Example: en_US.


            Format: String; ISO language ISO 639-1 and alpha-2 country code ISO

            3166-1 alpha-2.


            Could be present when eventType is TOKEN_CREATED or

            TOKEN_ACTIVATION_STIP.

            '
          maxLength: 5
          example: en_US
        termsAndConditions:
          $ref: '#/components/schemas/ObjTermsAndConditions'
        stipReasonCode:
          type: string
          description: 'STIP Response code only present when eventType is

            TOKEN_ACTIVATION_STIP.


            Available Values for VISA:

            - 9011: The line to issuer is down.

            - 9012: Forced STIP because of N0 (Force STIP) original response from issuer.

            - 9020: Issuer Time Out.

            - 9027: ECIP RTD Decline. Sent by CVV2 or RTD upon decline.

            - 9203: Decline due to Office of Foreign Assets Control (OFAC) embargo.

            - 9206: Mod-10 check failure.

            - 9208: Declined because issuing identifier and/or routing identifier is blocked.

            - 9210: Declined because of issuer participation options.

            - 9212: Declined due to fraud condition.

            - 9216: Ineligible data for Token Type. Token is not a device-based one.

            - 9217: Loyalty personalized data input is incorrect.

            - 9061: Switch Detected Error. Sent by Visa by default.

            '
          enum:
          - 9011
          - 9012
          - 9020
          - 9027
          - 9203
          - 9206
          - 9208
          - 9210
          - 9212
          - 9216
          - 9217
          - 9061
          maxLength: 4
          example: 9011
        activationVerificationResult:
          type: string
          description: 'Result of the verification this notification is available when de

            provisioning is in yellow flow.


            Will be present when messageReasonCode is OTP_VERIFICATION_RESULT or

            MOBILE_BANK_APP_ACTIVATION.


            Available values:

            - VERIFICATION_SUCCESS

            - VERIFICATION_CODE_EXPIRED

            - VERIFICATION_CODE_FAILED

            - VERIFICATION_CODE_MISSING

            - VERIFICATION_CODE_RETRIES_EXCEEDED

            '
          enum:
          - VERIFICATION_SUCCESS
          - VERIFICATION_CODE_EXPIRED
          - VERIFICATION_CODE_FAILED
          - VERIFICATION_CODE_MISSING
          - VERIFICATION_CODE_RETRIES_EXCEEDED
          maxLength: 100
        statusCode:
          type: string
          description: "(Conditional) Action status codes. Required for the PUSH_PROVISIONING_STATUS and PUSH_ENROLLMENT_STATUS event types;\n not used with the CTP_ENROLLMENT_ATTEMPT event type..\n\nAvailable values:\n- SUCCESS\n- FAILURE\n- NOTIFICATION_FAILURE\n- PROVISION_FAILURE\n- ENROLLMENT_FAILURE\n- ENROLLMENT_CANCELLED\n"
          enum:
          - SUCCESS
          - FAILURE
          - NOTIFICATION_FAILURE
          - PROVISION_FAILURE
          - ENROLLMENT_FAILURE
          - ENROLLMENT_CANCELLED
          maxLength: 100
        cardHolderStepupResult:
          type: string
          description: 'Result of the verification about cardholder.

            Will be present when messageReasonCode is CARDHOLDER_STEPUP_RESULT.


            Available values:

            - CARDHOLDER_STEPUP_OTP

            - CARDHOLDER_STEPUP_CALL_CENTER

            - CARDHOLDER_STEPUP_ISSUER_APP

            - CARDHOLDER_STEPUP_APPROVED

            - CARDHOLDER_STEPUP_THREE_DS

            '
          enum:
          - CARDHOLDER_STEPUP_OTP
          - CARDHOLDER_STEPUP_CALL_CENTER
          - CARDHOLDER_STEPUP_ISSUER_APP
          - CARDHOLDER_STEPUP_APPROVED
          - CARDHOLDER_STEPUP_THREE_DS
          maxLength: 100
        deviceBindingResult:
          type: string
          description: 'Result of a token device binding. Will be present when

            messageReasonCode is TOKEN_DEVICE_BINDING_RESULT.

            Available values:

            - DEVICE_BINDING_APPROVED

            - DEVICE_BINDING_OTP

            - DEVICE_BINDING_CALL_CENTER

            - DEVICE_BINDING_ISSUER_APP

            - DEVICE_BINDING_REMOVED

            - DEVICE_BINDING_THREE_DS

            - DEVICE_BINDING_IMPLICITLYAPPROVED

            '
          enum:
          - DEVICE_BINDING_APPROVED
          - DEVICE_BINDING_OTP
          - DEVICE_BINDING_CALL_CENTER
          - DEVICE_BINDING_ISSUER_APP
          - DEVICE_BINDING_REMOVED
          - DEVICE_BINDING_THREE_DS
          - DEVICE_BINDING_IMPLICITLYAPPROVED
          maxLength: 100
        deviceId:
          type: string
          description: 'When the provisioning is in a SE wallets providers this value is the

            SE ID in hex binary characters.

            In an HCE wallet is the device ID determined for the wallet.

            Will be present when messageReasonCode is TOKEN_DEVICE_BINDING_RESULT.

            '
          maxLength: 48
        taskID:
          type: string
          description: 'Present only when messageReasonCode is CARD_METADATA_UPDATED.

            This value is an GUID hyphens to identify the task.

            '
          maxLength: 36
        errorCode:
          type: string
          description: 'Present only when messageReasonCode is CARD_METADATA_UPDATED.

            For VISA is the Business error code starts with VSEXXXXX

            '
          maxLength: 8
        cardToken:
          type: string
          description: 'Unique Card Identifier at NovoPayment’s Issuance Service.

            '
          maxLength: 40
          example: 5DA...27
    ObjTokenInfo:
      type: object
      description: 'Structure with token information, the content available could be different in each API service.

        '
      properties:
        token:
          type: string
          maxLength: 19
          description: The token associated with the PAN.
          example: '...'
        tokenType:
          type: string
          maxLength: 32
          description: 'Token type.


            Available values.

            - ECOMMERCE

            - SECURE_ELEMENT

            - CARD_ON_FILE

            - HCE

            - QRC

            '
          enum:
          - ECOMMERCE
          - SECURE_ELEMENT
          - CARD_ON_FILE
          - HCE
          - QRC
          example: ECOMMERCE
        tokenStatus:
          type: string
          description: 'Token status.


            Available values:

            - INACTIVE : The token was created but the activation process is pending.

            - ACTIVE : The token was Activated successfully.

            - SUSPENDED : The token was suspended.

            - DEACTIVATED : The token was eliminated.

            '
          enum:
          - INACTIVE
          - ACTIVE
          - SUSPENDED
          - DEACTIVATED
          example: ACTIVE
        tokenExpirationDate:
          $ref: '#/components/schemas/ObjExpirationDate'
        tokenRequestorName:
          type: string
          maxLength: 100
          description: 'Token requestor name.

            '
          example: NovoPayment Wallet
        tokenAssuranceMethod:
          type: string
          maxLength: 19
          description: "Method of Issuer ID&V that has taken place at time of provisioning,\ndevice binding.\n- 00 Cardholder Verification was Not Performed\n- 10 Card Issuer Account Verification\n- 11 Card Issuer Interactive Cardholder Verification - 1 Factor\n- 12 Card Issuer Interactive Cardholder Verification - 2 Factor\n- 13 Card Issuer Risk Oriented Non-Interactive Cardholder\n  Authentication\n- 14 Card Issuer Asserted Authentication\n"
          example: '00'
        numberOfActiveTokensForPAN:
          type: number
          maxLength: 4
          description: 'Number of device tokens that are currently active for this PAN.

            '
          example: 2
        numberOfInactiveTokensForPAN:
          type: number
          maxLength: 4
          description: 'Number of device tokens that are currently inactive.

            (device tokens have not been activated) for this PAN

            '
          example: 2
        numberOfSuspendedTokensForPAN:
          type: number
          maxLength: 4
          description: 'Number of device tokens that were activated but are

            suspended for payments for this PAN.

            '
          example: 0
        tokenActivationDate:
          type: string
          format: date-time
          description: 'System date/timestamp, in GMT, of token activation into an active

            state. For an inactive state, this field is left empty and populated

            only when a token transitions to an active state. If a token

            is suspended, this field is populated with the new date/timestamp of

            when an active state resumes.


            Format: yyy-MM-ddTHH:mm:ss.SSSZ

            '
          example: '2022-04-25T23:19:12.000Z'
        tokenDeactivationDate:
          type: string
          description: 'Date of token deactivation.


            This field is left empty and populated only when a token transitions

            to an Inactive state.

            '
          example: '...'
        lastTokenStatusUpdatedTime:
          type: string
          maxLength: 19
          description: 'Original Token account number.


            This field is populated only when performing token for token

            provisioning, this mean the panSource is equal to TOKEN.

            '
          example: '...'
        originalToken:
          type: string
          maxLength: 19
          description: 'Original Token account number.


            This field is populated only when performing token for token

            provisioning, this mean the panSource is equal to TOKEN.

            '
          example: '...'
        originalTokenRequestorID:
          type: number
          maxLength: 4
          description: 'Unique ID assigned to the initiator of the OriginalToken request.


            This field is populated only when performing token for token

            provisioning, this mean the panSource is equal to TOKEN.

            '
          example: '...'
        originalTokenReferenceID:
          type: string
          maxLength: 32
          description: 'Unique ID for the OriginalToken associated with the PAN.


            This field is populated only when performing token for token

            provisioning, this mean the panSource is equal to TOKEN.

            '
          example: '...'
        originalTokenType:
          type: string
          description: 'Token type of the original token.


            This field is populated only when performing token for token

            provisioning, this mean the panSource is equal to TOKEN.

            Format: It is one of the following values:

            - SECURE_ELEMENT

            - HCE

            - CARD_ON_FILE

            - ECOMMERCE

            - QRC

            '
          enum:
          - SECURE_ELEMENT
          - HCE
          - CARD_ON_FILE
          - ECOMMERCE
          - QRC
          example: SECURE_ELEMENT
        originaltokenAssuranceMethod:
          type: string
          description: 'Original token assurance method.


            This field is populated only when performing token for token

            provisioning, this mean the panSource is equal to TOKEN.

            - 00 ID&V Not Performed

            - 10 Card Issuer Account Verification

            - 11 Card Issuer Interactive Cardholder Verification - 1 Factor

            - 12 Card Issuer Interactive Cardholder Verification - 2 Factor

            - 13 Card Issuer Risk Oriented Non-Interactive Cardholder Authentication

            - 14 Card Issuer Asserted Authentication

            '
          enum:
          - '00'
          - '10'
          - '11'
          - '12'
          - '13'
          - '14'
          example: '00'
        autoFillIndicator:
          type: boolean
          description: 'Indicates whether the token is for an autofill use case.

            This value is populated when eventType is equal to TOKEN_CREATED.

            '
          example: false
    RSCardInfo200:
      required:

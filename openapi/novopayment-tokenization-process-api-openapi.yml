            '
        foregroundColor:
          type: string
          maxLength: 32
          description: 'Foreground color of the digital wallet home.


            Format: rgb.

            Sample: 255,122,235


            This value is optional because the issuer can configure it through

            the Visa Card Art Management (VCMM).

            '
          example: 255,122,235

      description: 'Time Stamp in ISO 8601 format for example, 2017-07-21T17:32:28Z

        '
      example: '2022-04-25T23:19:12.000Z'
      minLength: 24
      maxLength: 24
    RSIssuer_InvalidSignature:
      type: object
      required:
      - code
      - message
      - datetime

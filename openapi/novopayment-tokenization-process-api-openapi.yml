          description: "Action code to indicate Visa for which flow it should go.\nIn case the provisioning of the token is approved, the values are:\n\n- 00 - Green path, indicates that the token is provisioned and\n  automatically activated for payments.\n- 85 - Yellow path, indicates that the token is provisioned and the\n  client must be authenticated to activate the token. In case the\n  provisioning is not approved, the code must be within the following.\n- N7 - incorrect CVV2\n- 14 - Invalid card number\n- 54 - Invalid expiration date\n- 05 - Generic rejection\n- 96 - Internal system error\n"
          enum:
          - '00'
          - '85'
          - N7
          - '14'
          - '54'
          - '05'
          - '96'
          example: '00'
        addressVerificationResultCode:
          type: string
          description: 'Code that describes the result of an address verification.

            '
          maxLength: 1
        cvv2ResultsCode:
          type: string
          description: "CVV2 verification from Visa\n\n- M - Visa verified the CVV2 enter by the user in the wallet.\n- N - Visa couldn’t verified the CVV2 enter by the user in the wallet,\n  meaning the CVV2 enter is incorrect.\n- P - Visa didn’t verify the CVV2. Is null when cvv is optional\n"
          enum:
          - M
          - N
          - P
          maxLength: 1
        issuerSpecialConditionCodes:
          type: string
          description: "Supported for issuers participating in 0100 TAR.The issuer can send\nvalues for this element in the 0100 TAR response.\n- If the issuer sends a value in the 0100 TAR, it will be sent in\n  this element of the Get CVM.\n- If no value is sent in 0100 TAR or if the issuer does not\n  participate in TAR, this element will not be present.\n"

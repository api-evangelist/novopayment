          type: string
          description: 'Method of consumer entry.


            Available values:

            - KEY_ENTERED

            - CAMERA_CAPTURED

            - UNKNOWN

            '
          enum:
          - KEY_ENTERED
          - CAMERA_CAPTURED
          - UNKNOWN
          example: KEY_ENTERED
        locale:
          type: string
          description: 'The language for the app,if need a country code should be separated

            using a “_“.


            Example: en_US


            Format: String; ISO language ISO 639-1 and alpha-2 country code

            ISO 3166-1 alpha-2

            '
          maxLength: 5
          example: en_US
        deviceInfo:
          $ref: '#/components/schemas/ObjDeviceInformation'
        tokenInfo:
          $ref: '#/components/schemas/ObjTokenInfo'
        encryptedData:
          type: object
          description: 'Represents the encrypted payload, contains Cardholder Information and Risk Information with the applicable information.

            '
          properties:
            cardholderInfo:
              $ref: '#/components/schemas/ObjCardHolderInfo_Provisioning'
            riskInfo:
              $ref: '#/components/schemas/ObjRiskInfo'
    ObjBillingAddress:
      type: object
      properties:
        name:
          type: string
          description: Physical address or shipping address.
          maxLength: 100
          example: Novo InApp
        line1:
          type: string
          description: 'First line of the address. Usually for the complete address,

            this is Required for the US and Canada.

            '
          maxLength: 256
          example: 10808 Research Boulevard
        line2:
          type: string
          description: 'Second line, usually corresponds to house, apartment,

            suite, etc.

            '
          maxLength: 256
          example: Provisioning Boulevard
        city:
          type: string
          description: Name of the city.
          maxLength: 100
          example: Austin
        state:
          type: string
          description: 'State or province in the country.This field must be valid

            for the respective country.The country will be related to the

            country of the bank.

            '
          example: TX
        postalCode:
          type: string
          description: 'Postal Code.


            Condition: If address is provided this field has the following

            characteristics.

            '
          maxLength: 40
          example: 78759
    ObjRiskInfo:
      type: object
      description: 'Structure with risk information.


        This object can be sent when messageReasonCode is equal to TOKEN_CREATED

        '
      properties:
        walletProviderRiskAssessment:
          type: string
          maxLength: 1
          description: 'Risk rating of the wallet, it can be one of the following values:

            - 0: Unconditionally approved.

            - 1: Conditionally approved with further consumer verification.

            - 2: Not approved

            '
          enum:
          - 0
          - 1
          - 2
        walletProviderRiskAssessmentVersion:
          type: string
          maxLength: 10
          description: 'Information for the Issuer related to the security level of the wallet

            '
        walletProviderAccountScore:
          type: string
          maxLength: 2
          description: 'The wallet provider account score. Score value is between 1 and 5,

            indicating the confidence level of the account, where 5 indicates

            the most confidence on the account.

            '
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
        walletProviderDeviceScore:
          type: string
          maxLength: 2
          description: The wallet provider device score. Score value is between 1 and 5, indicating the confidence level of the device, where 5 indicates the most confidence.
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
        walletProviderReasonCodes:
          type: string
          maxLength: 100
          description: Wallet provider reason codes, in a comma-separated format.
        deviceBluetoothMac:
          type: string
          maxLength: 24
          description: MAC address for Bluetooth.
        deviceIMEI:
          type: string
          maxLength: 24
          description: Hardware ID of the device.
        deviceSerialNumber:
          type: string
          maxLength: 24
          description: Serial number of the mobile device.
        deviceTimeZone:
          type: string
          maxLength: 5
          description: Time-zone abbreviation.
        deviceTimeZoneSetting:
          type: string
          description: 'Device time-zone setting.

            Available Values:

            - NETWORK_SET

            - CONSUMER_SET

            '
          enum:
          - NETWORK_SET
          - CONSUMER_SET
        osID:
          type: string
          maxLength: 24
          description: OS ID to allow building velocity and risk rules.
        simSerialNumber:
          type: string
          maxLength: 24
          description: SIM serial number of the mobile device
        deviceLostMode:
          type: string
          maxLength: 4
          description: Number of days. Values are up to 9999 number of days.
        daysSinceConsumerDataLastAccountChange:
          type: string
          maxLength: 4
          description: 'Number of days since account settings were changed (in case of a

            password update). If the number of days exceeds 9999, it will stay

            at 9999.

            '
        accountHolderName:
          type: string
          maxLength: 64
          description: Account-holder’s name.
        walletProviderPANAge:
          type: string
          maxLength: 4
          description: 'Length of time (in days) that a PAN has been on file for

            a user.

            '
        walletAccountHolderCardNameMatch:
          type: string
          maxLength: 4
          description: 'Name of the accountholder and name of cardholder matched.

            Available Values:

            - Y: Indicates the two names match.

            - N: Indicates the two names do not match.

            '
          enum:
          - Y
          - N
        accountToDeviceBindingAge:
          type: string
          maxLength: 4
          description: 'Number of days this device has been used by this account.

            If the number of days exceeds 9999, it will stay at 9999.


            Example: 9999

            '
        userAccountAge:
          type: string
          maxLength: 4
          description: 'Number of days since an account for this user has existed.

            Values are 0 through 9999.


            Example: 9999

            '
        walletAccountAge:
          type: string
          description: 'Number of days since the user created a wallet account or started

            using a wallet. If the number of days exceeds 256, it will stay at 256.

            '
        provisioningAttemptsOnDeviceIn24Hours:
          type: string
          maxLength: 2
          description: 'Number of provisioning attempts on this device in the past 24 hours.

            If the number of attempts exceeds 99, it will stay at 99.

            '
          example: 99
        distinctCardholderNames:
          type: string
          maxLength: 2
          description: 'Number of distinct cardholder names used in provisioning from this

            device.

            '
          example: 99
        deviceCountry:
          type: string
          maxLength: 2
          description: 'Country of device at time of provisioning. ISO 3166-1, alpha-2

            '
          example: US
        walletAccountCountry:
          type: string
          maxLength: 2
          description: Country of accountholder. ISO 3166-1, alpha-2
          example: US
        suspendedCardsInAccount:
          type: string
          maxLength: 2
          description: 'Number of cards suspended in the account.

            If the number of days exceeds 99, it will stay at 99.

            '
          example: 99
        daysSinceLastAccountActivity:
          type: string
          maxLength: 4
          description: 'Number of days since the last activity on account.

            If the number of days exceeds 9999, it will stay at 9999.

            '
          example: 9999
        numberOfTransactionsInLast12months:
          type: string
          maxLength: 4
          description: 'Number of transactions on this account in the last 12 months.

            If the number of transactions exceeds 9999, it will stay at 9999.

            '
          example: 9999
        numberOfActiveTokens:
          type: string
          maxLength: 2
          description: 'Number of active tokens on this account.

            If the number of tokens exceeds 99, it will stay at 99.

            '
          example: 99
        deviceWithActiveTokens:
          type: string
          maxLength: 2
          description: 'Number of devices for this user with the same token.

            If the number of tokens exceeds 99, it will stay at 99.

            '
          example: 99
        activeTokensOnAllDeviceForAccount:
          type: string
          maxLength: 4
          description: 'Number of active tokens for this user, across all devices.

            If the number of tokens exceeds 9999, it will stay at 9999.

            '
          example: 9999
        visaTokenScore:
          type: string
          maxLength: 2
          description: 'Value indicating the degree of risk associated with the token.

            Numeric value is 01 through 99.

            '
        visaTokenDecisioning:
          type: number
          maxLength: 2
          description: "Results from the token provisioning service.\n\nAvailable values:\n- 00: Provision and activate\n- 05: Do not provision\n- 85: Provision in inactive state (requires further consumer\n  authentication prior to activation - Yellow Flow)\n"
          enum:
          - '00'
          - '05'
          - '85'
        riskAssessmentScore:
          type: string
          maxLength: 2
          description: 'Values are 0 through 99. A higher value indicates a higher risk.

            This is calculated by the AA Risk Engine, based on the PAN’s

            transaction pattern (long term and short term).

            '
        issuerSpecialConditionCodes:
          type: string
          maxLength: 100
          description: 'Supported for issuers participating in 0100 TAR. The issuer can send

            values for this element in the 0100 TAR response.


            If the issuer sends a value in the 0100 TAR, it will be sent in this

            element of the Get CVM.

            If no value is sent in 0100 TAR or if the issuer does not participate

            in TAR, this element will not be present.

            '
    ObjApproveProvisionIssuerDiscretionaryData:
      type: object
      properties:
        fileControlInformation:
          type: string
          description: 'File control information.


            hexBinary, hex characters must be uppercase; max length of 128 bytes.

            '
        issuerApplicationDiscretionaryData:
          type: string
          description: 'Discretionary data

            '
    RSErrorCode400:
      type: object
      description: 'Error message code only if the HTTP status is different from 200.

        This field shows the I-TSP if an error was generated in the request.

        '
      properties:
        errorCode:
          type: string
          description: 'Error response Codes:

            - ISE40000: ISS_ERROR_REQUIRED_DATA_MISSING

            - ISE40005: ISS_ERROR_INVALID_FIELD_LENGTH

            - ISE40006: ISS_ERROR_INVALID_FIELD_TYPE

            - ISE40010: ISS_ERROR_CRYPTOGRAPHY_ERROR

            - ISE40013: ISS_ERROR_INVALID_EXP_DATE

            - ISE40001: ISS_ERROR_PAN_INELIGIBLE

            '
          enum:
          - ISE40000
          - ISE40005
          - ISE40006
          - ISE40010
          - ISE40013
          - ISE40001
    ObjCheckEligibilityApplicationInfo:
      type: object
      properties:
        supportsTokenNotifications:
          type: boolean
          description: 'Indicates whether the card supports token claims for transactions

            originated from the device.

            '
          enum:
          - true
          - false
        supportsFPANNotifications:
          type: boolean
          description: 'Indicates if the card supports FPAN Notifications for all transactions

            that point to the FPAN.

            '
          enum:
          - true
          - false
        transactionServiceURL:
          type: string
          description: 'Transaction history URL (TransactionDetails) of the issuer''s web

            service.

            '
          maxLength: 128
        messageServiceURL:
          type: string
          description: 'URL of the message/web service offer. It conforms to the API as

            described in the SOPs and Issuers in the Card Notification Services

            API Specification.

            '
          maxLength: 32
        transactionPushTopic:
          type: string
          description: The issuer notifies the device of new available transactions.
          maxLength: 128
        messagePushTopic:
          type: string
          description: 'The notification push provider notifies the device of new

            available messages.

            '
          maxLength: 128
        appLaunchURL:
          type: string
          description: 'URL given to the issuer associated with the mobile application upon

            launch. If this key is present, the AssociatedStoreIdentifiers key

            must also be present.

            '
          maxLength: 128
        appLaunchURLScheme:
          type: string
          description: 'Registered app URL scheme, in order to deep link from transaction

            notifications and display all transaction notifications.

            App ID must be included in the associated ApplicationIdentifiers

            matrix and the application itself must register for the URL scheme

            specified in this key.

            '
          maxLength: 32
        associatedStoreIdentifiers:
          type: array
          description: 'A list of mobile app store items identifiers for the partner issuer''s

            mobile banking app. The format is specific to a mobile store/phone

            platform. Only one item from the list is used.

            '
          items:
            type: string
            maxLength: 20
        associatedApplicationIdentifiers:
          type: array
          description: 'An array of associated application identifiers. Similar to

            AssociatedStoreIdentifiers, but with explicit application IDs

            (only applicable to SE DWP).

            '
          items:
            type: integer
    ObjLinkEnrollment:
      type: object
      properties:
        groupResp:
          $ref: '#/components/schemas/ObjGroupResp'
    ObjActivationMethod:
      type: object
      required:
      - type
      - destiny
      description: "Object with the information of the identification method chosen \nby the cardholder.\n"
      properties:
        type:
          type: string
          description: "Specifies the activation method type. Must be one of:\n- TEXT_TO_CARDHOLDER_NUMBER = Text message to Account holder's \nmobile phone number. Value will be the Account holder's masked \nmobile phone number.\n- EMAIL_TO_CARDHOLDER_ADDRESS = Email to Account holder's email \naddress. Value will be the Account holder's masked email address\n- CARDHOLDER_TO_CALL_AUTOMATED_NUMBER = Account holder-initiated \ncall to automated call center phone number. Value will be the phone \nnumber for the Account holder to call\n- CARDHOLDER_TO_CALL_MANNED_NUMBER = Account holder-initiated call \nto manned call center phone number. Value will be the phone number \nfor the Account holder to call\n- CARDHOLDER_TO_VISIT_WEBSITE = Account holder to visit a website. \nValue will be the website URL\n- CARDHOLDER_TO_USE_MOBILE_APP = Account holder to use a specific \nmobile app to activate token. Value will be replaced by a formatted \nstring\n- ISSUER_TO_CALL_CARDHOLDER_NUMBER = Issuer-initiated voice call to \nAccount holder's phone. Value will be the Account holder's masked \nvoice call phone number.\n"
          example: TEXT_TO_CARDHOLDER_NUMBER
        destiny:
          type: string
          description: 'Specifies the activation method value.

            '
          example: someaccount@novopayment.com
          maxLength: 64
        otpMethodIdentifier:
          type: string
          description: "Unique ID that allows to associate an OTP action to the cardholder. \nThis value is delivered by the issuer when the I-TSP calls the \nendpoint Cardholder Verification Methods. Only available for VISA.\n"
          maxLength: 32
    prm_tokenUniqueReference:
      type: string
      description: "Unique ID associating a token with a card. \nThis ID can be used in future calls to make operations related to the token in the I-TSP, \nfor example events related to the management of the life cycle.\n"
      example: DWSPMC000000000132d72d4fcb2f4136a0532d3093ff1a45
      maxLength: 64
    ObjencryptedPayload_StatusUpdate:
      required:
      - panUniqueReference
      type: object
      properties:
        panUniqueReference:
          type: string
          $ref: '#/components/schemas/prm_panUniqueReference'
        source:
          type: string
          $ref: '#/components/schemas/prm_source'
        dataValidUntilTimestamp:
          type: string
          description: "The date/time after which this encrypted object is considered invalid. If present, all systems must reject this encrypted object after this time and treat it as invalid data. Must be expressed in ISO 8601 extended format as one of the following:\n  - YYYY-MM-DDThh:mm:ss[.sss]Z\n  - YYYY-MM-DDThh:mm:ss[.sss]±hh:mm\n\nWhere [.sss] is optional and can be 1 to 3 digits. Must be a value no more than 30 days in the future. Mastercard recommends using a value of (Current Time + 30 minutes).\n"
          minLength: 20
          maxLength: 29
          example: 2015-07-04 12:09:56.123000-07:00
        cardAccountData:
          $ref: '#/components/schemas/ObjcardAccountData'
          description: Required if reasonCode is "FUNDING_ACCOUNT_UPDATE".
        tokenData:
          $ref: '#/components/schemas/ObjTokenData'
          description: Required if reasonCode is "REDIGITIZATION_COMPLETE" or "FUNDING_ACCOUNT_UPDATE".
        paymentAccountReference:
          type: string
          description: The unique account reference assigned to the PAN.
          minLength: 29
          maxLength: 29
          example: 512381d9f8e0629211e3949a08002
        financialAccountData:
          $ref: '#/components/schemas/ObjFinancialAccountData'
    prm_decision:
      type: string
      description: 'Status of the token.

        '
      enum:
      - APPROVED
      - REQUIRE_ADDITIONAL_AUTHENTICATION
      - DECLINED
      example: APPROVED
      maxLength: 14
    RQNotServiceActivated:
      type: object
      required:
      - requestId
      - reasonCode
      - dateTime
      - notificationBody
      properties:
        requestId:
          type: string
          $ref: '#/components/schemas/prm_requestId'
        reasonCode:
          type: string
          description: 'SERVICE_ACTIVATED

            '
          example: SERVICE_ACTIVATED
        dateTime:
          type: string
          description: 'dateTime. Format: yyyy-MM-ddTHH:mm:ss.SSSZ

            '
          example: 2026-07-04 19:08:56.123000+00:00
        notificationBody:
          type: object
          $ref: '#/components/schemas/ObjBodyServiceActivated'
    prm_panUniqueReference:
      type: string
      description: Reference to the PAN that is unique per Token Requestor.
      minLength: 1
      maxLength: 64
      example: FWSPMC000000000159f71f703d2141efaf04dd26803f922b
    ObjAccountHolderData:
      type: object
      properties:
        accountHolderName:
          type: string
          description: The name of the account holder in the format LASTNAME/FIRSTNAME or FIRSTNAME LASTNAME . Max length - 27. Type - String.
          minLength: 1
          maxLength: 27
          example: John Doe
        accountHolderEmailAddress:
          type: string
          description: The email address of the account holder. Not required - Optionally present in pushAccount request. Not present otherwise.
          minLength: 6
          maxLength: 320
          example: abcdef@xyz.com
        accountHolderMobilePhoneNumber:
          $ref: '#/components/schemas/ObjPhoneNumber'
        accountHolderAddress:
          $ref: '#/components/schemas/ObjAccountHolderAddress'
        sourceIp:
          type: string
          description: The IP of the device initiating the request.
          minLength: 7
          maxLength: 64
          example: 127.0.0.1
        deviceLocation:
          type: string
          description: Latitude and longitude where the device the consumer is attempting to authorize is located. In the format "(sign) latitude/(sign) longitude" with a precision of 2 decimal places. Ex:"38.63/-90.2". Latitude is between -90 and 90. Longitude between -180 and 180.
          minLength: 1
          maxLength: 64
          example: 38.63/-90.2
        consumerIdentifier:
          type: string
          description: Consumer Identifier provided by the token requestor. Not required – Optionally present in AuthorizeService when provided by the wallet provider.
          minLength: 1
          maxLength: 88
          example: 1b24f24a24ba98e27d43e345b532a245e4723d7a9c4f624e93452c1b24f24a24b
      description: Information related to the account holder, such as name, address, etc.
    prm_accountNumber:
      type: string
      description: The Primary Account Number of the card (PAN).
      minLength: 9
      maxLength: 19
      example: '5808123456789808'
    ObjPhoneNumber:
      type: object
      properties:
        countryDialInCode:
          type: string
          description: The country code for the phone number. E.g. 1 for US or 44 for UK.
          minLength: 1
          maxLength: 4
          example: '1'
        phoneNumber:
          type: string
          description: The phone number, may contain country code along with phone number when countryDialInCode is not present.
          minLength: 1
          maxLength: 20
          example: '4692392391'
      description: The mobile phone number of the account holder. Not required.
    prm_services:
      type: array
      description: Array of services that are being requested for the account. Must be one of ; DIGITIZATION = Provision the Funding Account to a device. Max length - Not applicable. Type - Array [String].
      items:
        type: string
        example: DIGITIZATION
    prm_tokenAssuranceLevel:
      type: integer
      description: The assurance level of the token. Between 0 and 99.
      minLength: 1
      maxLength: 2
    ObjcardAccountData:
      required:
      - accountNumber
      type: object
      properties:
        accountNumber:
          type: string
          $ref: '#/components/schemas/prm_accountNumber'
        expiryMonth:
          type: string
          $ref: '#/components/schemas/prm_CardExpiryMonth'
        expiryYear:
          type: string
          $ref: '#/components/schemas/prm_CardExpiryYear'
        securityCode:
          type: string
          $ref: '#/components/schemas/prm_CardSecurityCode'
      description: The card information for the account that is being tokenized.
    prm_requestId:
      type: string
      description: "Unique ID assigned to the request. Use this identification in \ncase you need to report issues.\n"
      example: '123456'
      maxLength: 64
    ObjBodyTokenUpdated:
      type: object
      required:
      - tokens
      properties:
        tokens:
          type: array
          description: Arrary that contains the Tokens which were updated.
          items:
            $ref: '#/components/schemas/ObjToken_StatusUpdate'
    prm_tokenActivatedDateTime:

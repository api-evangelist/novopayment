  schemas:
    MoneyTransferResponse:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - datetime
      - data
      properties:
        code:
          type: string
          example: 200.08.000
          description: Operation response code
          maxLength: 10
          minLength: 10
          pattern: ^[0-9]{3}.[0-9]{2}.[0-9]{3}$
        message:
          type: string
          example: Process Ok
          description: Response code description
          maxLength: 140
          minLength: 1
          pattern: ^[a-zA-Z0-9\s]{1,140}$
        datetime:
          type: string
          example: '2020-01-03T16:05:56.517Z'
          description: Operation Time Stamp in ISO 8601 format
          maxLength: 24
          minLength: 24
        data:
          additionalProperties: false
          type: object
          required:
          - transactionId
          - transactionStatus
          - transactionReference
          properties:
            transactionId:
              type: string
              description: Unique ID of the transaction.
              example: 87b42ea2-2db6-4dab-a5b4-11a41f373179
              maxLength: 36
              minLength: 36
              pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            transactionReference:
              type: string
              description: A value used to related to a financial transaction (**this field should be unique**)
              example: 9a081ed0-3f3d-11eb-b378-0242ac130002
              minLength: 1
              maxLength: 40
              pattern: ^[A-Za-z0-9-]+$
            transactionStatus:
              type: string
              minLength: 6
              maxLength: 8
              description: 'Status of the transaction.

                '
              example: APPROVED
              enum:
              - APPROVED
              - REJECT
    Sender:
      description: Object Sender Information
      type: object
      additionalProperties: false
      required:
      - aliasDirectory
      properties:
        aliasDirectory:
          type: boolean
          description: '__Allowed values:__

            __true__ (with Alias Directory)

            __false__ (without Alias Directory)

            Flag for Alias. boolean represents two values: true and false. Note: that truthy and falsy values such as "true", "", 0 or null are not considered boolean values.

            '
          example: false
        aliasId:
          type: string
          description: 'Unique identifier of an Alias for the Sender, is required if the flag aliasDirectory is true.

            '
          example: 5d1bf399902e42f79681c5be8dfdcb02
          maxLength: 32
          minLength: 32
          pattern: ^.{32,32}$
        paymentInstrumentId:
          type: string
          description: 'Payment Instrument Identification

            '
          example: 9b72e7aaa9804118a40b464c43f19d23
          maxLength: 32
          minLength: 32
          pattern: ^[0-9a-fA-F]{32}$
        paymentInformation:
          description: Payment Info
          type: object
          additionalProperties: false
          required:
          - cardToken
          - cvvNumber
          - cardHolder
          properties:
            cardToken:
              type: string
              description: 'Card data encrypted with the AES256 algorithm.

                The cardToken attribute is composed of the following values:

                PAN: Card’s primary account number or token

                Expiration Date: Card expiration date

                SALT: Random Value StringWith the cardToken 48101473592090212201245 the digits in the position 1-16 are the PAN, the next 4 expiration date, and the last 3 the random value.

                '
              example: Hs3xlaAXURkx+K1yF5nk9w04rZnC3BS17wh/qe+m+lQ=
              maxLength: 44
              minLength: 44
              pattern: \s*|[\w\d=/+]{44}
            cvvNumber:
              type: string
              example: Hs3dddddfgx17wh/qe+m+lQ=
              description: CVV Number Encrypted
              minLength: 24
              maxLength: 24
              pattern: \s*|[\w\d=/+]{24}
            cardHolder:
              $ref: '#/components/schemas/CardHolder'
    PullFundsRequest:
      type: object
      additionalProperties: false
      required:
      - domesticTransaction
      - sender
      - transactionAmount
      - recipient
      - transactionCode
      - transactionReference
      properties:
        domesticTransaction:
          type: boolean
          description: "__Allowed values:__\n__true__ (Domestic Transaction)\n__false__ (Cross-border Transaction)\nTransaction is Domestic or Cross-border. \nboolean represents two values: true and false. Note: that truthy and falsy values such as \"true\", \"\", 0 or null are not considered boolean values\n"
          example: true
        transactionReference:
          type: string
          description: 'A value used to related to a financial transaction (**this field should be unique**)

            '
          example: 9a081ed0-3f3d-11eb-b378-0242ac130002
          maxLength: 40
          minLength: 1
          pattern: ^[A-Za-z0-9-]+$
        systemsTraceAuditNumber:
          type: string
          description: 'A unique value should be used for each API method. However, when passing the (AFTR) method, this value must match the systemsTraceAuditNumber previously passed with the AFT method for the current transaction (**this field should be unique**)


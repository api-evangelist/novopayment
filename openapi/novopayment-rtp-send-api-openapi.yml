openapi: 3.2.0
info:
  contact:
    name: API Support
    email: support@novopayment.com
    url: https://developer.novopayment.com/
  description: The Real-time payments API leverage the newest technologies to pull/push payments amongst VISA or MasterCard branded products such as debit, prepaid, and credit cards to manage transactions between individual banked consumers (P2P).
  version: v1.0.0
  title: Real-Time Payments Rtp Send API
servers:
- description: Sandbox
  url: https://sandbox-api.novopayment.com/realtimepayments/v1
security:
- oAuth2ClientCredentials: []
tags:
- name: Rtp-Send
  description: Rtp Send Money operations
paths:
  /moneytransfer:
    post:
      summary: Money Transfer
      operationId: sendmoney
      tags:
      - Rtp-Send
      description: 'Send funds to any Visa or Mastercard eligible card for domestic and cross-border transactions.


        The funds will be available within 30 minutes.'
      requestBody:
        $ref: '#/components/requestBodies/RQMoneytransfer'
      responses:
        '200':
          $ref: '#/components/responses/RSMoneytransfer200'
        '400':
          $ref: '#/components/responses/RSMoneytransfer400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
        default:
          $ref: '#/components/responses/RS500'
  /moneytransfer/transactions/funds/pull:
    post:
      summary: Pull Funds
      operationId: pull
      tags:
      - Rtp-Send
      description: Pull Transfer, withdraw funds from a sender's card to later send them to a recipient's card.
      requestBody:
        $ref: '#/components/requestBodies/RQPullFunds'
      responses:
        '200':
          $ref: '#/components/responses/RSPullFunds200'
        '400':
          $ref: '#/components/responses/RSPullTransfer400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
        default:
          $ref: '#/components/responses/RS500'
  /moneytransfer/transactions/funds/push:
    post:
      summary: Push Funds
      operationId: push
      tags:
      - Rtp-Send
      description: Push Transfer, adds resources to a recipient's account.
      requestBody:
        $ref: '#/components/requestBodies/RQPushFunds'
      responses:
        '200':
          $ref: '#/components/responses/RSPushFunds200'
        '400':
          $ref: '#/components/responses/RSPushFunds400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
        default:
          $ref: '#/components/responses/RS500'

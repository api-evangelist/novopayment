          type: string
          description: "value used to tie together service calls related to a single financial transaction. When passing Account Funding Transaction (AFT) and an Original Credit Transaction (OCT) methods, this value must differ between the two methods.\nRequirered Format: ydddhhnnnnnn \nThe first four digits must be a valid Julian date in the pattern yddd, where the next three digits are the day number of the year (001-366) and the first digit is the last digit of the current year, 0-9.\nThe two-digit hour in a 24-hour clock (00–23) that is used for the transaction can be represented by hh. \nnnnnnn can be any six-digit number, or it can be the systemsTraceAuditNumber. (**this field should be unique**)\n"
          example: '307511561880'
          maxLength: 12
          minLength: 12
          pattern: \d+
        transactionCode:
          type: string
          description: 'Type of operation, Allowed values: 02: Person to Person (PP). 08: Account to Account (AA). 17(FT)

            '
          example: '02'
          minLength: 2
          maxLength: 2
          pattern: 02|08|17

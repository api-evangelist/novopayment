                    type: number
                    description: Transaction amount.
                    example: 50
                    maxLength: 38
                  fee:
                    type: number
                    description: Fee for transaction.
                    example: 0
                    maxLength: 38
                  tax:
                    type: number
                    description: Transaction tax.
                    example: 0
                    maxLength: 38
                  registrationDate:
                    type: string
                    description: Transaction registration date.
                    example: 2020/10/09 15:24:32
                  internalRef:
                    type: string
                    description: Internal reference generated by the processing core.
                    example: 113000202231
                    maxLength: 12
                  txNumber:
                    type: string
                    description: Complementary Transaction Identifier.
                    example: 859
                    maxLength: 6
                  authCode:
                    type: string
                    description: Transaction authorization code.
                    example: 587456
                    maxLength: 6
                  isPosted:
                    type: boolean
                    description: 'A posted transaction is any transaction that has been confirmed by the card network and by the system, and therefore, the frozen amount is completely deducted from the account balance.


                      __**True:** The transaction has been posted successfully.__


                      __**False:** The transaction has been authorized, however, its not posted/confirmed yet.__

                      '
                    example: true
                    minLength: 4
                    maxLength: 5
                  isReleased:
                    type: boolean
                    description: 'indicates if the transaction was released by the processor. This field applies only when a transaction is Authorized but not confirmed by the card network.


                      __Possible values:__


                      __**True:** if the transaction was released and the blocked balance was returned to the account.__


                      __**False:** The transaction has not been released.__

                      '
                    example: true
                    minLength: 4
                    maxLength: 5
                  releasedDate:
                    type: string
                    description: Datetime when the transaction was released.
                    example: 2021/12/08 16:00:28

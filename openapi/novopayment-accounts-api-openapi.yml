                        example: E4555088EE3BA858346A6E0359B803C38C43EEDE
                        maxLength: 40
                      maskedNumber:
                        type: string
                        description: Masked account number.
                        example: '****************2716'
                        maxLength: 50
                      cardNumber:
                        type: string
                        description: Card number encrypted in AES-256.
                        example: xQ6jqbV1OA3QrS/6dl4XdwWNzS/cbgW+FOiE4PcDRvc
                        maxLength: 50
                  targetAccount:
                    type: object
                    required:

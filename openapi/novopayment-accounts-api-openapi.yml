                    type: string
                    description: 'Transaction type.


                      **Possible values:**


                      + for a credit transaction


                      - for a debit transaction

                      '
                    enum:
                    - +
                    - '-'
                    maxLength: 1
                  creationDate:
                    type: string
                    description: Transaction creation date.
                    example: 2021/12/08 16:00:28

  schemas:
    RSAccountList200:
      type: object
      required:
      - code
      - message
      - datetime
      - data
      properties:
        code:
          type: string
          description: Operation response code
          example: 200.02.000
          maxLength: 10
        message:
          type: string
          description: Response code description
          example: Process Ok
          maxLength: 140
        datetime:
          type: string
          description: Operation time expressed in ISO 8601
          example: '2020-01-03T16:05:56.517Z'
          format: date-time
        data:
          type: object
          required:
          - accounts
          properties:
            accounts:
              type: array
              description: A customized object that contains the account information.
              required:
              - accountId
              - accountType
              - accountStatus
              - maskedNumber
              - createdDate
              - cards
              - accountProgram
              items:
                type: object
                properties:
                  accountId:
                    type: string
                    description: Unique account identifier.
                    example: 4FC9550C979F37B34194113F43A24AAF3AB3DB26
                    maxLength: 40
                  accountType:
                    type: object
                    required:
                    - typeId
                    - description
                    description: 'Customized object.

                      This object contains the account type information.

                      '
                    properties:
                      typeId:
                        type: string
                        description: '**Refer to:** [Account type](https://developer.novopayment.com/api/request-and-response-codes#item-accounttype)

                          '
                        example: 2
                        maxLength: 40
                      description:
                        type: string
                        description: '**Refer to:** [Account type](https://developer.novopayment.com/api/request-and-response-codes#item-accounttype)

                          '
                        example: CHECKING
                        maxLength: 50
                  accountStatus:
                    type: integer
                    description: 'Current account status.


                      **Possible values:**


                      1 ACTIVE


                      2 INACTIVE

                      '
                    enum:
                    - 1
                    - 2
                    maxLength: 38
                  maskedNumber:
                    type: string
                    description: Account masked number.
                    example: '****************2716'
                    maxLength: 50
                  createdDate:
                    type: string
                    description: Account creation date.
                    example: 20/09/29 15:57:43
                  cards:
                    type: array
                    required:
                    - cardId
                    - cardStatus
                    - maskedNumber
                    - expirationDate
                    - cardProgram
                    items:
                      type: object
                      description: Customized array object that contains the list of cards related to the account.
                      properties:
                        cardId:
                          type: string
                          description: Unique card identifier.
                          example: A4B39B6E4F2564359EC7DC27D26F1D30F39377C3
                          maxLength: 40
                        cardStatus:
                          type: integer
                          description: 'Current card status.


                            **Possible values:**


                            1 ACTIVE


                            2 INACTIVE

                            '
                          enum:
                          - 1
                          - 2
                          maxLength: 38
                        maskedNumber:
                          type: string
                          description: asked card number.
                          example: '************7891'
                          maxLength: 20
                        expirationDate:
                          type: string
                          description: Encrypted card expiration date using AES-256 algorithm.
                          example: zkernTnLapf/TEHmP6q5Fw==
                          maxLength: 40
                        cardprogram:
                          type: object
                          required:
                          - cardProgramId
                          - cardBrand
                          description: Customized object Contains the card program information.
                          properties:
                            cardProgramId:
                              type: string
                              description: card program id assigned in configuration.
                              example: 1
                              maxLength: 38
                            cardBrand:
                              type: object
                              required:
                              - brandId
                              - name
                              description: Customized object Contains the card brand information.
                              properties:
                                brandId:
                                  type: string
                                  description: '**Refer to:** [Network Scheme](https://developer.novopayment.com/api/request-and-response-codes#item-networkscheme/brandtype%E2%80%9D)

                                    '
                                  example: 1
                                  maxLength: 10
                                name:
                                  type: string
                                  description: '**Refer to:** [Network Scheme](https://developer.novopayment.com/api/request-and-response-codes#item-networkscheme/brandtype%E2%80%9D)

                                    '
                                  example: Visa
                                  maxLength: 50
                  accountProgram:
                    type: object
                    required:
                    - accountProgramId
                    - accountProgramName
                    - currency
                    description: Customized array object that contains the list of cards related to the account.
                    properties:
                      accountProgramId:
                        type: string
                        description: Unique Program ID for accounts.
                        example: 1
                        maxLength: 5
                      accountProgramName:
                        type: string
                        description: Name of the account program.
                        example: Savings Account
                        maxLength: 30
                      currency:
                        type: object
                        required:
                        - id
                        - currencyName
                        - currencyNumber
                        - description
                        description: Customized object contains the currency information.
                        properties:
                          id:
                            type: string
                            description: '**Refer to:** [Currency Code (3 Char)](https://developer.novopayment.com/api/request-and-response-codes#item-isocurrencycodes)

                              '
                            example: 114
                            maxLength: 5
                          currencyName:
                            type: string
                            description: '**Refer to:** [Currency Name](https://developer.novopayment.com/api/request-and-response-codes#item-isocurrencycodes)

                              '
                            example: USD
                            maxLength: 20
                          currencyNumber:
                            type: string
                            description: '**Refer to:** [Currency Code (Numeric)](https://developer.novopayment.com/api/request-and-response-codes#item-isocurrencycodes)

                              '
                            example: 840
                            maxLength: 40
                          description:
                            type: string
                            description: '**Refer to:** [Country Name](https://developer.novopayment.com/api/request-and-response-codes#item-isocurrencycodes)

                              '
                            example: US Dollar
                            maxLength: 50

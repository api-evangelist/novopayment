openapi: 3.2.0
info:
  title: Novopayment Accounts API
  version: v1
  description: 'Operations tagged Accounts across 2 of this provider''s published API definitions: novopayment-accounts-openapi.yml, novopayment-alias-directory-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Sandbox
  url: https://sandbox-api.novopayment.com/accounts/v1
- description: Sandbox
  url: https://sandbox-api.novopayment.com/aliasdirectory/v1
security:
- oAuth2ClientCredentials: []
tags:
- name: Accounts
paths:
  /customers/{customerId}/accounts:
    post:
      tags:
      - Accounts
      summary: Account and Card Creation
      description: Leveraging a unique customer ID created during client onboarding, and account and card programs created with the Programs API, accounts can be created for individuals or businesses using the Accounts API if NovoPayment’s Virtual Account Opening using the Onboarding API was not used. The operation can include creating only the account or creating an account and issuing a debit card.
      requestBody:
        $ref: '#/components/requestBodies/RQAccountCreation'
      operationId: AccountCreation
      parameters:
      - $ref: '#/components/parameters/customerId'
      responses:
        '200':
          $ref: '#/components/responses/RSAccountCreation200'
        '400':
          $ref: '#/components/responses/RSAccountCreation400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    get:
      tags:
      - Accounts
      summary: Account List
      description: Allows your system or an administrator to retrieve all the accounts associated with a specific customer and information about each of the accounts, such as the account number, type of account, date created, programs, cards associated, etc.
      operationId: AccountList
      parameters:
      - $ref: '#/components/parameters/customerId'
      responses:
        '200':
          $ref: '#/components/responses/RSAccountList200'
        '400':
          $ref: '#/components/responses/RSAccountList400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/accounts/v1
  /customers/{customerId}/accounts/{accountId}:
    get:
      tags:
      - Accounts
      summary: Account Information
      description: This operation allows to get the account information.
      operationId: AccountInformation
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          $ref: '#/components/responses/RSAccountInformation200'
        '400':
          $ref: '#/components/responses/RSAccountInformation400'
        '401':
          $ref: '#/components/responses/RS401'
        '404':
          $ref: '#/components/responses/RSAccountInformation404'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/accounts/v1
  /customers/{customerId}/accounts/{accountId}/balance:
    get:
      tags:
      - Accounts
      summary: Account Balance
      description: This operation allows to retrieve the current account balance.
      operationId: AccountBalance
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          $ref: '#/components/responses/RSAccountBalance200'
        '400':
          $ref: '#/components/responses/RSAccountBalance400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/accounts/v1
  /customers/{customerId}/accounts/{accountId}/block:
    post:
      tags:
      - Accounts
      summary: Block Account
      description: This operation allows blocking temporary or permanent an account.
      requestBody:
        $ref: '#/components/requestBodies/RQBlockAccount'
      operationId: BlockAccount
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          $ref: '#/components/responses/RSBlockAccount200'
        '400':
          $ref: '#/components/responses/RSBlockAccount400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/accounts/v1
  /customers/{customerId}/accounts/{accountId}/unblock:
    post:
      tags:
      - Accounts
      summary: Unblock Account
      description: This operation allows to unblock a currently blocked account.
      requestBody:
        $ref: '#/components/requestBodies/RQUnblockAccount'
      operationId: UnblockAccount
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          $ref: '#/components/responses/RSUnblockAccount200'
        '400':
          $ref: '#/components/responses/RSUnblockAccount400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/accounts/v1
  /customers/{customerId}/accounts/{accountId}/transactions:
    get:
      tags:
      - Accounts
      summary: Account Transactions
      description: 'Allows your system to perform a query to retrieve the details of transactions for a specified customer and account for a client to visualize. The query returns all transactions, including those executed with a debit card. A general search can be filtered based on the direction of the transaction or a date range of transactions. You can optionally limit the maximum number of transactions to return.


        The query will return all relevant transaction details including transaction ID, date, amounts (separating taxes and fees), participating cards or accounts, and more.'
      operationId: AccountTransactions
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          $ref: '#/components/responses/RSAccountTransactions200'
        '400':
          $ref: '#/components/responses/RSAccountTransactions400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    post:
      tags:
      - Accounts
      summary: Create Account To Account Transaction
      description: Perform an internal-to-your-organization Account to Account transfer of funds. Sender specifies receiver’s account ID and transfer amount.
      requestBody:
        $ref: '#/components/requestBodies/RQAccountToAccountTransaction'
      operationId: CreateAccountToAccountTransaction
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          $ref: '#/components/responses/RSAccountToAccountTransaction200'
        '400':
          $ref: '#/components/responses/RSAccountToAccountTransaction400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/accounts/v1
  /customers/{customerId}/accounts/{accountId}/close:
    post:
      tags:
      - Accounts
      summary: Close Account
      description: This operation allows to close an account previously created in the system.
      requestBody:
        $ref: '#/components/requestBodies/RQCloseAccount'
      operationId: CloseAccount
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          $ref: '#/components/responses/RSCloseAccount200'
        '400':
          $ref: '#/components/responses/RSCloseAccount400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/accounts/v1
  /transfers/{transferId}:
    get:
      tags:
      - Accounts
      summary: Transfer Details
      description: This operation can be used to obtain details of a specific transaction.
      operationId: TransferDetails
      parameters:
      - $ref: '#/components/parameters/transferId'
      responses:
        '200':
          $ref: '#/components/responses/RSTransferDetails200'
        '400':
          $ref: '#/components/responses/RSTransferDetails400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/accounts/v1
  /transactions:
    get:
      tags:
      - Accounts
      summary: Tenant Transactions
      description: This operation can be used to list all the transactions for a tenant.
      operationId: TenantTransactions
      responses:
        '200':
          $ref: '#/components/responses/RSTenantTransactions200'
        '400':
          $ref: '#/components/responses/RSTenantTransactions400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/accounts/v1
  /adjustments:
    post:
      tags:
      - Accounts
      summary: Credit Or Debit Adjustment
      description: Allows an administrator to do a credit (+) or debit (-) adjustment to an account, specifying the amount and description of the transaction. In response, NovoPayment sends updated account balance information.
      requestBody:
        $ref: '#/components/requestBodies/RQAdjustments'
      operationId: Adjustments
      responses:
        '200':
          $ref: '#/components/responses/RSAdjustments200'
        '400':
          $ref: '#/components/responses/RSAdjustments400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/accounts/v1
  /alias/account:
    post:
      tags:
      - Accounts
      summary: Create account
      description: This operations creates a new account and associates it to an existing alias.
      operationId: createAccount
      requestBody:
        $ref: '#/components/requestBodies/CreateAccountRequest'
      responses:
        '200':
          $ref: '#/components/responses/RSCreateAccount200'
        '400':
          $ref: '#/components/responses/RSCreateAccount400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
        default:
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/aliasdirectory/v1
  /alias/{aliasId}/account/{accountId}:
    delete:
      tags:
      - Accounts
      summary: Remove account
      description: Remove account associated with an alias
      operationId: removeAccount
      parameters:
      - in: path
        name: aliasId
        required: true
        schema:
          type: string
          maxLength: 32
          minLength: 32
          pattern: ^[0-9a-fA-F]{32}$
        description: Unique identifier of an Alias in NovoPayment. This data is for personal use, it is required for administration and management of your alias.
        example: c3c90deb537246ea8689ed6f5a9a3d23
      - $ref: '#/components/parameters/accountId_2'
      responses:
        '200':
          $ref: '#/components/responses/RSDeleteAccount200'
        '400':
          $ref: '#/components/responses/RSDeleteAccount400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
        default:
          $ref: '#/components/responses/RS500'
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/aliasdirectory/v1

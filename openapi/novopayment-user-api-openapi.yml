openapi: 3.2.0
info:
  title: Novopayment User API
  version: v1
  description: 'Operations tagged User across 2 of this provider''s published API definitions: novopayment-profile.yaml, novopayment-profile-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Sandbox
  url: https://sandbox-api.novopayment.com/profiles/v1
security:
- oAuth2ClientCredentials: []
tags:
- name: User
paths:
  /{customerId}/user/password/recovery:
    post:
      summary: Password Recovery
      description: This operation allows to recover the lost or forgotten password for registered users.
      requestBody:
        $ref: '#/components/requestBodies/RQPasswordRecovery'
      operationId: PasswordRecovery
      parameters:
      - $ref: '#/components/parameters/customerId'
      responses:
        '200':
          $ref: '#/components/responses/RSPasswordRecovery200'
        '400':
          $ref: '#/components/responses/RSPasswordRecovery400'
        '401':
          $ref: '#/components/responses/RS401'
        '500':
          $ref: '#/components/responses/RS500'
      tags:
      - User
    servers:
    - description: Sandbox
      url: https://sandbox-api.novopayment.com/profiles/v1
components:
  examples:
    InvalidAccessToken:
      value:
        code: 401.25.990
        message: Invalid Access Token
        datetime: '2020-01-03T16:05:56.517Z'
    AccessTokenNotApproved:
      value:
        code: 401.25.991
        message: Access Token not approved
        datetime: '2020-01-03T16:05:56.517Z'
    RequestAcknowledgeFailure:
      value:
        code: 400.02.023
        message: It was not possible to acknowledge the request, please try again.
        datetime: '2020-01-03T16:05:56.517Z'
    InternalServerError:
      value:
        code: 500.25.001
        message: Internal Server Error
        datetime: '2020-01-03T16:05:56.517Z'
    AccessTokenExpired:
      value:
        code: 401.25.993
        message: Access token expired
        datetime: '2020-01-03T16:05:56.517Z'
    InvalidSignature:
      value:
        code: 401.25.992
        message: Invalid signature
        datetime: '2020-01-03T16:05:56.517Z'
  responses:
    RSPasswordRecovery200:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RSPasswordRecovery200'
          examples:
            Success:
              value:
                code: 200.25.000
                message: Process Ok
                datetime: '2020-01-03T16:05:56.517Z'
    RS401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RS401'
          examples:
            Invalid Access Token:
              $ref: '#/components/examples/InvalidAccessToken'
            Access Token Not Approved:
              $ref: '#/components/examples/AccessTokenNotApproved'
            Invalid Signature:
              $ref: '#/components/examples/InvalidSignature'
            Access Token Expired:
              $ref: '#/components/examples/AccessTokenExpired'
    RSPasswordRecovery400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RSPasswordRecovery400'
          examples:
            Request Acknowledge Failure:
              $ref: '#/components/examples/RequestAcknowledgeFailure'
    RS500:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RS500'
          examples:
            Internal Server Error:
              $ref: '#/components/examples/InternalServerError'
  schemas:
    RSPasswordRecovery400:
      type: object
      required:
      - code
      - message
      - datetime
      properties:
        code:
          type: string
          example: 400.25.003
          description: Operation response code
          minLength: 10
          maxLength: 10
        message:
          type: string
          example: Params required
          description: Response code description
          maxLength: 140
        datetime:
          type: string
          description: Operation Timestamp
          example: '2020-01-03T16:05:56.517Z'
          format: date-time
    RS500:
      type: object
      required:
      - code
      - message
      - datetime
      properties:
        code:
          type: string
          example: 500.01.999
          description: Operation response code
          minLength: 10
          maxLength: 10
        message:
          type: string
          example: Internal Server Error
          description: Response code description
          maxLength: 140
        datetime:
          type: string
          example: '2020-01-03T16:05:56.517Z'
          description: Operation Timestamp
          format: date-time
    RSPasswordRecovery200:
      type: object
      required:
      - code
      - message
      - datetime
      properties:
        code:
          type: string
          description: Operation response code
          example: 200.25.000
          maxLength: 10
        message:
          type: string
          description: Response code description
          example: Process Ok
          maxLength: 140
        datetime:
          type: string
          description: Operation Timestamp
          example: '2020-01-03T16:05:56.517Z'
          format: date-time
    RQPasswordRecovery:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          description: Email of the account to which you want to recover the password.
          example: johnDoe@example.com
          maxLength: 100
    RS401:
      type: object
      required:
      - code
      - message
      - datetime
      properties:
        code:
          type: string
          example: 401.01.990
          description: Operation response code
          minLength: 10
          maxLength: 10
        message:
          type: string
          example: Invalid Access Token
          description: Response code description
          maxLength: 140
        datetime:
          type: string
          description: Operation Timestamp
          example: '2020-01-03T16:05:56.517Z'
          format: date-time
  requestBodies:
    RQPasswordRecovery:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RQPasswordRecovery'
      required: true
  parameters:
    customerId:
      name: customerId
      in: path
      description: Unique customer identifier.
      required: true
      schema:
        type: string
        example: 43DED66474E259FD
        maxLength: 40
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      description: 'See [Oauth2 API](https://developer.novopayment.com/api/authentication-method-and-encryption/oauth2-api)

        '
      flows:
        clientCredentials:
          tokenUrl: https://sandbox-api.novopayment.com/oauth2/token
          scopes: {}

agent_readiness_notes:
  - >-
    Any agent surface over this API inherits two published gaps: no idempotency key on 163 mutating
    and non-mutating operations, and no rate-limit signalling. Both matter more for an agent than for
    a human integrator.
  - >-
    Reversal paths exist for payments, transfers and card cash movements, but no reversal window is
    documented (conventions/novopayment-conventions.yml).

specification: API Commons Rate Limits
specificationVersion: '0.1'
provider: NovoPayment
providerId: novopayment
generated: '2026-09-17'
method: searched
source: >-
  the 15 provider-published OpenAPI documents plus https://developer.novopayment.com/guides/quick-start,
  https://developer.novopayment.com/guides/how-it-works and https://developer.novopayment.com/api
description: >-
  NovoPayment publishes no rate limits and no throttling signal. This file replaces a 2026-05-04
  scaffold that carried invented free/professional/enterprise tiers; none of those numbers came from
  NovoPayment and none are retained.
limit_count: 0
limits: []
headers: {}
responseCodes: {}
findings:
  - finding: No 429 response is declared on any of the 163 published operations.
    evidence: >-
      Response codes across all 15 specs are 200, 201, 202, 400, 401, 404, 500 and default — 429 is
      absent everywhere.
  - finding: No rate-limit response header is documented.
    evidence: >-
      Neither RateLimit-*, X-RateLimit-* nor Retry-After appears in any spec or on any public page of
      the developer hub.
  - finding: No written quota or fair-use policy.
    evidence: >-
      The Quick Start and How It Works guides describe registration, project creation, token issuance
      and environment promotion, and say nothing about call volume.
consequence: >-
  A client — human or agent — has no published way to know its budget, no runtime signal as it
  approaches one, and no documented back-off contract. Combined with the absence of idempotency
  (conventions/novopayment-conventions.yml), a throttled retry storm has no safe published recovery
  path.
